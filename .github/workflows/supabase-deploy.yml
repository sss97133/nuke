# Supabase Deploy — migrations + edge functions, automatically on merge.
#
# WHO HANDLES DEPLOYS: this workflow. Humans click "merge"; this does the rest.
#
# ONE-TIME SETUP (two clicks, no terminal — github.com → repo → Settings →
# Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL       Supabase dashboard → Project Settings → Database →
#                         Connection string (URI, the pooler one, with password)
#   SUPABASE_ACCESS_TOKEN supabase.com/dashboard/account/tokens → Generate
#
# Behavior:
#   - On push to main touching supabase/: applies ONLY the migration files
#     added in that push (psql, one by one — sidesteps the repo's known
#     migration-history drift that breaks `supabase db push`), then deploys
#     only the edge functions whose directories changed.
#   - Manual run (Actions → Supabase Deploy → Run workflow): applies all
#     migrations with timestamp >= migrations_since and deploys the listed
#     functions. Defaults cover the 2026-06-09/10 batch.

name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'One tracked migration filename, overriding migrations_since (blank = use prefix)'
        required: false
        default: ''
      migrations_since:
        description: 'Apply migrations with filename >= this prefix (blank = none)'
        required: false
        default: '20260609'
      functions:
        description: 'Comma-separated edge functions to deploy (blank = none)'
        required: false
        default: 'universal-search,photo-pipeline-orchestrator'

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with previous commit for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${SUPABASE_DB_URL:-}" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "❌ Need DATABASE_URL / SUPABASE_DB_URL / SUPABASE_DB_PASSWORD in ACTIONS secrets"
            echo "   (repo → Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "⚠ SUPABASE_ACCESS_TOKEN missing — migrations will apply, function deploys will be SKIPPED"
            echo "   Create: supabase.com/dashboard/account/tokens → add to Actions secrets"
          fi
          echo "✅ enough secrets to proceed"

      - name: Determine migrations + functions to deploy
        id: plan
        env:
          REQUESTED_MIGRATION_FILE: ${{ github.event.inputs.migration_file }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SINCE="${{ github.event.inputs.migrations_since }}"
            if [ -n "$REQUESTED_MIGRATION_FILE" ]; then
              bash scripts/ci/select-dispatch-migration.sh "$REQUESTED_MIGRATION_FILE" > /tmp/migrations.txt
            elif [ -n "$SINCE" ]; then
              ls supabase/migrations/ | awk -v s="$SINCE" '$0 >= s' | sed 's|^|supabase/migrations/|' > /tmp/migrations.txt
            else
              : > /tmp/migrations.txt
            fi
            echo "${{ github.event.inputs.functions }}" | tr ',' '\n' | sed '/^$/d' > /tmp/functions.txt
          else
            git diff --name-only --diff-filter=A HEAD^ HEAD -- 'supabase/migrations/*.sql' > /tmp/migrations.txt || true
            git diff --name-only HEAD^ HEAD -- 'supabase/functions/' \
              | awk -F/ '/^supabase\/functions\/[^_]/ {print $3}' | sort -u > /tmp/functions.txt || true
          fi
          echo "── migrations to apply:"; cat /tmp/migrations.txt || true
          echo "── functions to deploy:"; cat /tmp/functions.txt || true

      - name: Resolve database URL
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # A dead candidate host must fail in seconds, not hang the run —
          # the stale Feb-era DATABASE_URL black-holed run 27254257086 for 18min.
          PGCONNECT_TIMEOUT: '10'
        run: |
          # Functions-only runs never touch psql — don't fail the whole
          # deploy resolving a DB connection nothing will use (run 27286973866
          # died here while deploying one edge function).
          if [ ! -s /tmp/migrations.txt ]; then
            echo "no migrations planned — skipping DB resolution"
            exit 0
          fi
          for CANDIDATE in "${DATABASE_URL:-}" "${SUPABASE_DB_URL:-}"; do
            if [ -n "$CANDIDATE" ] && psql "$CANDIDATE" -c "select 1" >/dev/null 2>&1; then
              echo "url=$CANDIDATE" >> $GITHUB_OUTPUT
              echo "connected via stored connection string"
              exit 0
            fi
          done
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "❌ stored connection strings failed and no SUPABASE_DB_PASSWORD to build one"
            exit 1
          fi
          # Build from password: try direct host, then pooler regions (direct
          # host is IPv6-only; GitHub runners are IPv4 — pooler usually wins).
          ENC_PW=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")
          for HOST_USER in \
            "db.qkgaybvrernstplzjaam.supabase.co:5432 postgres" \
            "aws-0-us-west-1.pooler.supabase.com:5432 postgres.qkgaybvrernstplzjaam" \
            "aws-0-us-east-1.pooler.supabase.com:5432 postgres.qkgaybvrernstplzjaam" \
            "aws-0-us-east-2.pooler.supabase.com:5432 postgres.qkgaybvrernstplzjaam" \
            "aws-0-us-west-2.pooler.supabase.com:5432 postgres.qkgaybvrernstplzjaam"; do
            HOST=${HOST_USER%% *}; USER=${HOST_USER##* }
            URL="postgresql://$USER:$ENC_PW@$HOST/postgres"
            if psql "$URL" -c "select 1" >/dev/null 2>&1; then
              echo "url=$URL" >> $GITHUB_OUTPUT
              echo "connected via $HOST"
              exit 0
            fi
            echo "no: $HOST"
          done
          echo "❌ could not connect with SUPABASE_DB_PASSWORD — add full SUPABASE_DB_URL secret instead"
          echo "   (Supabase dashboard → Project Settings → Database → Connection string URI)"
          exit 1

      - name: Apply migrations (psql, in filename order)
        env:
          # Use the URL the resolve step actually verified, not the raw secret.
          SUPABASE_DB_URL: ${{ steps.db.outputs.url }}
          # The postgres role's 10s default statement_timeout killed run
          # 27253881558 mid-CREATE INDEX. 120s is the Hard Rule #12 ceiling;
          # anything heavier (indexes on 30GB+ tables) must be pre-built
          # CONCURRENTLY so the migration's IF NOT EXISTS no-ops.
          PGOPTIONS: -c statement_timeout=120s
        run: |
          if [ ! -s /tmp/migrations.txt ]; then echo "no migrations to apply"; exit 0; fi
          sort /tmp/migrations.txt | while read -r f; do
            [ -f "$f" ] || { echo "skip (not found): $f"; continue; }
            echo "═══ applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "✅ migrations applied"

      - name: Every writing function refuses anonymous callers
        # A function that writes to the database must call requireWriteAuth
        # (supabase/functions/_shared/writeGuard.ts) or be allowlisted there with
        # its own auth. Fails the deploy otherwise — see the script for the rules.
        run: node scripts/guardrails/check-write-guard.mjs

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ ! -s /tmp/functions.txt ]; then echo "no functions to deploy"; exit 0; fi
          npx -y supabase@latest --version
          FNS=""
          while read -r fn; do
            [ -d "supabase/functions/$fn" ] || { echo "skip (no dir): $fn"; continue; }
            FNS="$FNS $fn"
          done < /tmp/functions.txt
          [ -n "$FNS" ] || { echo "nothing to deploy"; exit 0; }
          echo "═══ deploying:$FNS"
          # One CLI call for the whole list: a per-function loop paid the CLI start-up and
          # bundler image pull for every function and could not finish a wide change (the
          # 155-function write-guard commit, 2026-09-27) inside the job timeout.
          # --no-verify-jwt is deliberate (2026-09-27): the gateway check cannot tell the
          # public anon JWT from a real caller and would break Stripe/API-key/webhook
          # callers that carry no JWT at all. Caller identity is judged inside each
          # function by _shared/writeGuard.ts (signature-verified), enforced by the
          # guardrail step above.
          # No --jobs: the CLI accepts it only with --use-api (server-side bundling), and every deploy so far
          # bundled locally — keep the bundler that is known to work (run 36331008968 died on the flag).
          npx -y supabase@latest functions deploy $FNS --project-ref qkgaybvrernstplzjaam --no-verify-jwt
          echo "✅ functions deployed"

      - name: Activate installed retained VIN intake
        env:
          SUPABASE_DB_URL: ${{ steps.db.outputs.url }}
          PGOPTIONS: -c statement_timeout=10s -c lock_timeout=1s
        run: |
          # Initial intake needs both owners; the batch increase needs its
          # matching worker. These migrations pause the job until the exact
          # changed owners deploy successfully. Partial rollouts stay paused.
          if grep -Fxq 'supabase/migrations/20261008023725_retained_vin_reference_intake.sql' /tmp/migrations.txt; then
            if ! grep -Fxq 'batch-vin-decode' /tmp/functions.txt || ! grep -Fxq 'ingest-observation' /tmp/functions.txt; then
              echo 'Retained VIN intake remains paused: both edge owners must deploy.'
              exit 1
            fi
          elif grep -Fxq 'supabase/migrations/20261008064630_tune_canonical_vin_bulk_throughput.sql' /tmp/migrations.txt; then
            if ! grep -Fxq 'batch-vin-decode' /tmp/functions.txt || ! grep -Fxq 'ingest-observation' /tmp/functions.txt; then
              echo 'Retained VIN intake remains paused: both120-record edge owners must deploy.'
              exit 1
            fi
          elif grep -Fxq 'supabase/migrations/20261008054943_stage_canonical_vin_batch_transport.sql' /tmp/migrations.txt; then
            if ! grep -Fxq 'batch-vin-decode' /tmp/functions.txt || ! grep -Fxq 'ingest-observation' /tmp/functions.txt; then
              echo 'Retained VIN intake remains paused: canonical batch and worker must deploy.'
              exit 1
            fi
          elif grep -Fxq 'supabase/migrations/20261008051404_tune_retained_vin_batch_throughput.sql' /tmp/migrations.txt; then
            if ! grep -Fxq 'batch-vin-decode' /tmp/functions.txt; then
              echo 'Retained VIN intake remains paused: matching batch worker must deploy.'
              exit 1
            fi
          else
            exit 0
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo 'Retained VIN intake remains paused: deployment DB unavailable.'
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c 'SELECT public.activate_retained_vin_reference_intake();'

      - name: Activate installed retained listing property intake
        env:
          SUPABASE_DB_URL: ${{ steps.db.outputs.url }}
          PGOPTIONS: -c statement_timeout=10s -c lock_timeout=1s
        run: |
          if ! grep -Fxq 'supabase/migrations/20261008071324_retained_listing_property_intake.sql' /tmp/migrations.txt &&
             ! grep -Fxq 'supabase/migrations/20261008104856_raise_retained_listing_batch_ceiling.sql' /tmp/migrations.txt; then
            exit 0
          fi
          if ! grep -Fxq 'ingest-observation' /tmp/functions.txt || [ -z "$SUPABASE_DB_URL" ]; then
            echo 'Retained listing intake remains paused: canonical owner or database unavailable.'
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c 'SELECT public.activate_retained_listing_property_intake();'

      - name: Activate installed direct protected sale drain
        env:
          SUPABASE_DB_URL: ${{ steps.db.outputs.url }}
          PGOPTIONS: -c statement_timeout=10s -c lock_timeout=1s
        run: |
          if ! grep -Fxq 'supabase/migrations/20261008111928_stage_direct_bat_sale_queue_drain.sql' /tmp/migrations.txt &&
             ! grep -Fxq 'supabase/migrations/20261008133638_tune_retained_sale_parallel_throughput.sql' /tmp/migrations.txt; then
            exit 0
          fi
          if ! grep -Fxq 'ingest-observation' /tmp/functions.txt ||
             ! grep -Fxq 'batch-extract-snapshots' /tmp/functions.txt || [ -z "$SUPABASE_DB_URL" ]; then
            echo 'Protected sale intake remains paused: both existing owners or database unavailable.'
            exit 1
          fi
          # Deployment-owner SQL only; no new API-role activation or raw writes.
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $activate$
          DECLARE j bigint;cmd_hash text;claim_hash text;rate integer;
          BEGIN
            SELECT jobid,encode(sha256(convert_to(command,'UTF8')),'base64') INTO j,cmd_hash
              FROM cron.job WHERE jobname='qualify-bat-archived-sales'
              AND schedule='* * * * *'
              AND encode(sha256(convert_to(command,'UTF8')),'base64') IN
                ('C+rU5RmwHhyj8yqdJqMgDrj7EohcbKHP3aM4um8dlpA=','AWFMWVBSwPlq8ZF2/FpDJNe4z/bmRc5IHjyW5qha2XY=');
            rate:=CASE WHEN cmd_hash='C+rU5RmwHhyj8yqdJqMgDrj7EohcbKHP3aM4um8dlpA=' THEN 2400 ELSE 7200 END;
            claim_hash:=CASE WHEN rate=2400 THEN 'GA2BidAHRpM+bbXoaSgEninREgjbRoE39lsfs7VHEu4='
              ELSE 'xXb1hN6EnQDCcuDEtG+SZJ0nwwYuI6Tfu4u3ocNdsPE=' END;
            IF j IS NULL OR NOT EXISTS(SELECT 1 FROM public.observation_extractors e
              JOIN public.observation_sources s ON s.id=e.source_id WHERE s.slug='bat'
              AND e.slug='bat-archived-sale-v1' AND e.is_active AND e.extractor_type='edge_function'
              AND e.edge_function_name='ingest-observation' AND e.schedule_type='cron'
              AND e.rate_limit_per_hour=rate AND e.min_interval_seconds=60
              AND e.extractor_config='{"mode":"source_sale_qualification","use_source_queue":true,"qualification_version":"v1","model_calls":0}'::jsonb
              AND e.produces_kinds=ARRAY['sale_result']::public.observation_kind[]) OR
              encode(sha256(convert_to(pg_get_functiondef('public.claim_bat_sale_snapshots(text,integer)'::regprocedure),'UTF8')),'base64')
                IS DISTINCT FROM claim_hash THEN
              RAISE EXCEPTION 'Protected sale activation contract changed; keep paused';
            END IF;
            PERFORM cron.alter_job(job_id:=j,active:=true);
          END $activate$;
          SQL

      - name: Summary
        if: always()
        run: |
          echo "📦 Supabase deploy complete."
          echo "Verify: pipeline pulse at /system-status, search latency, photo pipeline drain."
