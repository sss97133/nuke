name: Deploy Preview to Vercel

on:
  pull_request:
    branches:
      - main
    # A preview only matters when the frontend changed; backend-only PRs skip it and free a runner.
    paths:
      - 'nuke_frontend/**'
      - 'vercel.json'
      - '.github/workflows/deploy-preview.yml'

concurrency:
  # A newer push to a pull request supersedes its older run; pushes to main, the schedule and manual runs never cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      # CI has no local project link. Keep preview and production on the same project.
      VERCEL_ORG_ID: team_XppaY5WVxdsJ7Lrw8q2l9NFi
      VERCEL_PROJECT_ID: prj_VkFdy6K0osTSOfR6wRpb5TVYsgA5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nuke_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./nuke_frontend
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@52.0.0

      - name: Pull Vercel Environment Information
        working-directory: ./nuke_frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview

      - name: Build Project Artifacts
        working-directory: ./nuke_frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        working-directory: ./nuke_frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt)
          if [[ ! "$URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a deployment URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const output = `🚀 **Preview Deployment Ready!**
            
            View your changes: ${url}
            
            This preview will be updated automatically as you push new commits.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

