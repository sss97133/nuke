name: Live job-loop smoke

# The job loop against PRODUCTION inside rolled-back transactions (scripts/ci/live-job-loop-smoke.mjs): synthetic users
# created in the transaction post a job, offer, accept, start, quote, accept, attest and accept completion, invoice and
# witness payment, and contact each other through Nuke; the open readers are read as anon and as a signed-in stranger.
# It asserts every Sign works, no reader shows personal information, payment_authorized is never true, the job path
# stages move, and contact threads stay private; then ROLLBACK. Read-only checks on real data: scoreboard shape, the
# owner's profile skills, anon latency under 2 s warm. Afterwards it proves zero net rows (job-loop table counts and
# synthetic-id residue). Reads the database the same way update-stats.yml does (scripts/ci/db-transport.mjs);
# nothing is ever committed.

on:
  schedule:
    - cron: '40 7 * * *'   # daily, 07:40 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-job-loop-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pg is a declared dependency, but the root install pulls heavy native deps (canvas, better-sqlite3);
      # install just the Postgres client into an isolated prefix and point the script at it with PG_MODULE.
      - name: Install the Postgres client
        run: npm install --no-fund --no-audit --prefix "$RUNNER_TEMP/pgdeps" pg@8.18.0

      - name: Job loop against production, rolled back
        env:
          # Run the rolled-back scenarios over a direct Postgres connection, the way supabase-deploy.yml
          # connects. The Actions token SUPABASE_ACCESS_TOKEN lacks the database_read management scope.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PG_MODULE: ${{ runner.temp }}/pgdeps/node_modules/pg/lib/index.js
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/ci/live-job-loop-smoke.mjs --json "${{ runner.temp }}/live-job-loop-smoke.json"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-job-loop-smoke
          path: ${{ runner.temp }}/live-job-loop-smoke.json
          retention-days: 14
