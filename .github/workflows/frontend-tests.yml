name: Frontend Tests (Vitest)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # daily

concurrency:
  # A newer push to a pull request, or to main, supersedes the older run of the same ref; the newest commit holds
  # every older change. The daily schedule and manual runs are their own groups and never cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  autotrader-history-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js for the private historical evidence operator
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Verify immutable assets, retry receipts and revision discovery
        run: node --test scripts/ingest-autotrader-history.test.mjs

  broadcast-overlay-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js for the broadcast overlay readers
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Verify overlay parsing, lot segmentation and displayed-outcome refusals
        run: node --test scripts/broadcast/broadcast-overlay.test.mjs scripts/broadcast/overlay-barrett-jackson.test.mjs

  db-contracts:
    # Every supabase/sql/test_*.sql runs here, each in its own fresh database on this one service, unless a job in a
    # workflow names it or scripts/ci/db-contracts-skip.txt lists it. A new contract needs only its file, not a job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify native canonical collector through HTTP and PostgreSQL
        env:
          BAT_LIVE_PG_TEST: '1'
          DB_CONTRACT_PSQL: psql
        run: |
          set -euo pipefail
          fixture_file="$(mktemp /tmp/nuke-bat-prepared.XXXXXX)"
          trap 'dropdb --if-exists nuke_soft_close_test; psql -X -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE IF EXISTS anon, authenticated, service_role"; rm -f "$fixture_file"' EXIT
          deno run --node-modules-dir=none supabase/sql/prepare_bat_public_live_fixture.ts --stdout > "$fixture_file"
          createdb nuke_soft_close_test
          psql -X -v ON_ERROR_STOP=1 -v bat_fixture_json="$(cat "$fixture_file")" -d nuke_soft_close_test -f supabase/sql/test_bat_public_live_events.sql
          psql -X -v ON_ERROR_STOP=1 -v bat_fixture_json="$(cat "$fixture_file")" -d nuke_soft_close_test -f supabase/sql/test_bat_live_relisted_lot_fold.sql
          deno test --node-modules-dir=none --allow-env --allow-read --allow-run=psql --filter PostgreSQL supabase/functions/ingest-observation/batLiveCollector.test.ts
      - name: Run each database contract in its own fresh database
        run: scripts/ci/run-db-contracts.sh --ci-service

  metric-fold-health-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify exact-file migration recovery scope
        run: python3 scripts/test-dispatch-migration.py
      - name: Verify search pagination, public eligibility and ordered index contracts
        run: bash scripts/test-search-reader-pagination.sh --ci-service
      - name: Create disposable metric-fold assay database
        run: createdb dm_fold_assay_ci
      - name: Verify actual fold-health migration and operational failure contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_fold_assay_ci -f supabase/sql/test_vehicle_metric_fold_health_assay.sql
      - name: Create disposable data-model monitor database
        run: createdb dm_model_health_monitor_ci
      - name: Verify metadata gaps and execution versus output evidence
        run: psql -X -v ON_ERROR_STOP=1 -d dm_model_health_monitor_ci -f scripts/discovery/data-model-health-test.sql
      - name: Create disposable repair-backlog view database
        run: createdb dm_residual_backlog_ci
      - name: Verify the ranked repair-backlog view over the old island view, its columns, gap rules, scope, grants and backlog script
        run: psql -X -v ON_ERROR_STOP=1 -d dm_residual_backlog_ci -f supabase/sql/test_residual_ranked_backlog.sql
      - name: Create disposable graded-lot vision backlog database
        run: createdb dm_graded_lot_vision_ci
      - name: Verify the graded-lot vision backlog view, one row per lot with the newest grade, photo filters, cost constants and grants
        run: psql -X -v ON_ERROR_STOP=1 -d dm_graded_lot_vision_ci -f supabase/sql/test_graded_lot_vision_backlog.sql
      - name: Create disposable classified ask board database
        run: createdb dm_ask_board_ci
      - name: Verify the classified ask board's window, one row per vehicle, place, distance, band, tiers, errors and anon read
        run: psql -X -v ON_ERROR_STOP=1 -d dm_ask_board_ci -f supabase/sql/test_classified_ask_board.sql
      - name: Create disposable bounded pipeline pulse database
        run: createdb dm_pulse_bounded_ci
      - name: Verify exact capped and unavailable pulse readings
        run: psql -X -v ON_ERROR_STOP=1 -d dm_pulse_bounded_ci -f supabase/sql/test_bounded_pipeline_pulse.sql
      - name: Setup Node.js for operator monitor contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify agent declarations and source-reader monitoring boundaries
        run: node --test scripts/assays/data-model-coverage.test.mjs scripts/assays/agent-work-coverage.test.mjs scripts/assays/model-snapshot-comparison.test.mjs scripts/assays/extraction-gold.test.mjs
      - name: Create disposable value-queue retry database
        run: createdb dm_refinement_value_retry_ci
      - name: Verify retained failures, bounded drain and concurrent row locking
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_value_retry_ci -f supabase/sql/test_vehicle_value_queue_retry_retention.sql
      - name: Create disposable canonical input database
        run: createdb dm_refinement_canonical_inputs_ci
      - name: Verify actual canonical trigger dependencies without row replay
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_canonical_inputs_ci -f supabase/sql/test_vehicle_canonical_trigger_inputs.sql
      - name: Create disposable live-pull slot database
        run: createdb dm_bat_live_pull_slots_ci
      - name: Verify the live pull's closing-slot cap, config slot count and pacing guards
        run: psql -X -v ON_ERROR_STOP=1 -d dm_bat_live_pull_slots_ci -f supabase/sql/test_bat_live_pull_slots.sql
      - name: Create disposable live-pull in-flight slot database
        run: createdb dm_bat_live_pull_inflight_ci
      - name: Verify the live pull's run-time pause samples, per-slot in-flight accounting and row locking
        run: psql -X -v ON_ERROR_STOP=1 -d dm_bat_live_pull_inflight_ci -f supabase/sql/test_bat_live_pull_inflight_slots.sql
      - name: Create disposable live board sync database
        run: createdb dm_live_board_sync_ci
      - name: Verify the board-synced houses' schedule writer, bid moves, complete-board ending and health
        run: psql -X -v ON_ERROR_STOP=1 -d dm_live_board_sync_ci -f supabase/sql/test_live_auction_board_sync.sql
      - name: Create disposable comment author key database
        run: createdb dm_refinement_comment_author_keys_ci
      - name: Verify comment author keys at insert and by bounded backfill; retired twin untouched
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_comment_author_keys_ci -f supabase/sql/test_comment_author_keys.sql
      - name: Create disposable comment lot key database
        run: createdb dm_refinement_comment_lot_keys_ci
      - name: Verify comment lot keys by bounded backfill; one candidate keyed, several or none left NULL
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_comment_lot_keys_ci -f supabase/sql/test_comment_lot_keys.sql
      - name: Create disposable episode clock-lock guard database
        run: createdb dm_refinement_clock_lock_guard_ci
      - name: Verify a superseded episode's locked clocks survive lander updates and wholesale metadata writes
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_clock_lock_guard_ci -f supabase/sql/test_vehicle_event_clock_lock_guard.sql
      - name: Create disposable sale-date retraction guard database
        run: createdb dm_refinement_sale_date_retraction_guard_ci
      - name: Verify a sale day retracted as a write clock stays retracted against every lander, the cited writer path passes, and the producer skips write clocks
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_date_retraction_guard_ci -f supabase/sql/test_vehicle_sale_date_retraction_guard.sql
      - name: Create disposable lot identity key database
        run: createdb dm_refinement_auction_event_identity_keys_ci
      - name: Verify lot winner and seller keys at insert, on update and by bounded backfill; junk and contradicted text left NULL
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_auction_event_identity_keys_ci -f supabase/sql/test_auction_event_identity_keys.sql
      - name: Create disposable missing BaT lots database
        run: createdb dm_refinement_missing_bat_lots_ci
      - name: Verify missing BaT lot rows come only from retained evidence; existing lots untouched; idempotent
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_missing_bat_lots_ci -f supabase/sql/test_missing_bat_lots.sql
      - name: Create disposable price-history sale clock database
        run: createdb dm_price_history_sale_clock_ci
      - name: Verify sale price points are clocked at the sale date; other price clocks unchanged
        run: psql -X -v ON_ERROR_STOP=1 -d dm_price_history_sale_clock_ci -f supabase/sql/test_vehicle_price_history_sale_clock.sql
      - name: Create disposable sale-provenance seller-columns database
        run: createdb dm_sale_provenance_seller_ci
      - name: Verify the sale-provenance writer corrects bat_seller and seller_name with citation, guard and audit
        run: psql -X -v ON_ERROR_STOP=1 -d dm_sale_provenance_seller_ci -f supabase/sql/test_sale_provenance_seller_columns.sql
      - name: Create disposable identity equivalence database
        run: createdb dm_refinement_identity_bridge_ci
      - name: Verify the identity bridge, lot chain breaks and their evidence, append-only rows and private access
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_identity_bridge_ci -f supabase/sql/test_identity_equivalence_bridge.sql
      - name: Create disposable merge-writer re-parent database
        run: createdb dm_merge_writer_reparent_ci
      - name: Verify the merge writer re-parents observations, comments, bids and events, never deletes a lot row, and refuses a drifted body
        run: psql -X -v ON_ERROR_STOP=1 -d dm_merge_writer_reparent_ci -f supabase/sql/test_merge_writer_reparent_children.sql
      - name: Create disposable derived-queue chunks database
        run: createdb dm_derived_queue_chunks_ci
      - name: Verify the derived-queue drain gives each queue its time slice, stops on repeated failures, counts completion retries, and refuses a drifted body
        run: psql -X -v ON_ERROR_STOP=1 -d dm_derived_queue_chunks_ci -f supabase/sql/test_vehicle_derived_queue_chunks.sql
      - name: Create disposable vehicle-event supersession database
        run: createdb dm_vehicle_event_supersession_ci
      - name: Verify episode supersession retires the original whole, inserts the cited correction, refuses uncited plans, and readers see the replacement
        run: psql -X -v ON_ERROR_STOP=1 -d dm_vehicle_event_supersession_ci -f supabase/sql/test_vehicle_event_episode_supersession.sql
      - name: Create disposable stack registry database
        run: createdb dm_refinement_stack_registry_ci
      - name: Verify the stack registry's vocabularies, append-only versions, idempotent seed, each need kind resolving present, partial or missing, coverage arithmetic and grants
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_stack_registry_ci -f supabase/sql/test_stack_registry.sql
      - name: Create disposable episode listing-key database
        run: createdb dm_refinement_vehicle_event_listing_ids_ci
      - name: Verify Gooding and RM episode keys by bounded backfill; pseudo-URLs, other hosts and twins left NULL; clocks and locks untouched
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_vehicle_event_listing_ids_ci -f supabase/sql/test_vehicle_event_listing_ids.sql
      - name: Create disposable ownership claim contract database
        run: createdb dm_refinement_ownership_claims_ci
      - name: Verify ownership claims are refused until ratified, spoken only by the comment's author, immutable, and that the relation fold, corroboration, record and weight hold point in time
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_ownership_claims_ci -f supabase/sql/test_ownership_claim_contract.sql
      - name: Create disposable dangling-episode database
        run: createdb dm_refinement_dangling_vehicle_events_ci
      - name: Verify episodes with no vehicle are re-pointed to their lot's one holder, retired whole as duplicates or missing, or held; dry run, partial run, passes and restore
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_dangling_vehicle_events_ci -f supabase/sql/test_dangling_vehicle_events.sql
      - name: Create disposable external-identity location fold database
        run: createdb dm_refinement_fold_external_identity_location_ci
      - name: Verify the fold projects latest non-superseded state/country into metadata (merge, never city, idempotent), writes one receipt, restores app.writer, and is service_role-only
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_fold_external_identity_location_ci -f supabase/sql/test_fold_external_identity_location.sql
      - name: Create disposable lot identity key-at-insert database
        run: createdb dm_refinement_auction_event_identity_keys_at_insert_ci
      - name: Verify the lot key triggers (BEFORE, named columns, never overwrite, stop words and contradicted text left NULL) and the seller fallback through the lot's flagged comment, applied as a non-superuser owner
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_auction_event_identity_keys_at_insert_ci -f supabase/sql/test_auction_event_identity_keys_at_insert.sql
      - name: Create disposable readiness placeholder database
        run: createdb dm_readiness_placeholder_rows_ci
      - name: Verify failed analysis runs add nothing to auction readiness, genuine signals still do, one statement of the body changed, grants unchanged, a drifted body refused
        run: psql -X -v ON_ERROR_STOP=1 -d dm_readiness_placeholder_rows_ci -f supabase/sql/test_compute_auction_readiness_placeholders.sql
      - name: Create disposable live-lot reader database
        run: createdb dm_refinement_live_lot_reader_ci
      - name: Verify the live-lot reader grades a lot against comparables the same time before their close, reads point in time, names a cohort miss, uses the scheduled close in the last minutes, stays service_role-only and writes nothing
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_live_lot_reader_ci -f supabase/sql/test_live_lot_reader.sql
      - name: Create disposable lot identity arrival database
        run: createdb dm_refinement_auction_event_identity_arrival_ci
      - name: Verify an arriving BaT identity keys the lots waiting for it (never a stop word, contradicted text, a set key, another platform or case), skips held rows, caps its work, never fails the identity insert, and reads auction_events only through the partial indexes
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_auction_event_identity_arrival_ci -f supabase/sql/test_auction_event_identity_keys_on_arrival.sql
      - name: Create disposable schema proposal add_source database
        run: createdb dm_refinement_schema_proposal_add_source_ci
      - name: Verify an approved add_source proposal registers its source from the payload (duplicate slugs kept, malformed payloads refused, proposal left open), the other branches unchanged, the body prod plus one branch, a drifted body refused
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_schema_proposal_add_source_ci -f supabase/sql/test_schema_proposal_add_source_contract.sql
      - name: Create disposable per-lot grader database
        run: createdb dm_refinement_grade_hammer_predictions_ci
      - name: Verify hammer predictions are keyed to their lot and graded by it (hammer from auction_events only, scheduled/final/predicted close named, held rows counted by reason), idempotent, receipted under the declared writer, service_role only, lots as the unit in the views, a changed prediction_accuracy refused
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_grade_hammer_predictions_ci -f supabase/sql/test_grade_hammer_predictions_by_lot.sql
      - name: Create disposable vehicle grade key database
        run: createdb dm_refinement_vehicle_grades_fk_ci
      - name: Verify vehicle grades are keyed to an existing vehicle (NOT VALID keeps old orphans, the writer refuses a missing vehicle, the regrade triggers never block their insert, deletion cascades), applied as a non-superuser owner
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_vehicle_grades_fk_ci -f supabase/sql/test_vehicle_grades_vehicle_fk.sql
      - name: Create disposable projection_outcomes key database
        run: createdb dm_refinement_projection_outcomes_key_ci
      - name: Verify projection_outcomes.vehicle_id keys vehicles NOT VALID (old orphans kept and still gradable, new or re-keyed orphans refused, vehicle delete refused, no row written, re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_projection_outcomes_key_ci -f supabase/sql/test_projection_outcomes_vehicle_key.sql
      - name: Create disposable place entity database
        run: createdb dm_refinement_place_entity_ci
      - name: Verify the place entity declaration (county table format checks, NOT VALID keys from location observations and ZIPs, orphans kept, new orphans refused, the substrate declared, registry rows and comments, re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_place_entity_ci -f supabase/sql/test_place_entity_declaration.sql
      - name: Create disposable county key database
        run: createdb dm_refinement_county_key_ci
      - name: Verify county_fips is keyed at intake from the postal code (ZIP and ZIP+4 keyed with method, non-US and unknown ZIPs left alone, receipted idempotent back-fill honouring its batch, service_role only, registry rows, re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_county_key_ci -f supabase/sql/test_key_vehicle_location_county_from_zip.sql
      - name: Create disposable platform entity database
        run: createdb dm_refinement_platform_entity_ci
      - name: Verify the platform entity declaration (observation_sources declared, 22 of 22 columns described with the five existing comments unchanged, registry row extended once, no row written, re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_platform_entity_ci -f supabase/sql/test_platform_entity_declaration.sql
      - name: Create disposable stack coverage snapshots database
        run: createdb dm_refinement_stack_coverage_snapshots_ci
      - name: Verify the stack coverage time series (append-only keyed table with checks, one reading per clock with a receipt, same-clock replay a no-op, series view, service_role only, re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_stack_coverage_snapshots_ci -f supabase/sql/test_stack_coverage_snapshots.sql
      - name: Create disposable stack dominoes database
        run: createdb dm_refinement_stack_dominoes_ci
      - name: Verify the stack domino map (append-only input support and cohort depth tables, exact and estimated source counts, depth per pair with measured zeros, sources under the floor not read, domino and source views, six hypotheses with their support rules, service_role only, daily job, re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_stack_dominoes_ci -f supabase/sql/test_stack_dominoes.sql

      - name: Create disposable vin timeout database
        run: createdb dm_refinement_vin_timeout_ci
      - name: Verify VIN HTTP timeout preserves batch, auth, cadence and pause, and retries safely
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_vin_timeout_ci -f supabase/sql/test_vin_decode_http_timeout.sql
      - name: Create disposable sale residual database
        run: createdb dm_refinement_sale_residual_ci
      - name: Verify monthly source-sale residuals, episode grain, exclusions and same-listing county boundaries
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_residual_ci -f supabase/sql/test_sale_residuals_by_ymm.sql

      - name: Create disposable standing residual database
        run: createdb dm_refinement_sale_residual_worker_ci
      - name: Verify standing residual receipts, keyed edges, replay, retry pause and cached reader
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_residual_worker_ci -f supabase/sql/test_sale_residual_standing_fold.sql
      - name: Verify residual worker concurrency on real PostgreSQL backends
        run: python3 scripts/test-sale-residual-worker-concurrency.py dm_refinement_sale_residual_worker_ci
      - name: Create disposable retained VIN taxonomy database
        run: createdb dm_refinement_vehicle_taxonomy_ci
      - name: Verify retained taxonomy qualification, immutable lineage, replay, bounds and API roles
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_vehicle_taxonomy_ci -f supabase/sql/test_vehicle_taxonomy_fold.sql -f supabase/sql/test_vehicle_taxonomy_attacks.sql
      - name: Verify taxonomy intake under worker locks on real PostgreSQL backends
        run: python3 scripts/test-vehicle-taxonomy-concurrency.py dm_refinement_vehicle_taxonomy_ci
      - name: Verify retained taxonomy bulk bounds, clock lineage and replay
        run: python3 scripts/test-vehicle-taxonomy-throughput.py dm_refinement_vehicle_taxonomy_ci
      - name: Create disposable retained factory reference database
        run: createdb dm_refinement_vin_reference_ci
      - name: Verify typed factory source custody, replay, cached reader, bounded claims and API roles
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_vin_reference_ci -f supabase/sql/test_retained_vin_reference_intake.sql
      - name: Verify factory intake under real backend locks
        run: python3 scripts/test-retained-vin-reference-concurrency.py dm_refinement_vin_reference_ci
      - name: Verify protected factory displacement and exact configuration reach typed consumers
        run: python3 scripts/test-factory-displacement-reader.py dm_refinement_vin_reference_ci --configuration
      - name: Verify measured factory intake cadence and pause guards
        run: python3 scripts/test-retained-vin-reference-cadence.py dm_refinement_vin_reference_ci
      - name: Verify factory batch throughput, staged activation and real bounded claims
        run: python3 scripts/test-retained-vin-reference-throughput.py dm_refinement_vin_reference_ci
      - name: Verify canonical120 bulk staging, source CAS and parallel leases
        run: python3 scripts/test-canonical-vin-bulk-throughput.py dm_refinement_vin_reference_ci
      - name: Verify bulk taxonomy reaches protected factory intake and cached reader
        run: python3 scripts/test-vehicle-taxonomy-throughput.py dm_refinement_vin_reference_ci
      - name: Verify bounded current factory custody health and unavailable reads
        run: python3 scripts/test-vin-reference-intake-health.py dm_refinement_vin_reference_ci
      - name: Create disposable protected archived sale intake database
        run: createdb dm_refinement_bat_sale_intake_ci
      - name: Verify protected capture receipts, private work isolation, retries and bounds
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_bat_sale_intake_ci -f supabase/sql/test_bat_sale_intake.sql -f supabase/sql/test_bat_sale_intake_attacks.sql
      - name: Verify capture deferral lineage and API roles
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_bat_sale_intake_ci -f supabase/sql/test_bat_sale_parent_deferrals.sql
      - name: Create disposable protected sale health database
        run: createdb dm_refinement_sale_health_ci
      - name: Verify bounded protected sale custody and honest coverage
        run: python3 scripts/test-bat-sale-intake-health.py dm_refinement_sale_health_ci
      - name: Verify parallel worker and queue-lock contracts after deferral repair
        run: python3 scripts/test-bat-sale-intake-concurrency.py dm_refinement_bat_sale_intake_ci
      - name: Verify source intake and replay survive real vehicle parent FK locks
        run: python3 scripts/test-bat-sale-parent-locks.py dm_refinement_bat_sale_intake_ci
      - name: Verify protected sale cadence guards and unchanged intake ownership
        run: python3 scripts/test-bat-sale-intake-cadence.py dm_refinement_bat_sale_intake_ci
      - name: Verify direct protected sale40 staging, canonical custody and parallel leases
        run: |
          createdb dm_refinement_sale_direct_ci
          python3 scripts/test-bat-sale-direct-drain.py dm_refinement_sale_direct_ci --throughput
      - name: Create disposable vin decode policy database
        run: createdb dm_refinement_vin_policy_ci
      - name: Verify vin_decoded_data's write policy is scoped to service_role (anon reads, cannot insert or delete; service_role writes; registry row; re-apply a no-op)
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_vin_policy_ci -f supabase/sql/test_vin_decoded_data_policy.sql
