      - name: Create disposable source-sale receipt database
        run: createdb dm_refinement_sale_receipt
      - name: Verify actual valuation reader, source custody and price-cutoff contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_receipt -f scripts/discovery/valuation-source-sale-receipt-test.sql -f supabase/sql/test_sale_residuals_source_integration.sql -f supabase/sql/test_sale_residual_worker_source_integration.sql
      - name: Create disposable canonical price helper database
