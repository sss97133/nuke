        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_price_facts_ci -f supabase/sql/test_vehicle_price_facts_materialized_basis.sql
      - name: Create disposable sale-event candidate database
        run: createdb dm_refinement_sale_event_candidates_ci
      - name: Create disposable organization listing activity database
        run: createdb dm_refinement_org_activity_ci
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify complete organization listing folds and public profile reader
        run: PGDATABASE=dm_refinement_org_activity_ci node scripts/test-organization-listing-activity.mjs
      - name: Create disposable classifieds listing-history database
        run: createdb dm_refinement_listing_history
      - name: Verify retained listing clocks, asking histories, retries and private reader
        run: PGDATABASE=dm_refinement_listing_history node --test scripts/test-facebook-listing-history.mjs
      - name: Create disposable organization refresh cadence database
        run: createdb dm_refinement_org_refresh_ci
      - name: Verify organization refresh activation preserves owner pauses and commands
        run: PGDATABASE=dm_refinement_org_refresh_ci node scripts/test-organization-refresh-cadence.mjs
      - name: Verify earlier resales, episode identity and candidate boundaries
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_event_candidates_ci -f scripts/discovery/sale-event-candidates-test.sql
      - name: Create disposable org-creator database
        run: createdb dm_refinement_create_organization_batch_ci
      - name: Verify create_organization_batch keys by canonical domain then DUNS, COALESCE-fills, counts conflicts, is_public false, service_role-only
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_create_organization_batch_ci -f supabase/sql/test_source_public_organization_profiles.sql
      - name: Setup Node.js for source-episode concurrency controls
        uses: actions/setup-node@v4
