  image-projection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The merge commit and its base, so the replay scope below can diff a pull request.
          fetch-depth: 2
      - name: Scope the retained-listing replay to what it reads
        id: retained
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The four replay steps below take about 20 minutes and read only the files their script names, and the
          # files those name. A pull request or a push to main that changes none of them cannot change their result,
          # so it skips them; the daily schedule and manual runs always replay, which also catches environment drift.
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # A push carrying several commits is diffed only against its last parent here, so it replays in full.
          if [ "$EVENT" = push ] && [ "$BEFORE" != "$(git rev-parse HEAD^1)" ]; then echo run=true >> "$GITHUB_OUTPUT"; echo "replay runs: a multi-commit push"; exit 0; fi
          seen=' '; queue='scripts/test-retained-listing-intake.py'
          while [ -n "$queue" ]; do
            set -- $queue; f=$1; shift; queue="$*"
            case "$seen" in (*" $f "*) continue ;; esac
            seen="$seen$f "
            [ -f "$f" ] || continue
            queue="$queue $(grep -ohE '(supabase|scripts)/[A-Za-z0-9_./-]+[.](py|mjs|js|ts|sql)' "$f" | sort -u | tr '\n' ' ')"
          done
          hits=$(git diff --name-only HEAD^1 HEAD | while read -r c; do case "$seen" in (*" $c "*) echo "$c" ;; esac; done)
          # This workflow file reaches the replay only through its header (everything above jobs:) and this job's own
          # block; a pull request that adds or edits another job cannot change the replay's result.
          replay_def() { git show "$1:.github/workflows/frontend-tests.yml" | awk '/^jobs:/{j=1} !j{print;next} /^  image-projection:/{p=1;print;next} p&&/^  [A-Za-z0-9_-]+:/{p=0} p{print}'; }
          if [ "$(replay_def HEAD^1)" != "$(replay_def HEAD)" ]; then hits="$hits .github/workflows/frontend-tests.yml (header or image-projection)"; fi
          echo "replay reads $(echo $seen | wc -w | tr -d ' ') files"
          if [ -n "$hits" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "replay runs; this change touches: $hits"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::Retained-listing replay skipped: this change touches none of the files it reads. It runs daily and on any change to them."
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cached image projection receipts (offline)
        run: node --test scripts/lib/image-property-projection.test.mjs scripts/lib/cached-image-worker.test.mjs scripts/daily-receipt/byok-drain.test.mjs
      - name: Create disposable cached-image ancestry database
        run: createdb dm_refinement_image_ancestry
      - name: Verify actual cached-image migration, intake and public reader ancestry
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_image_ancestry -f supabase/sql/test_cached_image_source_ancestry.sql
      - name: Verify retained listing property source, clocks and public consumers
        env:
          RETAINED_PROPERTY_TEST_CI: '1'
        run: |
          node scripts/discovery/retained-listing-property-test.mjs
          RETAINED_PROPERTY_TEST_EXTERIOR=1 node scripts/discovery/retained-listing-property-test.mjs
          RETAINED_PROPERTY_TEST_POWERTRAIN=1 node scripts/discovery/retained-listing-property-test.mjs
      - name: Verify retained listing scheduled intake and canonical completion
        if: steps.retained.outputs.run == 'true'
        run: |
          createdb dm_refinement_listing_intake_ci
          python3 scripts/test-retained-listing-intake.py dm_refinement_listing_intake_ci
      - name: Verify retained listing replay reaches recent claims and exhausts both fronts
        if: steps.retained.outputs.run == 'true'
        run: |
          createdb dm_refinement_listing_two_front_ci
          python3 scripts/test-retained-listing-intake.py dm_refinement_listing_two_front_ci --two-front
      - name: Verify retained listing120 staging, leases and canonical source custody
        if: steps.retained.outputs.run == 'true'
        run: |
          createdb dm_refinement_listing_bulk_ci
          python3 scripts/test-retained-listing-intake.py dm_refinement_listing_bulk_ci --two-front --bulk120
      - name: Verify full retained replay, exact assay equality and 500k aggregation plans
        if: steps.retained.outputs.run == 'true'
        run: |
          createdb dm_refinement_listing_powertrain_ci
          python3 scripts/test-retained-listing-intake.py dm_refinement_listing_powertrain_ci --two-front --bulk120 --powertrain --description --odometer --identity --vin-label --craigslist-odometer --craigslist-year --native-year --native-identity --public-identity-evidence
      - name: Create disposable bounded provenance database
        run: createdb dm_refinement_bounded_provenance_ci
      - name: Verify provenance collection limits and preserved source visibility
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_bounded_provenance_ci -f supabase/sql/test_bounded_field_provenance.sql
      - name: Verify bounded cached-image coverage and forbidden reader output
        env:
          IMAGE_ANCESTRY_DATABASE: dm_refinement_image_ancestry
        run: node --test scripts/check-image-observation-health.test.mjs
      - name: Create disposable fresh-image admission database
        run: createdb dm_refinement_fresh_image_admission
      - name: Verify actual pulse migration, admission policy, scope caps and retained grants
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_fresh_image_admission -f supabase/sql/test_fresh_image_admission.sql

