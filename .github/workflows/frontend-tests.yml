        run: |
          deno test --allow-read supabase/functions/mcp-connector/oauth_test.ts
          deno test --allow-read supabase/functions/mcp-connector/surface_test.ts
          deno test --allow-read supabase/functions/mcp-connector/advisor_evidence_test.ts
          deno test --allow-read supabase/functions/mcp-connector/advisor_surface_test.ts
          deno test --allow-read --allow-net supabase/functions/mcp-connector/advisor_live_e2e_test.ts

  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nuke_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./nuke_frontend
        run: npm ci

      - name: Verify actual identity reader with installed dependencies
        run: node --test scripts/test-search-identity-profile-link.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify public search continuation and authenticated ownership (offline)
        run: node --test supabase/functions/universal-search/pagination.test.mjs

      - name: Verify preserved description input and sanctioned intake
        run: node --test scripts/test-description-source-input.mjs scripts/test-listing-description-intake.mjs scripts/test-field-evidence-reader.mjs scripts/test-vin-batch-existing-fields.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify pinned archive custody and deterministic producer (offline)
        run: node --test scripts/test-archive-source-custody.mjs scripts/cab-api-sync.test.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify retained Mecum source preview without intake or network
        run: node --test scripts/test-mecum-source-result.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify saved sale-population assay without network or writes
        run: node --test scripts/assay-sale-population.test.mjs

      - name: Verify public-reader coverage failure detection without network or writes
        run: node --test scripts/assays/public-reader-coverage.test.mjs

      - name: Verify the wrong-byte runner's row test, canonical choice and dry-run default (offline)
        run: node --test scripts/photos/hold-wrong-byte-rows.test.mjs

      - name: Verify the junk listing image runner's list reading, batching and dry-run default (offline)
        run: node --test scripts/photos/supersede-junk-listing-images.test.mjs

      - name: Verify complete Stacks population capture and resumable reads (offline)
        run: node --test nuke_frontend/scripts/test-stacks-population-capture.mjs

      - name: Verify full-population analytical pagination and source inspection (offline)
        run: node --test nuke_frontend/scripts/test-stacks-study-query.mjs

      - name: Run Vitest
        working-directory: ./nuke_frontend
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}

