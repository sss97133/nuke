name: Frontend Tests (Vitest)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # daily

jobs:
  published-buyer-profile-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable published-buyer profile database
        run: createdb dm_refinement_published_buyer_ci
      - name: Verify source presentation and known outcome profile contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_published_buyer_ci -f supabase/sql/test_published_buyer_profile_record.sql

  metric-fold-health-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable metric-fold assay database
        run: createdb dm_fold_assay_ci
      - name: Verify actual fold-health migration and operational failure contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_fold_assay_ci -f supabase/sql/test_vehicle_metric_fold_health_assay.sql
      - name: Create disposable data-model monitor database
        run: createdb dm_model_health_monitor_ci
      - name: Verify metadata gaps and execution versus output evidence
        run: psql -X -v ON_ERROR_STOP=1 -d dm_model_health_monitor_ci -f scripts/discovery/data-model-health-test.sql
      - name: Create disposable bounded pipeline pulse database
        run: createdb dm_pulse_bounded_ci
      - name: Verify exact capped and unavailable pulse readings
        run: psql -X -v ON_ERROR_STOP=1 -d dm_pulse_bounded_ci -f supabase/sql/test_bounded_pipeline_pulse.sql
      - name: Setup Node.js for operator monitor contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify agent declarations and source-reader monitoring boundaries
        run: node --test scripts/assays/data-model-coverage.test.mjs scripts/assays/agent-work-coverage.test.mjs scripts/assays/model-snapshot-comparison.test.mjs
      - name: Create disposable value-queue retry database
        run: createdb dm_refinement_value_retry_ci
      - name: Verify retained failures, bounded drain and concurrent row locking
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_value_retry_ci -f supabase/sql/test_vehicle_value_queue_retry_retention.sql
      - name: Create disposable canonical input database
        run: createdb dm_refinement_canonical_inputs_ci
      - name: Verify actual canonical trigger dependencies without row replay
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_canonical_inputs_ci -f supabase/sql/test_vehicle_canonical_trigger_inputs.sql
      - name: Create disposable live-pull slot database
        run: createdb dm_bat_live_pull_slots_ci
      - name: Verify the live pull's closing-slot cap, config slot count and pacing guards
        run: psql -X -v ON_ERROR_STOP=1 -d dm_bat_live_pull_slots_ci -f supabase/sql/test_bat_live_pull_slots.sql
      - name: Create disposable comment author key database
        run: createdb dm_refinement_comment_author_keys_ci
      - name: Verify comment author keys at insert and by bounded backfill; retired twin untouched
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_comment_author_keys_ci -f supabase/sql/test_comment_author_keys.sql
      - name: Create disposable comment lot key database
        run: createdb dm_refinement_comment_lot_keys_ci
      - name: Verify comment lot keys by bounded backfill; one candidate keyed, several or none left NULL
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_comment_lot_keys_ci -f supabase/sql/test_comment_lot_keys.sql
      - name: Create disposable price-history sale clock database
        run: createdb dm_price_history_sale_clock_ci
      - name: Verify sale price points are clocked at the sale date; other price clocks unchanged
        run: psql -X -v ON_ERROR_STOP=1 -d dm_price_history_sale_clock_ci -f supabase/sql/test_vehicle_price_history_sale_clock.sql
      - name: Create disposable sale-provenance seller-columns database
        run: createdb dm_sale_provenance_seller_ci
      - name: Verify the sale-provenance writer corrects bat_seller and seller_name with citation, guard and audit
        run: psql -X -v ON_ERROR_STOP=1 -d dm_sale_provenance_seller_ci -f supabase/sql/test_sale_provenance_seller_columns.sql
      - name: Create disposable merge-writer re-parent database
        run: createdb dm_merge_writer_reparent_ci
      - name: Verify the merge writer re-parents observations, comments, bids and events, never deletes a lot row, and refuses a drifted body
        run: psql -X -v ON_ERROR_STOP=1 -d dm_merge_writer_reparent_ci -f supabase/sql/test_merge_writer_reparent_children.sql
      - name: Create disposable derived-queue chunks database
        run: createdb dm_derived_queue_chunks_ci
      - name: Verify the derived-queue drain gives each queue its time slice, stops on repeated failures, counts completion retries, and refuses a drifted body
        run: psql -X -v ON_ERROR_STOP=1 -d dm_derived_queue_chunks_ci -f supabase/sql/test_vehicle_derived_queue_chunks.sql

  image-projection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cached image projection receipts (offline)
        run: node --test scripts/lib/image-property-projection.test.mjs scripts/lib/cached-image-worker.test.mjs scripts/daily-receipt/byok-drain.test.mjs
      - name: Create disposable cached-image ancestry database
        run: createdb dm_refinement_image_ancestry
      - name: Verify actual cached-image migration, intake and public reader ancestry
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_image_ancestry -f supabase/sql/test_cached_image_source_ancestry.sql
      - name: Verify retained listing property source, clocks and public consumers
        env:
          RETAINED_PROPERTY_TEST_CI: '1'
        run: |
          node scripts/discovery/retained-listing-property-test.mjs
          RETAINED_PROPERTY_TEST_EXTERIOR=1 node scripts/discovery/retained-listing-property-test.mjs
      - name: Create disposable bounded provenance database
        run: createdb dm_refinement_bounded_provenance_ci
      - name: Verify provenance collection limits and preserved source visibility
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_bounded_provenance_ci -f supabase/sql/test_bounded_field_provenance.sql
      - name: Verify bounded cached-image coverage and forbidden reader output
        env:
          IMAGE_ANCESTRY_DATABASE: dm_refinement_image_ancestry
        run: node --test scripts/check-image-observation-health.test.mjs
      - name: Create disposable fresh-image admission database
        run: createdb dm_refinement_fresh_image_admission
      - name: Verify actual pulse migration, admission policy, scope caps and retained grants
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_fresh_image_admission -f supabase/sql/test_fresh_image_admission.sql

  market-lot-activity-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable current-lot activity database
        run: createdb dm_refinement_market_activity
      - name: Verify actual market migration and public current-lot contract
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_market_activity -f supabase/sql/test_market_lot_activity.sql

  discovery-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify discovery failure and evidence contracts
        run: python3 scripts/discovery/inclusion_pass_test.py

  poller-ledger-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify the poller ledger. Complete means data landed, and failed rows retry on a schedule
        run: deno test supabase/functions/poll-listing-feeds/ledger.test.ts
      - name: Verify ingest writes no vehicle from a URL slug when the page extractor failed
        run: |
          deno test supabase/functions/ingest/slugStub.test.ts
          deno test --no-check --allow-env supabase/functions/ingest/ingest.slugstub.test.ts

  profile-fold-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable contract database
        run: createdb dm_refinement_bat_profile
      - name: Verify the actual profile migration and replay contract
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_bat_profile -f supabase/sql/test_bat_profile_comment_fold.sql
      - name: Create disposable profile privacy database
        run: createdb dm_refinement_profile_privacy_ci
      - name: Verify private column protection and owner-only profile RPC
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_profile_privacy_ci -f supabase/sql/test_profile_column_privacy.sql
      - name: Create disposable photo coverage database
        run: createdb dm_refinement_photo_coverage_ci
      - name: Verify owner source coverage, output fanout and empty-search-path repair
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_photo_coverage_ci -f supabase/sql/test_photo_source_analysis_coverage.sql
      - name: Setup Deno for native auction fixtures
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify daily close reconciliation through canonical native intake
        run: node --test scripts/check-auction-reconciliation.test.mjs
      - name: Verify late recovery watermarks and raw comment cache authorization
        run: node --test scripts/check-structure-review-closeout.test.mjs
      - name: Verify retained source account admission and conflict preservation
        run: deno test supabase/functions/ingest-observation/retainedIdentity.test.ts
      - name: Verify the shared BaT comment builder and author identity links (anonymous never keyed)
        run: deno test supabase/functions/_shared/batAuctionRecord.test.ts
      - name: Verify the shared BaT Chassis/VIN reader (short chassis, I/O/Q and separators land; the check digit still refuses)
        run: deno test supabase/functions/_shared/batChassis.test.ts

  sold-context-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable sold-context contract database
        run: createdb dm_refinement_popup_comps
      - name: Verify supported scope and canonical sale provenance
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_popup_comps -f supabase/sql/test_popup_comps_supported_scope.sql
      - name: Create disposable legacy market-trends database
        run: createdb dm_refinement_market_trends
      - name: Verify existing market-trends privacy and supported-sale contract
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_market_trends -f supabase/sql/test_market_trends_public_sale_eligibility.sql
      - name: Create disposable public-source label database
        run: createdb dm_refinement_market_source_labels
      - name: Verify protected registry and public count lookup contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_market_source_labels -f supabase/sql/test_market_trends_public_source_labels.sql
      - name: Create disposable recorded-sale counts database
        run: createdb dm_refinement_market_counts
      - name: Verify recorded episodes, bounded membership, privacy and cap contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_market_counts -f supabase/sql/test_market_trends_recorded_sale_counts.sql
      - name: Create disposable market-value delta database
        run: createdb dm_refinement_market_delta_ci
      - name: Verify unknown estimates, genuine zero and existing reader access
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_market_delta_ci -f supabase/sql/test_market_value_delta_unknown.sql

  valuation-source-sale-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable source-sale receipt database
        run: createdb dm_refinement_sale_receipt
      - name: Verify actual valuation reader, source custody and price-cutoff contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_receipt -f scripts/discovery/valuation-source-sale-receipt-test.sql
      - name: Create disposable canonical price helper database
        run: createdb dm_refinement_price_facts_ci
      - name: Verify price helper equivalence, lazy dates and invoker privacy
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_price_facts_ci -f supabase/sql/test_vehicle_price_facts_materialized_basis.sql
      - name: Create disposable sale-event candidate database
        run: createdb dm_refinement_sale_event_candidates_ci
      - name: Verify earlier resales, episode identity and candidate boundaries
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_sale_event_candidates_ci -f scripts/discovery/sale-event-candidates-test.sql
      - name: Setup Node.js for source-episode concurrency controls
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify nullable episode ancestry, source custody and two-session races
        run: node scripts/discovery/sale-episode-source-integrity-test.mjs

  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nuke_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./nuke_frontend
        run: npm ci

      - name: Verify actual identity reader with installed dependencies
        run: node --test scripts/test-search-identity-profile-link.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify preserved description input and sanctioned intake
        run: node --test scripts/test-description-source-input.mjs scripts/test-listing-description-intake.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify pinned archive custody and deterministic producer (offline)
        run: node --test scripts/test-archive-source-custody.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify retained Mecum source preview without intake or network
        run: node --test scripts/test-mecum-source-result.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/nuke_frontend/node_modules

      - name: Verify saved sale-population assay without network or writes
        run: node --test scripts/assay-sale-population.test.mjs

      - name: Verify public-reader coverage failure detection without network or writes
        run: node --test scripts/assays/public-reader-coverage.test.mjs

      - name: Run Vitest
        working-directory: ./nuke_frontend
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}

  listing-state-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create disposable listing-state contract database
        run: createdb dm_fold_listing
      - name: Verify event queue fold and public evidence reader
        run: psql -X -v ON_ERROR_STOP=1 -d dm_fold_listing -f supabase/sql/test_listing_observation_consensus.sql
      - name: Create disposable listed-engine contract database
        run: createdb dm_fold_listed_engine
      - name: Verify source-bound listed engine phrases and existing listing contracts
        run: psql -X -v ON_ERROR_STOP=1 -d dm_fold_listed_engine -f supabase/sql/test_listed_engine_reported_state.sql
      - name: Create disposable intake reconciliation database
        run: createdb dm_fold_reconcile_ci
      - name: Verify retained evidence, typed relations, current fold and reader reconciliation
        run: psql -X -v ON_ERROR_STOP=1 -d dm_fold_reconcile_ci -f scripts/discovery/intake-reader-reconciliation-test.sql
      - name: Create disposable configuration relation database
        run: createdb dm_refinement_config_relations
      - name: Verify property, model and factory reference repair diagnostics
        run: psql -X -v ON_ERROR_STOP=1 -d dm_refinement_config_relations -f scripts/discovery/configuration-catalog-relations-test.sql
      - name: Create disposable full-description reader database
        run: createdb dm_fold_description
      - name: Verify full native listing prose and qualified public reader
        run: psql -X -v ON_ERROR_STOP=1 -d dm_fold_description -f supabase/sql/test_vehicle_listing_description_reader.sql
