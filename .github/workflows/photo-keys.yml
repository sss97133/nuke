name: Photo Keys Lane

# Two jobs. `keys` is dispatch-only (step=keys or step=properties): nothing there runs unless a person starts it.
# `stages` runs on the schedule below (and on dispatch with step=stages): the frame reader the Mac's launchd job runs
# (scripts/photo-pipeline/subscription-frame-classifier.mjs), against the same image_stage_work ledger, so reading does
# not depend on the Mac being on. The two share one queue: claim_image_stage_work hands a row only while it is queued
# (for update skip locked) and a claim holds it until its receipt or lease_until; release_expired_image_stage_work (cron
# image-stage-reconciler, every 10 minutes) puts an expired claim back. See the stages job for its bounds and log rules.
#
# step=keys keys what readers have ALREADY stored about one vehicle's photos, one photo at a time
# (scripts/photo-pipeline/keys_lane.py). It reads no photo. With write off it is a dry run and writes nothing.
# Auth is the Claude subscription (repo secret CLAUDE_CODE_OAUTH_TOKEN), as in byok-analysis-drain.yml.
# ANTHROPIC_API_KEY is never set here: it takes precedence over the subscription token and bills the API.
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CLAUDE_CODE_OAUTH_TOKEN.
# This repository and its logs are public: there are no default ids, the two ids never enter a step's env
# block (which the log prints), and the lane prints counts only. No artifact is uploaded.
#
#   gh workflow run photo-keys.yml -f vehicle_id=<uuid> -f user_id=<uuid> -f photos=1 -f write=false
#
# step=properties runs the other thing this vehicle's stored readings can give without a model: the three values a
# deep reading already holds (rust severity, paint stage, assembly state), copied to their registered properties by
# the existing projection. It needs the two database secrets only.
#   gh workflow run photo-keys.yml -f step=properties -f vehicle_id=<uuid> -f user_id=<uuid> -f photos=99 -f pages=10
#
# step=stages runs the scheduled job now (vehicle_id and user_id are not used; the owner comes from platform_config):
#   gh workflow run photo-keys.yml -f step=stages

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      vehicle_id:
        description: Vehicle whose stored photo readings are keyed (uuid; keys and properties, which refuse a run without it)
        required: false
        type: string
      user_id:
        description: Owner of those photos (uuid; keys, which refuses a run without it)
        required: false
        type: string
      photos:
        description: How many photos to key, one at a time (1 to 99)
        type: string
        default: '1'
      model:
        description: Claude model
        type: string
        default: 'sonnet'
      after:
        description: Start after this photo (the 8-character cursor a run printed); empty starts from the first
        type: string
        default: ''
      write:
        description: Land the keyed claims (false = dry run, nothing is written)
        type: boolean
        default: false
      step:
        description: "keys = place stored statements on keys (a model call a photo). properties = copy the three values a stored reading already holds (no model call). stages = one scheduled fire of the frame reader now"
        type: choice
        options: [keys, properties, stages]
        default: keys
      pages:
        description: properties only. How many windows of `photos` stored readings to walk, newest first (1 to 99). A reading whose values a row already holds is passed over, so a second run goes on where the first stopped
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  keys:
    if: github.event_name == 'workflow_dispatch' && inputs.step != 'stages'
    runs-on: ubuntu-latest
    concurrency:
      group: photo-keys
      cancel-in-progress: false
    # One model call a photo, each cut off at 240 s. A run the timeout ends keeps what it landed and loses
    # only its summary; the lane prints one line a photo so the log still says how far it got.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22: the database client used by step=properties needs the WebSocket that Node has from 22 on.
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - &install-claude
        name: Install the claude CLI
        if: inputs.step != 'properties'
        # The lane itself is standard-library Python; the CLI is its only dependency.
        run: npm install -g @anthropic-ai/claude-code

      - &check-subscription
        name: Check the subscription sign-in (no model call, no database call)
        if: inputs.step != 'properties'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          unset ANTHROPIC_API_KEY
          echo "cred-check | CLAUDE_CODE_OAUTH_TOKEN length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN (subscription) not set."; exit 4; }
          claude --version
          auth_result=$(mktemp); auth_error=$(mktemp); rc=0
          trap 'rm -f "$auth_result" "$auth_error"' EXIT
          claude auth status >"$auth_result" 2>"$auth_error" || rc=$?
          # The drain's diagnostic, with one assertion added: an API-key login is refused, because it bills the API.
          node - "$auth_result" "$rc" <<'JS'
          const fs = require('node:fs');
          let result;
          try { result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch {}
          const methods = ['none', 'claude.ai', 'oauth_token', 'api_key', 'api_key_helper', 'third_party'];
          console.log(JSON.stringify({exit: Number(process.argv[3]),
            parsed: !!result, loggedIn: result?.loggedIn === true,
            authMethod: methods.includes(result?.authMethod) ? result.authMethod : 'unknown',
            model_calls: 0, database_calls: 0}));
          const billsTheApi = ['api_key', 'api_key_helper', 'third_party'].includes(result?.authMethod);
          process.exit(Number(process.argv[3]) === 0 && result?.loggedIn === true && !billsTheApi ? 0 : 4);
          JS

      - name: Run keys lane
        if: inputs.step != 'properties'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEYS_PHOTOS: ${{ inputs.photos }}
          KEYS_MODEL: ${{ inputs.model }}
          KEYS_AFTER: ${{ inputs.after }}
          KEYS_WRITE: ${{ inputs.write }}
        run: |
          unset ANTHROPIC_API_KEY
          # Inputs reach the script as data, never spliced into this script. The two ids come from the event
          # file and not from env, because a step's env block is printed at the top of its log. They are
          # checked without being echoed, then masked.
          KEYS_VEHICLE_ID="$(jq -r '.inputs.vehicle_id // ""' "$GITHUB_EVENT_PATH")"
          KEYS_USER_ID="$(jq -r '.inputs.user_id // ""' "$GITHUB_EVENT_PATH")"
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          count='^[1-9][0-9]?$'
          name='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          cursor='^[0-9a-f]{8}$'
          [[ "$KEYS_VEHICLE_ID" =~ $uuid ]] || { echo "::error::vehicle_id is not a lowercase uuid"; exit 2; }
          [[ "$KEYS_USER_ID" =~ $uuid ]] || { echo "::error::user_id is not a lowercase uuid"; exit 2; }
          echo "::add-mask::$KEYS_VEHICLE_ID"
          echo "::add-mask::$KEYS_USER_ID"
          [[ "$KEYS_PHOTOS" =~ $count ]] || { echo "::error::photos must be 1 to 99"; exit 2; }
          [[ "$KEYS_MODEL" =~ $name ]] || { echo "::error::model is not a plain model name"; exit 2; }
          [[ -z "$KEYS_AFTER" || "$KEYS_AFTER" =~ $cursor ]] || { echo "::error::after must be the 8-character cursor a run printed"; exit 2; }
          [ -n "$SUPABASE_URL" ] || { echo "::error::SUPABASE_URL not set."; exit 2; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY not set."; exit 2; }
          args=(--vehicle-id "$KEYS_VEHICLE_ID" --user-id "$KEYS_USER_ID" --photos "$KEYS_PHOTOS" --model "$KEYS_MODEL")
          if [ -n "$KEYS_AFTER" ]; then args+=(--after "$KEYS_AFTER"); fi
          if [ "$KEYS_WRITE" = "true" ]; then args+=(--write); fi
          # The lane's exit code is the step's: 0 work done or nothing left; 1 a read failed, the writer did not
          # take what was sent, or the model call failed for three photos in a row; 2 bad input; 3 usage limit;
          # 4 authentication; 5 no photo could be keyed.
          # -u: one line a photo reaches the log as it happens, so a run the timeout ends still shows how far it got.
          python3 -u scripts/photo-pipeline/keys_lane.py "${args[@]}"

      # The existing projection (scripts/deep-image-analysis-byok.mjs project-cached, scripts/lib/image-property-projection.mjs):
      # a stored deep reading already holds rust_severity, paint_state and completeness for its photo, and the registry has
      # a property for each. No model is called and no key is needed but the database's. An owner's own photos go one
      # claim at a time through ingest-observation (--single), because the batch intake takes listing photos only.
      - &install-database-client
        name: Install the database client (step=properties, and the stages job for keyed values)
        # stages: the keyed values stage (deep-stage.mjs keyedValuesForFrame) resolves the same client from the checkout
        if: inputs.step == 'properties' || inputs.step == 'stages' || github.event_name == 'schedule'
        # Its own step, with no secret in its environment and install scripts off. One package, at the version this
        # was run with, installed beside the checkout and linked in: not the repository's whole tree.
        run: |
          mkdir -p "$RUNNER_TEMP/sb" node_modules
          (cd "$RUNNER_TEMP/sb" && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund '@supabase/supabase-js@2.119.0' >/dev/null)
          ln -s "$RUNNER_TEMP/sb/node_modules/@supabase" node_modules/@supabase

      - name: Copy the stored readings' three values to their registered properties
        if: inputs.step == 'properties'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEYS_PHOTOS: ${{ inputs.photos }}
          KEYS_PAGES: ${{ inputs.pages }}
          KEYS_WRITE: ${{ inputs.write }}
        run: |
          KEYS_VEHICLE_ID="$(jq -r '.inputs.vehicle_id // ""' "$GITHUB_EVENT_PATH")"
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          count='^[1-9][0-9]?$'
          [[ "$KEYS_VEHICLE_ID" =~ $uuid ]] || { echo "::error::vehicle_id is not a lowercase uuid"; exit 2; }
          echo "::add-mask::$KEYS_VEHICLE_ID"
          [[ "$KEYS_PHOTOS" =~ $count ]] || { echo "::error::photos must be 1 to 99"; exit 2; }
          [[ "$KEYS_PAGES" =~ $count ]] || { echo "::error::pages must be 1 to 99"; exit 2; }
          [ -n "$SUPABASE_URL" ] || { echo "::error::SUPABASE_URL not set."; exit 2; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY not set."; exit 2; }
          # --single on the dry run too, so its counts are what a write would send (the same refusals, the same skips).
          args=(project-cached --vehicle-id "$KEYS_VEHICLE_ID" --limit "$KEYS_PHOTOS" --pages "$KEYS_PAGES" --single)
          if [ "$KEYS_WRITE" = "true" ]; then args+=(--apply); fi
          rc=0
          node scripts/deep-image-analysis-byok.mjs "${args[@]}" >"$RUNNER_TEMP/receipt" 2>"$RUNNER_TEMP/said" || rc=$?
          # This log is public. From the receipt: the named counts, and words made of a to z and "_" only. No vehicle
          # id, no row id, no list. From stderr: the script's own fixed error line, or only how many lines there were.
          show='objects | {mode, route, sampled_condition_rows, source_rows, eligible_claims, window_limit, pages_walked,
            reached_oldest_row, model_calls, already_projected, already_projected_superseded, released_intent_only_clarification, inserted, duplicates,
            verified, failed, unattempted, reason,
            deferred: ((.deferred // {}) | if type == "object" then with_entries(select((.key | test("^[a-z_]{1,40}$")) and (.value | type) == "number")) else {} end)}
            | with_entries(select((.value | type) as $t | $t == "number" or $t == "boolean" or $t == "object" or ($t == "string" and (.value | test("^[a-z_]{1,40}$")))))'
          line="$( { [ -s "$RUNNER_TEMP/receipt" ] && tail -n 1 "$RUNNER_TEMP/receipt" | jq -ce "$show" 2>/dev/null; } || true )"
          if [ -n "$line" ]; then echo "$line"; else echo "no receipt was printed"; fi
          said="$(grep -m1 -oE '^Error: project-cached: [a-z ]{1,60}$' "$RUNNER_TEMP/said" || true)"
          if [ -n "$said" ]; then echo "$said"; elif [ -s "$RUNNER_TEMP/said" ]; then echo "stderr: $(wc -l < "$RUNNER_TEMP/said") lines withheld"; fi
          {
            echo "### Stored readings to registered properties ($([ "$KEYS_WRITE" = "true" ] && echo write || echo 'dry run'))"
            if [ -n "$line" ]; then echo "$line" | jq -r 'to_entries[] | "- \(.key): \(.value | tojson)"'; else echo "- no receipt was printed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  stages:
    if: github.event_name == 'schedule' || inputs.step == 'stages'
    # macOS: the reader converts HEIC and other formats to JPEG with `sips` (deps.convert). macos-latest is a standard
    # GitHub-hosted runner, free and unlimited on a public repository.
    runs-on: macos-latest
    # One bounded fire: 20 first reads, 10 deep readings (the deep phase also stops starting photos after 420 s), 30 keyed
    # values. The reader is ended at 21 minutes; leases (first reads 3000 s, keyed values 1800 s, deep chunks 900 s) are
    # longer than this job, so a run that is cut off cannot have its photos handed to the Mac while it still reads them.
    timeout-minutes: 25
    concurrency:
      group: photo-keys-stages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The keys job's own steps: the CLI, the sign-in check that refuses an API-key login, and the database client.
      - *install-claude
      - *check-subscription
      - *install-database-client

      - name: Read the image stage queue (first reads, deep readings, keyed values)
        shell: bash
        timeout-minutes: 23
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          [ -n "$SUPABASE_URL" ] || { echo "::error::SUPABASE_URL not set."; exit 2; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY not set."; exit 2; }
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN (subscription) not set."; exit 4; }
          # The secret was stored with a line break inside it (the first fire, 2026-11-24: the CLI refused it as "contains a
          # line break at character 80"; `claude auth status` does not catch that). The token is one line: rejoin it, mask the
          # rejoined value (a multi-line secret is masked line by line), and refuse any other whitespace.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '\r\n')"
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          export CLAUDE_CODE_OAUTH_TOKEN
          case "$CLAUDE_CODE_OAUTH_TOKEN" in *[[:space:]]*) echo "::error::CLAUDE_CODE_OAUTH_TOKEN holds whitespace"; exit 4;; esac
          # --owner config: the reader takes the one owner platform_config image_stage_reconciler.user_ids names, so no id
          # is in this file, on a command line or in the log. Same model, flags and reader name as the Mac's full fire.
          started=$(date +%s); rc=0
          node scripts/photo-pipeline/subscription-frame-classifier.mjs --owner config --limit 20 --concurrency 2 \
            --status failed,pending --deep-limit 10 --keyed-limit 30 >"$RUNNER_TEMP/summary" 2>"$RUNNER_TEMP/said" &
          reader=$!
          ( sleep 1260; kill -TERM "$reader" 2>/dev/null ) & dog=$!
          wait "$reader" || rc=$?
          kill "$dog" 2>/dev/null || true
          summary="$(tail -n 1 "$RUNNER_TEMP/summary" 2>/dev/null || true)"
          # This log is public. From the summary: named counts, and words made of a to z and "_" only (an allowlist: by_type
          # is model output, error_text is free text, and neither is printed). From stderr, which names photos: its line
          # count only. Nothing else the reader wrote is shown.
          show='def word: if type == "string" and test("^[a-z_]{1,40}$") then . else null end;
            def counts: if type == "object" then with_entries(select((.key | test("^[a-z_]{1,40}$")) and (.value | type) == "number")) else {} end;
            def take($names): . as $o | $names | map({key: ., value: $o[.]}) | from_entries | with_entries(select((.value | type) == "number"));
            def stage: if type != "object" then {} else . as $s
              | take(["claimed", "started", "succeeded", "policy_skip", "unavailable", "blocked_input", "rate_limited", "failed", "receipts",
                      "receipt_errors", "reads_valid", "agreed_all", "posted_values", "held_pictures", "aborted", "values", "read_seconds",
                      "input_tokens", "output_tokens"])
                + {stopped: ($s.stopped | word), skipped: ($s.skipped | word), claim_error: ($s.claim_error | word), error: ($s.error | word),
                   error_classes: ($s.error_classes | counts), skip_reasons: ($s.skip_reasons | counts), disagreements: ($s.disagreements | counts)} end;
            objects | . as $t
            | take(["frames", "read", "accepted", "classifier_rejected", "errors", "receipts", "receipt_errors", "read_seconds"])
              + {cli: ($t.cli | word), stopped: ($t.stopped | word), error_classes: ($t.error_classes | counts),
                 stages: {deep_reading: ($t.stages.deep_reading | stage), keyed_values: ($t.stages.keyed_values | stage)}}'
          line="$( { [ -n "$summary" ] && printf '%s\n' "$summary" | jq -ce "$show" 2>/dev/null; } || true )"
          echo "reader exit $rc"
          if [ -n "$line" ]; then echo "$line"; else echo "no summary was printed"; fi
          echo "stderr: $(wc -l < "$RUNNER_TEMP/said" | tr -d ' ') lines withheld"
          {
            echo "### Image stage queue (exit $rc)"
            if [ -n "$line" ]; then echo "$line" | jq -r 'to_entries[] | "- \(.key): \(.value | tojson)"'; else echo "- no summary was printed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The heartbeat, as the Mac posts it (reader-heartbeat.mjs: nothing is posted when the reader failed or printed
          # no summary). record_reader_heartbeat admits one name for this reader, so this run writes the Mac's row; host
          # says which wrote it. The summary travels in the environment and is parsed as JSON, never run.
          READER_NAME=subscription-frame-classifier READER_HOST=github_actions READER_SUMMARY="$summary" READER_EXIT="$rc" \
            READER_ELAPSED_MS="$(( ( $(date +%s) - started ) * 1000 ))" node scripts/photo-pipeline/reader-heartbeat.mjs 2>/dev/null || true
          exit "$rc"
