name: Update Stats

# Measures the live database and rewrites the numbers block in README.md
# and the library counts in docs/library/README.md (scripts/data/readme-stats.mjs).
# Read-only queries; at most one commit a day,
# marked [skip ci] so it triggers no build or deploy.

on:
  schedule:
    - cron: '20 6 * * *'   # daily, 06:20 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  readme-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Measure the live database and rewrite the README block
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/data/readme-stats.mjs

      - name: Commit if the block changed, rebase onto a moving main, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/library/README.md
          if git diff --staged --quiet; then echo "README block unchanged"; exit 0; fi
          git commit -m "stats: $(date -u +%F) measured from the live database [skip ci]"
          # main moves while we measure; rebase our one README commit onto it, three tries.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          echo "push failed after 3 attempts"; exit 1
