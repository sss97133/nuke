name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# One production deploy at a time, in push order. Two overlapping `vercel deploy --prod` runs race for the
# nuke.ag alias and the last to finish wins: on 2026-09-30 #460's run (started 14 s before #458's, built from a
# commit without #458) finished last, so nuke.ag served the old MAP tab for ~25 min while #458's own deployment
# was ready. A queued run waits; a newer push replaces an older pending one, so the newest commit deploys last.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_XppaY5WVxdsJ7Lrw8q2l9NFi
      VERCEL_PROJECT_ID: prj_VkFdy6K0osTSOfR6wRpb5TVYsgA5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nuke_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./nuke_frontend
        run: npm ci

      - name: Build project
        working-directory: ./nuke_frontend
        run: |
          echo "🔨 Building project..."
          npm run build || {
            echo "❌ Build failed!"
            echo "Checking for common issues..."
            ls -la src/components/parts/ || echo "parts directory missing"
            echo "Full build error:"
            exit 1
          }
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        run: npm install --global vercel@52.0.0

      - name: Deploy to Vercel Production
        working-directory: ./nuke_frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy to the Vercel project that owns the custom domain (nuke.ag).
          # Run from the frontend so its SPA rewrites and dist output are used.
          DEPLOY_URL=$(vercel deploy --prod --force --yes)
          if [[ ! "$DEPLOY_URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a deployment URL" >&2
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployment ready: $DEPLOY_URL"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Production URL: https://nuke.ag"
          echo "📊 View details: https://vercel.com/dashboard"

