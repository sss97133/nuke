e Sport Exhaust (PSE), Porsche Active Suspension Management (PASM), and Porsche Torque Vectoring Plus (PTV Plus), an electric glass sunroof, heated front seats, a heated steering wheel, Porsche crests embossed on the headrests, Porsche Entry &amp; Drive keyless entry and starting, privacy glass, Sound Package Plus, and USB/iPod connectivity.</li><li>It is accompanied by the original owner's manual, a Porsche car cover, two keys, and service documentation.</li></ul><p><strong>CONDITION</strong></p><ul><li>Please refer to the photo gallery to assess the exterior and interior condition.</li></ul><p><strong>SERVICE HISTORY</strong></p><ul><li>It was most recently serviced in April 2026 at 22,617 km by Continental Cars.\u00a0</li></ul><p><strong>SUMMARY</strong></p><p>The Porsche 911 Carrera S remains a highly capable and desirable modern sports car, blending impressive performance with everyday usability. This black-on-black example would make a rewarding driver's car for weekend blasts or longer tours, and a notable addition to any collection of modern performance icons.</p><p><strong>Descriptions are provided by the seller and, to their knowledge, are accurate and not misleading. Buyers must satisfy themselves of the description's accuracy, and independent research is strongly advised. Enquiries should be raised in the comments section and any inspections arranged before bidding.</strong></p><p><strong>Classic and collectible vehicles may have had cosmetic or bodywork repairs that are not visually apparent. Photographs may not accurately reflect colour or condition, so buyers should confirm key details directly with the seller. Unless stated otherwise, you must assume that any cherished, personalised, or heritage vehicle registration is not included in the sale of a car or bike. Please see our Terms and Conditions for full details.</strong></p><p><br /></p><p><br /></p>\n"])</script></body></html>
