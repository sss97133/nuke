title = "Nuke Key Guardian"

[allowlist]
  description = "Allowlist"
  paths = [
    '''.env\.example''',
    '''\.env\.vault''',
    '''node_modules''',
    '''\.git/''',
    '''/tmp/''',
  ]
  regexes = [
    '''PLACEHOLDER''',
    '''your-.*-key''',
    '''<your-''',
    '''sk_test_51SKWCO''',  # already-rotated test keys known to be in history
    '''^ebf9109d7d01bb4b636f2da0b8eccda4$''',  # AEM 30-2131 instruction sheet: the document hash in its public URL (documents.aemelectronics.com), not a token
  ]

[[rules]]
  id = "stripe-secret-key"
  description = "Stripe Secret Key"
  regex = '''sk_(live|test)_[0-9a-zA-Z]{24,}'''
  tags = ["key", "stripe"]

[[rules]]
  id = "stripe-restricted-key"
  description = "Stripe Restricted Key"
  regex = '''rk_(live|test)_[0-9a-zA-Z]{24,}'''
  tags = ["key", "stripe"]

[[rules]]
  id = "stripe-webhook-secret"
  description = "Stripe Webhook Secret"
  regex = '''whsec_[0-9a-zA-Z]{32,}'''
  tags = ["key", "stripe"]

[[rules]]
  id = "google-api-key"
  description = "Google API Key"
  regex = '''AIza[0-9A-Za-z\-_]{35}'''
  tags = ["key", "google"]

[[rules]]
  id = "resend-api-key"
  description = "Resend API Key"
  regex = '''re_[0-9a-zA-Z]{32,}'''
  tags = ["key", "resend"]

[[rules]]
  id = "supabase-service-role"
  description = "Supabase Service Role Key"
  regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{50,}'''
  tags = ["key", "supabase"]

[[rules]]
  id = "twilio-auth-token"
  description = "Twilio Auth Token"
  regex = '''[0-9a-f]{32}'''
  entropy = 3.5
  tags = ["key", "twilio"]

  # Immutable public questionnaire/model SHA-256 digests, not credentials.
  # Restrict exceptions to these exact declarations in these two assay files.
  # Gitleaks 8.30's finding.Line includes the preceding newline; admit only that prefix.
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''(^|/)yono/scripts/local_scene_(assay\.py|questionnaire_v2\.json)$''']
    regexTarget = "line"
    regexes = [
      '''^\n?\+?(QUESTIONNAIRE_HASH = |  "questionnaire_hash": )"(410c4289c01963b3)(df68b59b1f611da5)(8fb33525b1c443c0)(f9ff6b31e7b1f826)",?$''',
      '''^\n?\+?MODEL_DIGEST = "(5ced39dfa4bac325)(dc183dd1e4febaa1)(c46b3ea28bce4889)(6c8e69c1e79611cc)"$''',
    ]

[[rules]]
  id = "modal-token"
  description = "Modal Token"
  regex = '''ak-[0-9a-zA-Z]{32,}'''
  tags = ["key", "modal"]
