  tape: []
- zone: firewall
  tolerance_mm: 100
  pinned_line_y: -1.366
  pinned_margin_mm: 50
  basis: model firewall face -1.467; the Mitchell engine-compartment points put the cowl line at -1.366 +- 0.050 only if the truck has the 1981+
    support (low weight); the heads touching the model's firewall point the same way; kept at +-100 mm and drawn on the model until taped
  tape:
  - T-14
  - T-05
  - T-06
  - T-02
- zone: front_inner_fenders
  tolerance_mm: 50
  basis: not checked against a published figure; the wheelhouse dome rises into GM's battery tray spot by ~20 mm
  tape:
  - T-11
  - T-14
- zone: engine
  tolerance_mm: 100
  basis: 'twin v3 engine: photo match RMS 27 px of 1200, geometry error 5-10 cm (docs/wiring/twin/HANDOFF.md)'
  tape:
  - T-05
- zone: rear_double_wall
  tolerance_mm: 40
  basis: the inner quarter panel is not modelled (trim panel at x +-0.82, outer skin +-0.995, wheelhouse wall +-0.624); tailgate width -9 mm
  tape:
  - T-07
- zone: cab_interior
  tolerance_mm: 30
  basis: dash, column and floor not checked against a published figure; door jambs consistent
  tape:
  - T-12
  - T-04
rule: Where the model is off, parts are placed by the published value and the correction is recorded; the mesh is not sculpted unless placement
  needs it.
