- id: body.engcomp.fore-aft
  zone: firewall
  dimension: engine compartment, radiator-support points to cowl points (fore-aft)
  published_mm: 1098.6
  dim_id: fr88.body.engcomp.side.* / .diag; klm84.body.underhood.length 1108.08
  source: 'Mitchell 1988 sheet p.2 (ENGINE COMPARTMENT): sides 1102, diagonals 1957, widths 1715 rear / 1523 front -> fore-aft 1097.8 (sides)
    and 1099.4 (diagonals); the front pair sits on 1981+ radiator-support sheet metal (low weight, geometry lane)'
  model_mm: 998.0
  method: 'twin radiator support at x 0.76: y -2.465 (Under_Main_Blazer panel); twin firewall face at x 0.76: y -1.467'
  delta_mm: -100.6
  tolerance_mm: 50.0
  tolerance_basis: 'front points on 1981+ front sheet metal: their fore-aft offset from the 1977 support is not published (weighted low) -> +-50
    mm'
  verdict: inconclusive
  correction: 'If the truck''s radiator support sat where Mitchell''s 1981+ front pair does, the cowl line would be at y -1.366 +- 0.050, 101
    mm aft of the model''s firewall face (-1.467). That is not evidence the model is wrong: the 1981+ front clip differs from the 1977 one by
    an amount no source gives, and the model''s cowl depth (firewall face to the windshield base, y -1.467 to -1.305, 162 mm) is plausible. What
    does point the same way: the v3 heads sit 13-18 mm from this face and the passenger head passes up to 18 mm through it, so either the firewall
    is too far forward or the engine too far back (geometry lane saw the same). Nothing is moved: parts stay on the model''s firewall, the working
    tolerance stays +-100 mm fore-aft, and every run that ends on the firewall carries its length change (routes.json firewall_shift_mm). Settled
    by tape T-14 (radiator support to cowl, and which front clip the truck has), T-05 (engine against the firewall) and T-06 (body on the frame).'
  status: measured on the twin; nothing taped
