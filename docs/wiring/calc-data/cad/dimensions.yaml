# =====================================================================================================
# GM 1975-81 LIGHT TRUCK SERVICE MANUALS -- FRAME REFERENCE DIMENSIONS, ROW KA105 (the K10 Blazer)
# Table: Fig. 2A-3 C-K-P Series Frame Reference Dimensions (1977 PDF p.110, printed 2A-4). Points: Fig. 2A-2
# C-K-P Series Truck Frame (1977 PDF p.109, printed 2A-3). Model code: K = 4x4, 1 = 10 series, 05 = "Blazer,
# Jimmy" (1977 manual PDF p.6, Truck Model Identification). The KA105 row is character-for-character the same
# in the 1975, 1976, 1977, 1978, 1979, 1980 and 1981 manuals (also_in; check_dimensions.py reads each page).
# Figure notes, as printed: "DIMENSIONS TO HOLES OR SLOTS ARE MEASURED TO THE CENTER OF HOLE OR SLOT. GAUGE
# HOLES ARE 5/8" DIAMETER. (+) INDICATES THAT THE DIMENSION IS TO THE UNDERSIDE OF THE FRAME TOP SURFACE OR
# INSIDE OF THE FRAME OUTER SURFACE. NOTE: FRAME ILLUSTRATED IS TYPICAL. FRAME DESIGN VARIES ACCORDING TO
# TRUCK MODEL." The drawing is a 2WD C frame, so where each lettered point falls on the K5 frame is read by
# analogy; the heights are to GM's datum line, which is not Mitchell's.
# Columns H and I are blank for KA105 (the Blazer frame has no such points).
# =====================================================================================================

