# =====================================================================================================
# MITCHELL 1988 BLAZER 2-DOOR 4WD -- FIG 1, COMPLETE UNDERBODY FRAME (FR88 page 1)
# Measuring points, as printed in the MEASURING POINT DESIGNATIONS box:
#   A centre of 15 mm (9/16 in) round hole, inside on front frame rail   B tip of bolt, leaf spring mount
#   C D.S. tip of rivet, crossmember mount    D P.S. tip of rivet, crossmember mount    E tip of bolt, motor mount
#   F tip of bolt, leaf spring mount          G centre of 16 mm (5/8 in) round hole (datum line control point)
#   H centre of 16 x 31 mm oval hole          I head of bolt, leaf spring mount
#   J centre of 18 x 33 mm oval hole (datum line control point)   K centre of 17 x 33 mm oval hole
#   L D.S. tip of rivet, exhaust hanger bracket    L' P.S. centre of 10 mm (3/8 in) round hole
#   M head of bolt, leaf spring mount         N tip of bolt, tow package, rear mount
# Sheet notes: "Dimensions from Centerline are Combined When Equal. Divide by 2 for Individual Dimensions from
# Centerline. All Bolt and Holes are Measured to Center Unless Otherwise Described." D.S. = driver side,
# P.S. = passenger side; blt = measurement to bolt, frm = measurement to frame.
# The bottom view gives widths and tram (point-to-point) distances; the side view gives fore-aft lengths from
# the control points G and J, and heights above the datum line. The three views close on each other to under
# 1 mm (check_dimensions.py), so the readings below are consistent.
# =====================================================================================================

- id: fr88.frame.wheelbase
  what: Wheelbase
  kind: length
