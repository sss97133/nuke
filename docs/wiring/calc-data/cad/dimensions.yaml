# =====================================================================================================
# MITCHELL 1988 BLAZER 2-DOOR 4WD -- FIG 2, COMPLETE UPPERBODY (FR88 page 2)
# The body and cab. The cab (windshield, doors, A and B pillars) is the 1973-87 C/K cab the K5 shares;
# the engine-compartment points sit on 1981-91 front sheet metal (the 1977 has the 1973-80 front end).
# =====================================================================================================

- id: fr88.body.engcomp.rear-width
  what: Engine compartment, rear pair of measuring points, left to right
  kind: width
  value_mm: 1715
  original: {value: 1715, unit: mm}
  points: "The rear pair of the four black-dot measuring points in the ENGINE COMPARTMENT top view (the pair at the cowl end, where the inner-fender lines meet the cowl crossbar). Mitchell names no points in this view."
  src: FR88
  pdf_page: 2
  figure: "Fig 2 upperbody, ENGINE COMPARTMENT (top-left box)"
  where: "horizontal dimension across the top of the box, labelled 1715, above the word Centerline"
  years: "1988 as printed; the cowl end is shared by 1973-91 C/K"
  applies_to_1977: assumed
  confidence: medium
  why: "Mitchell prints it for 1988. The cowl did not change 1973-91, but the points are unnamed. KLM 1984 prints 67-3/4 in (1721) for what looks like the same pair (6 mm apart)."

