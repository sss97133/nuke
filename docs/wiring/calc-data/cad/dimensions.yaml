# K5 Blazer vehicle geometry -- every published dimension we hold that locates something on a 1973-91 K5 Blazer
# or C/K body, frame, cab, doors, tailgate or rear body. Read by harness-cad for the margin-of-error table
# against the Blender body (~/k5-harness-pull/K5_harness_workspace_v3.blend).
#
# Owner, 2026-09-29: "figure out your margin of error situation by actually knowing the vehicle ... the repair
# manuals the service manuals at some point you actually find like measurements and you can fill in based on
# the information you actually have."
#
# Rules for this file
#   - Every number is as printed, with its page and figure. value_mm is the printed value converted
#     (1 in = 25.4 mm exactly); original keeps the printed value and unit.
#   - points names the measuring points in the source's own words. A point the source does not name says so.
#   - A figure scanned without a text layer (Mitchell, KLM, GM TX000469) is read by eye; `where` says where on
#     the figure the number sits, so an auditor can find it.
#   - Nothing here is measured on the truck. Measurements go in tape_list.yaml and come back as their own rows.
#   - check_dimensions.py validates shape, units, the value on its page (text-layer sources), and closes the
#     Mitchell figures on themselves (their own margin of error).
#
# confidence -- how sure we are the number is right for Skylar's 1977 K5 at the named points
#   high    printed by GM for the K10 Blazer in a table that covers 1977, points named
#   medium  printed for a sister year or a C/K model that shares the part, points named; or a GM 1977 value
#           whose point is read off a "typical" drawing
#   low     implied by a procedure, printed for a different series, or the points are not named
# applies_to_1977: yes | assumed (same part family, not proven by this source) | unverified (the part changed
#   between 1977 and the source's year, or we can't tell)
#
# kind
#   width           left point to the matching right point (the source prints them combined; half is each side)
#   to_centerline   one point to the frame centreline
#   length          fore-aft, parallel to the datum line (side view)
#   height          above the datum line, perpendicular to it (side view)
#   point_to_point  straight-line (tram) distance between two points
#   diagonal        point-to-point from one side to the other
#
# Coordinates in the twin: metres, +x = driver, -y = front, +z = up; front axle y = -1.896, rear axle y = 0.807,
# firewall about y = -1.46 (task brief 2026-09-30). Nothing in this file is in twin coordinates.

