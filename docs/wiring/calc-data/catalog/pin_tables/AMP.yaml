AMP:
  family: open
  pins:
    '32': +12 VDC (power connector, set screw)
    AMP_GND: Ground (power connector, set screw)
    RADIO_REM: Remote turn-on input (power connector, set screw)
    RCA_FRONT: Input 1 + Input 2 (RCA, analog input harness)
    RCA_REAR: Input 3 + Input 4 (RCA)
    RCA_SUB: Input 5 + Input 6 (RCA)
    26a: speaker output A + lead
    26b: speaker output A - lead
    27a: speaker output B + lead
    27b: speaker output B - lead
    28a: speaker output C + lead
    28b: speaker output C - lead
    29a: speaker output D + lead
    29b: speaker output D - lead
    30a: subwoofer output + lead
    30b: subwoofer output - lead
  note: '75 W x 4 at 4 ohm + 300 W x 1 at 2 ohm; 4 AWG power and ground leads, 60 A fuse; 9-13/16 x 2-1/8 x 6-3/4 in; tuned with JL''s TuN app over USB · maker''s
    document: JL Audio VX700/5i: removable power plug (set-screw receptacles), analog input harness (6 RCA inputs), speaker output harness (leads A-D), subwoofer
    output harness (2 lead pairs, paralleled inside) · Channel letters A-D against the registry''s CH1-CH4 are our assignment: the DSP routes any input to any output
    (TüN). Signal/DC-offset auto turn-on senses Input 1 only, so the front RCA pair on Inputs 1/2 keeps that option.'
  open:
  - RADIO_REM is 20 AWG; the power plug takes '10-18-gauge wire for the remote turn-on' (Crutchfield snapshot) — go to 18 AWG or confirm the set screw holds 20
  - 'speaker/sub harness lead colours per channel: not in the connection guide text — read the harness'
  - 'subwoofer harness has ''two pairs of wire leads ... connected in parallel inside the harness'': each woofer could take its own pair instead of the SUB_JMP jumpers
    — owner''s call'
  sources:
  - 'reference_documents/web_snapshots/www.retailspecs.com__VXi_700_5_MAN.md (JL VX700/5i connection guide: power connector +12 VDC / Ground / Remote with set screws,
    ''strip back 3/8 inch''; Analog Input harness Inputs 1-6 RCA; Speaker Output Harness A-D leads; Subwoofer Output Harness)'
  - reference_documents/web_snapshots/www.crutchfield.com__JL-Audio-VX700-5i.md ('removable plug with C-Clamp terminals ... up to 4-gauge power and ground wire, and
    10-18-gauge wire for the remote turn-on')
