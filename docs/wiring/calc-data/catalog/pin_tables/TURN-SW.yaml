TURN-SW:
  family: gm_blade
  pins:
    '33': 14 LT FRT LP (factory 20 LT BLU-14A)
    TURN_SW_R: 15 RT FRT LP (factory 20 DK BLU-15A)
    TURN_SW_0V: 16 FLSHR + 27 HAZ WARN (factory 18 PPL-16 and 18 BRN-27), jumpered
  kit: {}
  mate: column connector 12004147 (harness half per the A-1 callout)
  note: cavities are named by the GM circuit printed in each cavity; circuits 17 (stop input), 18 and 19 (rear lamps) are left unused as the registry states
  open:
  - the booklet names cavities by circuit number, not by letter; confirm on the '77 column connector at the bench
  - 'column connector terminal part and range vs 22 AWG: not named in the booklet'
  sources:
  - 'ST-352 1978 C/K wiring booklet fold-out A-1 ''Cab, Engine and Chassis Wiring'' (reference_documents/wiring_diagram_booklets/pages/1978_CK_A1_cab_engine_chassis_main.png; closest year on file to the
    ''77 K5): DIR SIG SW column connector 12004147 (17 ST LT SW, 19 RT RR LP, 18 LT RR LP, 16 FLSHR, 27 HAZ WARN, 15 RT FRT LP, 14 LT FRT LP, 28 HORN)'
  - 1977 Light Truck Service Manual Section 8 (reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf) p.783 (brown wire in the turn signal column connector)
