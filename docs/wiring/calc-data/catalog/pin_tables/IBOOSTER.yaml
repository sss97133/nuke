IBOOSTER:
  family: open
  pins:
    '52': '4.00 mm² red lead, housing pin 1 (always hot, 40 A) [pin: www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md; lead: tulayswirewerks.com__bosch-ibooster-gen-1-universal-wire-harness.md]'
    IBOOST_PERM: '1.50 mm² red lead, housing pin 17 (always hot, 5 A; medium blade) [pin: www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md; lead: tulayswirewerks.com__bosch-ibooster-gen-1-universal-wire-harness.md]'
    IBOOST_WAKE: '0.50 mm² green lead, housing pin 20 (ignition, 5 A) [pin: www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md; lead: tulayswirewerks.com__bosch-ibooster-gen-1-universal-wire-harness.md]'
    IBOOST_GND: '4.00 mm² black lead, housing pin 9 (chassis ground) [pin: www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md; lead: tulayswirewerks.com__bosch-ibooster-gen-1-universal-wire-harness.md]'
    IBST_CAN_H: 'housing pin 16, vehicle CAN high (CANDIDATE IBST-CAN): not needed for basic operation and not a Tulay loose lead — a terminal goes into the Tulay-assembled plug: OPEN [pin: www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md]'
    IBST_CAN_L: 'housing pin 25, vehicle CAN low (CANDIDATE IBST-CAN): not a Tulay loose lead — OPEN [pin: www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md]'
  note: 'Gen 1 (1037123-00-B). The Tulay Gen-1 universal harness has the controller plug and the pedal travel sensor plug assembled, with four loose leads: red 4.00 mm² (pin 1, 40 A), red 1.50 mm² (pin 17, 5 A), green 0.50 mm² (pin 20, ignition 5 A), black 4.00 mm² (pin 9). Pedal travel sensor, inside the harness (Gen 1 mapping, differs from Gen 2): sensor 1 -> controller 2, 2 -> 22, 3 -> 8, 4 -> 23. It must be the Gen-1 harness: the sensor plug mapping differs by generation.'
  open:
  - 'PURCHASE: Tulay Gen-1 universal harness is not on order (no Tulay order in the owner''s Gmail)'
  - 'IBST-CAN (candidate): pins 16/25 on the booster plug, not Tulay loose leads; terminal 1928498705 for 22 AWG, and the 120 ohm across the pair at this end'
  - 'join of the 6 AWG #52 / IBOOST_GND to the 4.00 mm² Tulay leads: past a D-609-05 (16-12) — butt splice part OPEN'
  - 'IBOOST_PERM (16 AWG) to the 1.50 mm² red lead and IBOOST_WAKE (20 AWG) to the 0.50 mm² green lead: D-609 by combined gauge; confirm at the bench'
  - 'feed source for #52 and IBOOST_PERM: isolator decision A (Odyssey +, battery side) or B (distribution stud, as designed) — research §4, owner/Dave'
  sources:
  - 'reference_documents/web_snapshots/www.fastandquiet.com__bosch-ibooster-gen-1-pinout.PDF.md (L 1 Always Hot 40A; L 9 Chassis Ground; M 17 Always Hot 5A; S 20 Ignition 5A; S 16/25 Vehicle CAN-High/Low, S 18/10 Yaw CAN, "not needed for basic operations"; pedal sensor 1-4 -> ECU 2, 22, 8, 23)'
  - 'reference_documents/web_snapshots/tulayswirewerks.com__bosch-ibooster-gen-1-universal-wire-harness.md (4.00 mm² red 40A; 1.50 mm² red 5A; 0.50 mm² green ignition 5A; 4.00 mm² black ground)'
  - 'reference_documents/web_snapshots/openinverter.org__Bosch_iBooster.md (1037123-00-A/B = Model S/X Gen 1; ECU signal terminals Bosch 1928498705 (0.35-0.5 mm²) or 1928498805 (0.5-1.0 mm²))'
  - 'the salvage-yard order (record obs:a7276b88), 1037123-00-B, confirmed 2023-11-09, delivered 2023-11-13; K5 photo 40e5e5f9 label'
