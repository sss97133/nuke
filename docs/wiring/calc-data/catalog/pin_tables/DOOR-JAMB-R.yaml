DOOR-JAMB-R:
  family: gm_blade
  pins:
    '43': switch terminal (single; factory 18 WHT-156C, terminal 2984369)
    STEP_DOOR_R: switch terminal (single; factory 18 WHT-156C, terminal 2984369)
  splice_point: true
  kit: {}
  mate: GM terminal 2984369 on the pin switch
  note: 'the pin switch has one terminal; STEP_DOOR_R is a tap of #43 (registry), so the two join in a splice ahead of the single terminal'
  open:
  - 'terminal 2984369 range vs 22 AWG and the splice part for the tap: not named in the booklet'
  sources:
  - 'ST-352 1978 C/K wiring booklet fold-out A-1 ''Cab, Engine and Chassis Wiring'' (reference_documents/wiring_diagram_booklets/pages/1978_CK_A1_cab_engine_chassis_main.png; closest year on file to the
    ''77 K5): DR JAMB SW, one terminal 2984369 on circuit 156'
