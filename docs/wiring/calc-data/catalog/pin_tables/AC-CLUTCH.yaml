AC-CLUTCH:
  family: open
  pins:
    '23': T1 single lead, male bullet (clutch coil +)
  mate: female bullet to suit the Sanden T1 male bullet — part OPEN
  note: 'maker''s document: Sanden 7176 (SD7B10) clutch coil: one lead, male bullet (wire end T1, no diode); the coil returns through the compressor body'
  open:
  - 'female bullet part and crimp tool: not in the Sanden catalog'
  - 'T1 has no suppression diode (catalog p.7): the PDM15 OUT11 load is an unsuppressed coil — confirm the PDM output handles the inductive kick or add a diode (MoTeC
    PDM manual)'
  sources:
  - 'Sanden compressor catalog (reference_documents/component_drawings/Sanden_Compressors_ATC_Catalog.pdf) p.14: 7176 = 7B10, 12 V, wire end ''T1''; p.7 wire end
    types: ''T1 w/o diode ... 1 Wire, Male, Bullet'''
  - Sanden SD7 service manual p.14 (normal clutch current 3.6-4.2 A at 12 VDC)
