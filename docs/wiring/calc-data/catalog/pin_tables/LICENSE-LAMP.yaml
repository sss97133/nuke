LICENSE-LAMP:
  family: open
  pins:
    '92': feed lead (circuit 9 brown, connector 2977721)
    LIC_GND: ''
  note: 'maker''s document: license lamp, 67 bulb; factory lamp has ONE feed lead (connector 2977721) and grounds through its housing'
  open:
  - 'LIC_GND: the factory license lamp has no ground lead — it grounds through its housing (1978 booklet p.14). A ground lead or ring at the lamp mount is needed;
    lamp part OPEN'
  sources:
  - '1978 C-K wiring booklet ST-352-78 (reference_documents/wiring_diagram_booklets/ST_352_78_CK_Wiring.pdf) p.14 (sheet A-2, ''Suburban & Blazer'' rear lighting
    panel): ''LIC LAMP'' single 18 B lead through connector 2977721, housing ground symbol'
  - '1977 Light Truck Service Manual (reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf) p.838 lamp bulb data (C-K: tail/stop 1157, park/directional
    1157, marker 168, back-up 1156, license 67, underhood 93)'
