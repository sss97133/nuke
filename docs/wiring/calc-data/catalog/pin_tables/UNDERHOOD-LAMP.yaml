UNDERHOOD-LAMP:
  family: open
  pins:
    '73': 'feed lead (1978 accessory: 18 BLK through a 4 A fuse holder)'
    UH_GND: ''
  note: 'maker''s document: factory underhood lamp & switch assembly, 93 bulb: one feed lead, grounds through its mount'
  open:
  - 'decision needed: factory socket in the harness vs new pigtail socket + splice; owner/builder call'
  - 'UH_GND: the factory lamp has no ground lead — it grounds through its mount (1978 booklet p.16). A ground lead or ring at the mount closes this'
  sources:
  - 1978 C-K wiring booklet ST-352-78 (reference_documents/wiring_diagram_booklets/ST_352_78_CK_Wiring.pdf) p.16 (sheet A-4) 'Underhood Lamp Accessory' panel
  - '1977 Light Truck Service Manual (reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf) p.838 lamp bulb data (C-K: tail/stop 1157, park/directional
    1157, marker 168, back-up 1156, license 67, underhood 93)'
