# K5 harness — TOOLS catalog (curated input to the registry build; reconcile_v5.py → kits_v5.py)
#
# Every tool a build step calls for. families.yaml names these ids step by step, so the registry can
# say which tool is in the builder's hand at every termination.
#
# status:  picked        = a specific listing chosen, not bought
#          in_cart       = sits in a staged cart (orders/*.json)
#          to_buy        = needed, in no cart yet
#          confirm_owned = common shop tool — owner confirms he has it (else to_buy)
#          alt           = acceptable substitute for another tool, not planned
# Facts carry their source; a fact we do not have is `UNKNOWN: <what closes it>`.

AFM8:
  name: DMC AFM8 crimp frame
  pn: M22520/2-01
  does: 4-indent crimp for machined contacts; takes a positioner per contact
  range: 20–32 AWG ("suitable for crimping wires from 20 AWG to 32 AWG")
  status: picked
  buy: {vendor: ebay, ref: "336813500716", price: 50.00}
  alt_buy: {vendor: prowire, url: "https://www.prowireusa.com/M22520-2-01-afm8-crimp-frame", price: 698.06, note: "new"}
  note: genuine Daniels, no positioner, no returns. No eBay order confirmation in Gmail as of 2026-09-26.
  sources:
    - prowire M22520-2-01-afm8-crimp-frame page, fetched 2026-09-26
    - receipts/2026-09-25_orders-staged-prowire-ksv-ict.md, addendum 2026-09-26 (61-pin crimper picked)

K43:
