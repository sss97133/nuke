# K5 — WHERE EACH BOX GOES (curated input → mounts_v5.py → nuke_frontend/public/wiring/k5-mounts.json)
#
# Owner, 2026-09-29: "not sure where the ecu or pdms are suggested to be mounted" and "the body bulk
# head... not sure what that is". One entry per box the harness plugs into. Plain words first; every
# reason carries its source; a spot nobody has measured says so.
#
# status: decided (locked row or owner call) | proposed (agent pick, owner can replace) |
#         open (needs an owner or builder call) | flag (the current design breaks a maker's rule)
# side: +x = driver in the twin (Steering_Wheel x +0.26..+0.67, measured 2026-09-29).

boxes:
  - id: M130
    what: Engine computer (MoTeC M130)
    nodes: [M130-A]
    where: Cab side, close to the 61-pin, which now goes at the driver-side fuse-box hole. The exact spot waits on Dave.
    zone: cab
    status: open
    decision: k5-m130-location
    why:
      - text: "Owner call: the ECU and PDMs go \"somewhere awesome and safe\". The 61-pin moves to the original fuse-box hole (driver side), so the ECU moves with it; the passenger-side spot below is superseded."
        source: owner, 2026-09-29, in the pieces window (relayed by the pieces lane)
      - text: MoTeC's own limits make it a cab part. It is not a sealed engine-bay box ("protected location, occasional splash only"), it tops out at 85 °C, and it should not be bolted rigid to a vibrating panel.
        source: receipts/2026-06-09_as-built-photo-survey-corrections.md (MoTeC constraints)
      - text: Keep it close to the 61-pin so the 58 engine-wire tails stay short (HP Academy's tutors revisit wire sizes past about 300 mm from bulkhead to ECU).
        source: K5_WIRING_STATE.md §1 rows 43 and 50; HP Academy forum (Zac Perston), via the pieces lane
      - text: The pedal's 6 wires and the dash switches never leave the cab. An engine-bay ECU would add 6 more firewall crossings.
        source: K5_WIRING_STATE.md §1 row 46
      - text: Leave 60–80 mm clear below both plug faces for the Superseal plugs and their boots.
        source: receipts/2026-06-09_as-built-photo-survey-corrections.md
    instead:
      - where: Under the dash, centre
        why_not: The Four-Season duct and the radio fill that space, and every engine wire gets longer.
      - where: Engine bay
        why_not: Header heat passes the 85 °C ceiling, it gets splashed, and the pedal adds 6 crossings.
    open:
      - What is behind the gold panel on the passenger firewall (asked 2026-09-29)? It decides whether the M130's plate can bolt there.
      - The bracket needs rubber isolators, not bare sheet metal.

  - id: PDM30
    what: Body power box (MoTeC PDM30), which feeds the lights, blower, wipers, windows and locks
    nodes: [PDM30-A]
    where: Cab, in open air on its own plate near the M130, with an air gap between them. The spot follows the M130 (now open).
    zone: cab
    status: open
    why:
      - text: MoTeC says a PDM "may get very hot"; mount it where air moves and never against a hot surface.
        source: MoTeC PDM manual p.3 (Mounting)
      - text: It stays under 110 °C inside (100 °C recommended), which is about 85 °C around it at full load.
        source: MoTeC PDM manual p.35 (Specifications)
      - text: The PDM30 case is magnesium with only a coated circuit board, not a sealed lid. It belongs in the cab.
        source: MoTeC PDM manual p.35 (Environmental protection); PDM30 datasheet
      - text: 29 of its 30 outputs feed cab and body loads, and its battery cable crosses the firewall in inches from the passenger corner.
        source: k5_registry.json (PDM30 outputs); receipts/2026-06-10_battery-corner-rederivation.md
    instead:
      - where: Passenger kick panel
        why_not: The Four-Season duct crowds it, and there's no airflow behind the kick-panel trim.
      - where: Under the passenger seat
        why_not: Longer runs to every load, and heat builds up under carpet.
    open:
      - Run it for 30 minutes and log its inside temperature over CAN before you call the spot final.

  - id: PDM15
    what: Engine power box (MoTeC PDM15), which feeds the fan, injector and coil rails, starter, fuel pump, A/C clutch and lambda box
    nodes: [PDM15-A]
    where: The current design puts it in the engine bay. That breaks MoTeC's own spec (see why).
    zone: engine
    status: flag
    why:
      - text: The PDM15 has the same unsealed case as the PDM30 (magnesium, coated board only). MoTeC's sealed PDMs are the PDM16 and PDM32, which have a rubber seal on the lid and the plugs.
        source: MoTeC PDM manual p.35 (Case; Environmental protection)
      - text: A PDM16 would fit the engine job. It has 16 outputs (8 × 20 A + 8 × 8 A), 12 inputs and 100 A total, against the 9 outputs and 2 inputs in use today. It uses Autosport plugs.
        source: MoTeC PDM manual pp.35–36; K5_WIRING_STATE.md row 0y (PDM15 outputs 9/15, inputs 2/16)
    instead:
      - where: Cab, beside the PDM30 (recommended)
        why_not: Its engine feeds (fan, injector rail, coil rail, starter, A/C clutch, lambda box) would cross the firewall on the body pass-through plate. The fuel pump (rear) and the PCS trans computer (cab) get shorter.
      - where: Engine bay, but as a sealed PDM16
        why_not: It costs more than a PDM15. Neither box is bought yet, so nothing is wasted either way.
    open:
      - Pick the PDM15 in the cab or a PDM16 in the bay. Nothing is bought yet (state row 0k); Dave's opinion counts here.
      - With Dave's one-connector rule (2026-09-29) the bay PDM would also carry the front-end loads, about 22–27 outputs, which points at a sealed PDM32. See the body pass-through entry.

  - id: LTCD
    what: Lambda box (MoTeC LTCD), which reads both O2 sensors and sends them to the M130 over CAN
    nodes: [WIDEBAND]
    where: Under the truck, on the inside of a frame rail near the two O2 bungs, a hand-width or more from the pipe
    zone: chassis
    status: proposed
    why:
      - text: MoTeC says mount it "as far as possible from the exhaust"; it tops out at 100 °C around it.
        source: MoTeC LTC manual pp.4–5
      - text: The O2 sensors go at least 1 m downstream of the exhaust ports, tipped 10–90° from vertical with the tip down, never straight up and down. That puts the bungs under the cab near the transmission.
        source: MoTeC LTC manual pp.4–5
      - text: Never cut the sensor plug. Its calibration resistor is inside it, so the box has to sit within the sensor lead's reach.
        source: MoTeC LTC manual pp.4–5
    open:
      - The LTCD's lead length (the manual draws it in Appendix C) and where the bungs go (the exhaust isn't built yet).

  - id: BATTERIES
    what: Two batteries, the Odyssey for running and the Optima YellowTop for the stereo
    nodes: [ACC-BATT]
    where: Your working position is the passenger firewall corner
    zone: engine
    status: open
    why:
      - text: Owner's working position.
        source: K5_WIRING_STATE.md §4 (2026-06-10)
      - text: The factory Four-Season A/C box, which is locked to stay, mounts on the passenger firewall on the engine side. Both can't have that corner.
        source: K5_WIRING_STATE.md §1 row 40
    instead:
      - where: Front passenger corner at the radiator support (the factory battery spot)
        why_not: The 2 AWG runs back to the PDM30 and starter get longer.
      - where: YellowTop in the bed, next to the amp
        why_not: The amp's 18.4 ft cable loop goes away. The DC-DC charger then has to live back there too.
    open:
      - Which corner, now that the A/C box is going back in (asked 2026-09-29)?

  - id: ISOLATOR
    what: Battery isolator (Blue Sea 7700), the switch that kills the truck, with its dash switch
    nodes: [ISOLATOR, ISO-SWITCH]
    where: Engine bay, on the Odyssey's positive cable as close to the battery as it fits. The dash switch goes in the cab.
    zone: engine
    status: decided
    why:
      - text: Blue Sea says install it as close as possible to the battery, in a dry, protected spot.
        source: Blue Sea 7700 instructions p.1 (Mounting)
      - text: It's sealed (IP66) and ignition-protected (ISO 8846 / SAE J1171), so the engine bay is allowed.
        source: Blue Sea 7700 instructions p.1 (Regulatory)
      - text: Owner told us to pick the isolator; the 7700 was picked.
        source: wiring_decisions k5-battery-isolator-decided

  - id: DCDC
    what: Battery-to-battery charger (Victron Orion-Tr 12/12-30), which charges the YellowTop from the Odyssey
    where: The current design has it by the batteries in the engine bay. Victron says it must stay dry (see why).
    zone: engine
    status: flag
    why:
      - text: Victron says never run it in a wet place. Mount it standing up with the power terminals down, 10 cm clear above and below, near the battery but never directly above it.
        source: Victron Orion-Tr Smart manual, safety precautions and §4.1 (Mounting)
    instead:
      - where: Cab, low on the passenger firewall face
        why_not: Its two cables cross the firewall, but it stays dry.
      - where: The bed, if the YellowTop moves there
        why_not: None. It sits beside the battery it charges.
    open:
      - This follows the battery decision.

  - id: FIREWALL-61
    what: The 61-pin firewall connector (MIL D38999), the only thing through the firewall
    parts: [D38999/24WJ61SN, D38999/26WJ61PN, M85049/69-25N]
    where: Driver side, in the original fuse-box hole, on a CNC'd adapter plate
    zone: firewall
    status: decided
    why:
      - text: "Owner call: \"the 61 pin connector should be placed at the original fuse box hole with a cnc'd adapater plate\"."
        source: owner, 2026-09-29, in the pieces window (relayed by the pieces lane; not yet repeated in this lead's chat)
      - text: "Dave's rule: \"the only reason to run a 61 pin is so you dont have any other wires going through the firewall. putting a bulkhead next to it is a problem.\""
        source: Dave via the owner, 2026-09-29 (relayed by the pieces lane)
      - text: The factory fuse-block punch-out on the driver side is a 4 in hole, already in the firewall.
        source: objectTraits.ts factory_holes FB
    open:
      - Plate drawing. The M130 moves with the connector, cab side, close to it (HP Academy's tutors revisit wire sizes past about 300 mm from bulkhead to ECU).
      - "Questions for Dave (draft below, owner sends): the battery cables, sensor splices on the engine side, the isolator's switch wires, the rear connector."
  - id: BODY-PASS
    what: Body pass-through (the book's "body bulkhead A, B, C and P") — DROPPED
    parts: [DT04-12PA-L012, DT04-12PB-L012, DT04-6P-L012, DTP04-4P-L012]
    where: Not used. Nothing but the 61-pin goes through the firewall (Dave's rule).
    zone: firewall
    status: flag
    why:
      - text: "Dave, via the owner: \"putting a bulkhead next to it is a problem.\" The four Deutsch plugs were an agent's placeholder (receipt 2026-09-27, decided for you, replaceable), picked because the kits were in stock, not on a builder's advice."
        source: Dave via the owner, 2026-09-29 (relayed by the pieces lane); receipts/2026-09-27_whole-truck-body-circuits.md
      - text: Their 30 wires are mostly front-end loads (headlights, park/turn, markers, horn, wipers, washer, blower, underhood light, iBooster wake). A PDM in the engine bay can drive them from the cab switches over CAN, so none has to cross. MoTeC says a PDM input's state is sent over CAN and a PDM's outputs can be commanded by CAN messages.
        source: MoTeC PDM manual p.19; k5_registry.json FIREWALL-BODY-A/B/C/P
    instead:
      - where: Front loads on a sealed bay PDM, switched over CAN (candidate)
        why_not: The bay PDM then needs about 22–27 outputs, which is a PDM32 (sealed, 32 outputs, 120 A). A PDM16 has only 16. It is not decided until Dave answers.
    open:
      - "What still has to cross: the 2 AWG feed to the cab PDM and the ground returns (sealed cable clamps), and the isolator's 4 dash-switch wires. Questions for Dave."
  - id: DAKOTA
    what: Gauge box (Dakota Digital VHX control box)
    where: Cab, driver side under the dash, within 3 ft of the cluster, both terminal rows reachable
    zone: cab
    status: decided
    why:
      - text: It must be within its CAT5 cable's reach of the cluster, and Dakota warns against mounting it opposite ignition parts on the firewall. The coils are on the engine's centre mount, so driver under-dash is clean.
        source: Dakota VHX manual MAN 650314:P p.4; COMPUTER_PLACEMENT_MEMO.md

  - id: SERVICE
    what: Laptop ports (Ethernet for the M130, the MoTeC UTC plug for the PDMs)
    where: Cab, under the dash or in the glovebox
    zone: cab
    status: proposed
    why:
      - text: The M130 tunes over Ethernet to a panel RJ45; the PDMs configure through a MoTeC UTC on a 5-pin XLR.
        source: K5_WIRING_STATE.md row 0k (M1 Tune manual p.10; PDM manual p.48)

  - id: REAR-CONN
    what: Rear body connector (round), for the fuel pump and level, tail and rear lamps, the speed sender and the camera
    where: Candidate — rear floor, driver side, so the body comes off the frame with one unplug
    zone: rear
    status: open
    why:
      - text: "Owner: other bulkheads only \"the sick ones that are round\"; a small one \"in the back for fuel and tail lights and rear stuff\" is fine if it proves best."
        source: owner, 2026-09-29, in the pieces window (relayed by the pieces lane)
      - text: About 29 wires go to things outside the body at the rear; with their grounds spliced outside, about 20 would cross it.
        source: k5_registry.json (rear endpoints), pieces lane count 2026-09-29
    open:
      - A question for Dave. The connector and its spot aren't picked.

# ---------------------------------------------------------------------------------------------------
# WHERE EACH END IS. One entry per registry endpoint; id = the endpoint id (the map's node code), so a
# plug card can say where on the truck it is. Same rules as the boxes: plain words first, every reason
# carries its source, a spot nobody has measured says so.
# status: fixed_by_engine (the LS3, transmission or transfer case has one place it fits) | decided (the
#         factory spot kept, a bought kit's own spot, a locked row or an owner call) | proposed (agent
#         pick) | open (needs a call or a measurement) | flag (the current design breaks a maker's rule)
# follows: the box (or endpoint) an end sits by; it moves when that moves.
ends:
  - id: CKP
    what: Crank sensor (58x, grey plug)
    where: Passenger side of the block, behind the starter
    zone: engine
    status: fixed_by_engine
    why:
      - text: '"The sensor is a 3 pin plug located behind the starter on the passenger side of the block. ... 58x engines have a GREY connector."'
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.5
      - text: GM's 6.0L (Gen IV) sensor sheet shows the crankshaft sensor on the engine's right-hand view.
        source: reference_documents/component_drawings/NHTSA_GM_6.0L_Sensor_Locations.pdf p.2, Fig. 2
  - id: CMP
    what: Cam sensor
    where: Front of the engine, driver side of the timing cover, mid to upper
    zone: engine
    status: fixed_by_engine
    why:
      - text: '"On 58x engines the factory location is in the front of the block on the mid to upper driver side timing chain cover."'
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.5
      - text: GM's 6.0L sensor sheet shows the camshaft sensor on the engine's left-hand view.
        source: reference_documents/component_drawings/NHTSA_GM_6.0L_Sensor_Locations.pdf p.1, Fig. 1
  - id: KNOCK-1
    what: Knock sensor, bank 1
    where: 'Driver side of the block (bank 1: cylinders 1, 3, 5, 7)'
    zone: engine
    status: fixed_by_engine
    why:
      - text: '"Gen 4 58x Located on Side of Block".'
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.4
      - text: GM's 6.0L sensor sheet shows a knock sensor on this side.
        source: reference_documents/component_drawings/NHTSA_GM_6.0L_Sensor_Locations.pdf p.1, Fig. 1 (left-hand view)
      - text: Bank 1 is cylinders 1, 3, 5, 7.
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.4 (O2 bank 1 = cylinders 1, 3, 5, 7)
      - text: 'GM numbers a V8''s cylinders from the front: 1, 3, 5 and 7 on the left (driver) bank, 2, 4, 6 and 8 on the right.'
        source: reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf p.518
  - id: KNOCK-2
    what: Knock sensor, bank 2
    where: 'Passenger side of the block (bank 2: cylinders 2, 4, 6, 8)'
    zone: engine
    status: fixed_by_engine
    why:
      - text: '"Gen 4 58x Located on Side of Block".'
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.4
      - text: GM's 6.0L sensor sheet shows a knock sensor on this side.
        source: reference_documents/component_drawings/NHTSA_GM_6.0L_Sensor_Locations.pdf p.2, Fig. 2 (right-hand view)
      - text: Bank 2 is cylinders 2, 4, 6, 8.
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.4 (O2 bank 1 = cylinders 1, 3, 5, 7)
      - text: 'GM numbers a V8''s cylinders from the front: 1, 3, 5 and 7 on the left (driver) bank, 2, 4, 6 and 8 on the right.'
        source: reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf p.518
  - id: CLT-ECU
    what: Coolant temperature sensor for the M130
    where: Front of the driver-side cylinder head
    zone: engine
    status: fixed_by_engine
    why:
      - text: '"The ECT sensor is located in the front of the driver side cylinder head ... the same location on all LS style engines."'
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.6
      - text: GM's 6.0L sensor sheet shows the coolant temperature sensor on the engine's left-hand view.
        source: reference_documents/component_drawings/NHTSA_GM_6.0L_Sensor_Locations.pdf p.1, Fig. 1
  - id: DAK-CTS
    what: Dakota temperature sender (SEN-04-5)
    where: Rear of the passenger-side cylinder head, in its spare port
    zone: engine
    status: proposed
    why:
      - text: '"There is a port in the back of the Passenger head you can use for your Temp Gauge!" It keeps the gauge sender off the M130''s sensor.'
        source: reference_documents/component_drawings/Swap_Specialties_LS_Installation_Instructions.pdf p.6
      - text: The sender is 1/8 NPT, two-wire.
        source: reference_documents/component_drawings/dakota_digital_vhx_manual.pdf p.9 (650314:P)
    open:
      - 'The port''s thread against the sender''s 1/8 NPT (adapter or not): read it on the head.'
  - id: OILP-ECU
    what: Oil pressure sensor for the M130 (Gen IV round 3-pin)
    where: Upper rear of the engine, in the factory oil pressure port
    zone: engine
    status: fixed_by_engine
    why:
      - text: '"... the existing oil pressure sensor location at the upper rear of the engine ..."'
        source: reference_documents/component_drawings/LS3_EROD_Installation_Guide.pdf p.7
      - text: GM's 6.0L sensor sheet shows the oil pressure sensor on the engine's right-hand view.
        source: reference_documents/component_drawings/NHTSA_GM_6.0L_Sensor_Locations.pdf p.2, Fig. 2
  - id: DAK-OILP
    what: Dakota oil pressure sender (SEN-03-8)
    where: 'Not placed: a tee at the factory oil pressure port, or a port on the oil cooler adapter'
    zone: engine
    status: open
    why:
      - text: The factory port is at the upper rear of the engine and already holds the M130's sensor.
        source: reference_documents/component_drawings/LS3_EROD_Installation_Guide.pdf p.7
      - text: The Dakota gauge needs its own sender.
        source: reference_documents/component_drawings/dakota_digital_vhx_manual.pdf p.9 (650314:P)
    open:
      - Pick the tee or a cooler-adapter port.
  - id: OILT
    what: Oil temperature sensor
    where: 'Not placed: it goes in a port on the oil cooler adapter'
    zone: engine
    status: open
    why:
      - text: The owner's build log lists an oil cooler with no part number, so the adapter and its ports are not known.
        source: vehicle_observations (K5 build log, 'Oil cooler')
      - text: The registry names only its plug (GT150 2-way, same family as the coolant sensor).
        source: docs/wiring/calc-data/catalog/endpoints.yaml OILT
    open:
      - Name the oil cooler and its adapter; the sensor thread follows the port.
  - id: MAP
    what: MAP sensor (Holley 538-24, 1 bar)
    where: Off the engine, bolted by its two ears near the rear of the intake, on a short vacuum hose to the intake's MAP port
    zone: engine
    status: proposed
    why:
      - text: Holley recommends the 538-24 for both its LS intake families.
        source: Holley 199R10689 (300-129/130) and 199R10690 (300-131/132/136/137)
      - text: The 300-129 has a 1/8 NPT MAP port; the 300-131/136 sheet lists only a 3/8 NPT vacuum port.
        source: Holley 199R10689 and 199R10690, Dimensions
      - text: 'MoTeC''s Delco MAP drawing gives the pins: A 0 V, B signal, C +5 V.'
        source: MoTeC WD 53000-53003 (drawing X18)
    open:
      - Which Holley intake is on the engine (state 0ag(g)) sets the port and the hose barb.
      - 'The bracket spot: read it at the mock-up.'
  - id: IAT
    what: Intake air temperature sensor (GM 12160244)
    where: In the air inlet tube ahead of the throttle body, pushed into a GM 24504388 grommet
    zone: engine
    status: proposed
    why:
      - text: The GM 24504388 grommet "is used with the LS1 Camaro/Firebird air boxes. An excellent solution for engine swaps when a custom air intake is
          used."
        source: eficonnection.com, Grommet GM# 24504388
      - text: 12160244 is the sensor that fits the registry's GT150 plug (15449027).
        source: docs/wiring/calc-data/catalog/part_media.yaml IAT
    open:
      - 'The inlet tube is not built: the hole goes in it once it is.'
  - id: TB
    what: Throttle body (GM 12699160)
    where: On the intake's carburettor flange, through the Delmo 4-bolt adapter
    zone: engine
    status: decided
    why:
      - text: Delmo Speed shipped an "LS3 4-Bolt Throttle Body Adapter" in October 2024.
        source: vehicle_observations parts_purchase (Delmo Speed, 2024-10-02)
      - text: The 2026-02-01 photo shows the throttle body set on the intake for the mock-up; it is not bolted down.
        source: vehicle_observations device proof TB (2026-09-27)
    open:
      - The mounting bolts were never found (owner).
  - id: INJ-1
    what: Injector 1 (Siemens Deka FI114961)
    where: Intake runner for cylinder 1, driver bank, under the fuel rail
    zone: engine
    status: fixed_by_engine
    why:
      - text: 'GM numbers a V8''s cylinders from the front: 1, 3, 5 and 7 on the left (driver) bank, 2, 4, 6 and 8 on the right.'
        source: reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf p.518
      - text: The Holley receipt includes 534-209 fuel rails, and the owner's photos show the rails on the intake.
        source: docs/wiring/K5_WIRING_STATE.md 0ag(g)
    open:
      - 'Which intake is on the engine (state 0ag(g)): an injector needs a port-EFI intake''s boss.'
  - id: INJ-2
    what: Injector 2 (Siemens Deka FI114961)
    where: Intake runner for cylinder 2, passenger bank, under the fuel rail
    zone: engine
    status: fixed_by_engine
    why:
      - text: 'GM numbers a V8''s cylinders from the front: 1, 3, 5 and 7 on the left (driver) bank, 2, 4, 6 and 8 on the right.'
        source: reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf p.518
      - text: The Holley receipt includes 534-209 fuel rails, and the owner's photos show the rails on the intake.
        source: docs/wiring/K5_WIRING_STATE.md 0ag(g)
    open:
      - 'Which intake is on the engine (state 0ag(g)): an injector needs a port-EFI intake''s boss.'
  - id: INJ-3
    what: Injector 3 (Siemens Deka FI114961)
    where: Intake runner for cylinder 3, driver bank, under the fuel rail
    zone: engine
    status: fixed_by_engine
    why:
      - text: 'GM numbers a V8''s cylinders from the front: 1, 3, 5 and 7 on the left (driver) bank, 2, 4, 6 and 8 on the right.'
        source: reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf p.518
      - text: The Holley receipt includes 534-209 fuel rails, and the owner's photos show the rails on the intake.
        source: docs/wiring/K5_WIRING_STATE.md 0ag(g)
    open:
      - 'Which intake is on the engine (state 0ag(g)): an injector needs a port-EFI intake''s boss.'
  - id: INJ-4
    what: Injector 4 (Siemens Deka FI114961)
    where: Intake runner for cylinder 4, passenger bank, under the fuel rail
    zone: engine
    status: fixed_by_engine
    why:
      - text: 'GM numbers a V8''s cylinders from the front: 1, 3, 5 and 7 on the left (driver) bank, 2, 4, 6 and 8 on the right.'
        source: reference_documents/k5_factory_docs/1977_Light_Truck_Service_Manual.pdf p.518
      - text: The Holley receipt includes 534-209 fuel rails, and the owner's photos show the rails on the intake.
        source: docs/wiring/K5_WIRING_STATE.md 0ag(g)
    open:
      - 'Which intake is on the engine (state 0ag(g)): an injector needs a port-EFI intake''s boss.'
  - id: INJ-5
    what: Injector 5 (Siemens Deka FI114961)
    where: Intake runner for cylinder 5, driver bank, under the fuel rail
    zone: engine
    status: fixed_by_engine
