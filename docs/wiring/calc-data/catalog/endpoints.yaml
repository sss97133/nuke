# ============================================================== doors, tailgate, camera, rear lamps, speed (2026-09-27)
# Owner 2026-09-27: "we need power windows its never been addressed. we have nothing in the doors. we also want like rear
# camera". Parts picked under his delegation ("i can tell u to replace later"). No relays (row 54): every motor reverses
# through its switch; the PDM output is the fuse.
WIN-SW-L:
  where: cabin
  device: driver door switch panel — window master (both windows) + lock rocker, Nu-Relics 17383-2 chrome reverse-polarity switches
  family: open
  kit: {}
  wires: ["34", "WIN_GND_L", "WIN_R_UP", "WIN_R_DN", "WIN_MOT_L_A", "WIN_MOT_L_B"]
  open: ["switch terminal map from the Nu-Relics kit instructions (bench)"]
  sources: ["nu-relics.com 17383-2"]
WIN-SW-R:
  where: cabin
  device: passenger door window switch (in series with the master), Nu-Relics 17383-2
  family: open
  kit: {}
  wires: ["35", "WIN_GND_R", "WIN_R_UP", "WIN_R_DN", "WIN_MOT_R_A", "WIN_MOT_R_B"]
  sources: ["nu-relics.com 17383-2"]
window_motor_DS:
  where: cabin
  device: driver window motor (Nu-Relics 17383-2 regulator + motor)
  family: open
  kit: {}
  wires: ["WIN_MOT_L_A", "WIN_MOT_L_B"]
window_motor_PS:
  where: cabin
  device: passenger window motor (Nu-Relics 17383-2)
  family: open
  kit: {}
  wires: ["WIN_MOT_R_A", "WIN_MOT_R_B"]
LOCK-SW-L:
  where: cabin
  device: driver lock rocker (reversing, rests to ground)
  family: open
  kit: {}
  wires: ["38", "LOCK_GND_L", "LOCK_BUS_A", "LOCK_BUS_B"]
LOCK-SW-R:
  where: cabin
  device: passenger lock rocker (reversing, rests to ground)
  family: open
  kit: {}
  wires: ["LOCK_FEED_R", "LOCK_GND_R", "LOCK_BUS_A", "LOCK_BUS_B"]
lock_actuator_DS:
  where: cabin
  device: driver door lock actuator, AutoLoc AUTZT2000 (2-wire, 13 lb)
  family: open
  kit: {}
  wires: ["LOCK_BUS_A", "LOCK_BUS_B"]
  sources: ["autoloc.com AUTZT2000"]
lock_actuator_PS:
  where: cabin
  device: passenger door lock actuator, AutoLoc AUTZT2000
  family: open
  kit: {}
  wires: ["LOCK_BUS_A", "LOCK_BUS_B"]
DOOR-L-PASS-P:
  where: cabin
  device: "driver door pass-through, window power — Deutsch DTP 4-way: DTP04-4P + WP-4P (body side), DTP06-4S + WP-4S (door side), size 12 solid contacts 0460-204-12141 / 0462-203-12141 (14–12 AWG)"
  family: dtp
  kit: {}
  wires: ["34", "WIN_GND_L", "WIN_R_UP", "WIN_R_DN"]
  note: "physics, not preference: the ACI window motor draws 11 A at high load and 20 A at stall (Nu-Relics 17383-2 page, 'New ACI Motor AMP Draws'); 16 AWG carries 15 A at 80 °C (MoTeC PDM manual wiring table, PDF p.51) so its limit ceiling 0.85 x 15 = 12.8 A is under the 1.25 x 11 = 13.8 A floor (ch.17 §17.2.3); 14 AWG carries 22 A -> ceiling 18.7 A, floor 13.8 A: PDM30 OUT3 current limit 15 A. 14 AWG needs a size 12 contact, which the DT 12-way does not take (size 16, 20–16 AWG)"
  sources: ["Nu-Relics 17383-2 page (motor amp draws; harness fused 30 A)", "MoTeC PDM user manual wiring table (PDF p.51): 16# 15 A / 14# 22 A single wire free air 80 °C", "KSV 4-Way Mated Deutsch DTP Connector Kit page (DTP04-4P, DTP06-4S, WP-4P, WP-4S, size 12 contacts 14–12 AWG)", "customconnectorkits DTP04-4P page (accepts size 12 pins; mates DTP06-4S)", "canon ch.17 §17.2.3 (fuse >= 125 % load, <= 85 % cable)"]
  open: ["door boot/conduit: measure the hinge pillar gap (bench)", "PDM30 OUT3 current limit 15 A: set in PDM Manager, confirm the stall retry behaviour on the bench"]
