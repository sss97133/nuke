# ============================================================== power spine (DC primary)
PS-STUDS:
  where: engine
  device: DC primary cable ends (Odyssey, Blue Sea isolator studs, distribution stud, starter, alternator, block, frame, PDM, MEGA/MIDI, ground star)
  family: lug
  kit: {CPA-100-3/4-BK: 1}      # black band on every negative lug (ch.18 §7 layer 4); red CPA is carted
  lugs:
    "63": [238LTP, 238LTP]
    "6": [238LTP, 2516LTP]
    "59": [2516LTP, 2516LTP]     # alternator B+ (5/16 in, build-book assumption) · MEGA holder M8 at the distribution bus
    G1: [238LTP, 238LTP]
    G2: [DL438, DL438]
    G3: [838TP, 838TP]
    ISO_OUT: [238LTP, 238LTP]
    ODY_NEG: [238LTP, 238LTP]
    ACC_NEG: [DL438, DL438]
    DCDC_IN: [610TP]  # was 810TP (8 AWG); the cable is 6 AWG (cable_decisions.json): ProWire 610TP 6 AWG #10 (M5) eyelet              # MIDI 60 A holder, M5 stud · 810TP is the 8 AWG lug; the cable is 6 AWG: 6 AWG M5 lug OPEN
    PDM_BPOS: [2516LTP]           # MEGA 125 A holder, M8 stud (the PDM30 end is PDM30-STUD DL214)
    PDM15_BPOS: [2516LTP]  # the cable is 2 AWG (cable_decisions.json): 2516LTP, 2 AWG 5/16 in, on the MEGA M8 stud     # MEGA 100 A holder, M8 stud (the PDM15 end is PDM15-STUD)
    "52": [610TP]  # 6 AWG (cable_decisions.json) on the MIDI M5 stud: ProWire 610TP                 # MIDI 40 A holder, M5 stud
    "3": [AMP-KIT-RING]           # AMP Research kit harness red lead, its own fuse (IM75146 step 8)
    PCS_BATT: [RING-SMALL]        # 5 A fused tap: holder type OPEN
    DCDC_GND: [638TP]  # 6 AWG on the 3/8 in ground star: ProWire 638TP (was 838TP, 8 AWG)
    AMP_GND: [238LTP]  # 2 AWG (cable_decisions.json) on the 3/8 in ground star: 238LTP (was DL438, 4 AWG)
    IBOOST_GND: [638TP]  # 6 AWG like its feed #52 (cable_decisions.json): ProWire 638TP
    GND_RET_CAB: [238LTP, 238LTP]
  wires: ["63", "6", "59", G1, G2, G3, ISO_OUT, ODY_NEG, ACC_NEG, DCDC_IN, DCDC_GND, AMP_GND, IBOOST_GND, GND_RET_CAB, PDM_BPOS, PDM15_BPOS, "52", "3", PCS_BATT]
  open:
    - "topology is Dave's DC primary (battery → isolator → stud → branches) but the registry still carries the v4 runs #63/#6/#59 — the power-spine chapter re-draws them"
    - "stud sizes: starter + alternator 5/16 in is the build book's assumption; isolator studs are 3/8 in-16 (Blue Sea 7700), so 238LTP fits them"
    - "lug torque per stud: isolator 140 in-lb max (Blue Sea 7700 instructions p.1-2); the others UNKNOWN (datasheets)"
    - "a fused branch lands on its holder's stud, not the 3/8 in distribution stud: MEGA holder 02980900TXN = M8 (2516LTP for 2 AWG), MIDI holder 0498900.TXN = M5 (810TP for 8 AWG, 410LTP for 4 AWG) — stud sizes from the 2026-09-25 cart receipt; the Littelfuse holder datasheets are not on file"
    - "PCS_BATT 5 A fused tap: the holder is not picked (MIDI starts at 30 A, chapters/17 §17.2 item 9); ring PN OPEN (RING-SMALL)"
    - "PDM15_BPOS fuse: MEGA 100 A (PDM15 80 A total continuous x 1.25, MoTeC PDM manual p.35; chapters/17 §17.5 item 5) — part number not on file (MEGA-100A)"
  sources: ["build book 'DC primary' table", "state 0i", "chapters/17"]

# ============================================================== cabin: pedal, gauges, switches
APS:
  where: cabin
  device: "DBW pedal bought 2025-04-02 (eBay order 26-12889-28142): '72-98 C10 Square Body OBS LS Swap DBW' pedal — GM Gen III truck pedal (OE 15751307 family), 9-cavity plug with 6 wired; the third sensor's 3 cavities stay empty"
  family: miniseal
  kit: {WPAPP30: 1}
  per_end: {part: D-609-03}
  pins: {APS_T1_5V: G, APS_T1_SIG: F, APS_T1_GND: E, APS_T2_GND: D, APS_T2_SIG: C, APS_T2_5V: B}
  cavities: 9
  empty: ["unlettered 1", "unlettered 2", "unlettered 3"]
  note: "G APP1 5 V, F APP1 signal, E APP1 low ref, D APP2 low ref, C APP2 signal, B APP2 5 V. The plug is ICT Billet's WPAPP30 pigtail (OEM Delphi housing, seals and terminals on 6 in leads); each lead joins the harness with a red MiniSeal splice. The M130 reads both tracks and drives the throttle body itself, so the pedal does not have to match the throttle body — only the M1 pedal calibration does."
  open:
    - "before crimping, meter the pedal: G–E and B–D read a fixed resistance, F–E and C–D change as the pedal moves (the pin map is from a web source, not a GM manual)"
    - "cavity letters: read the WPAPP30 plug — the plug moulds 9 cavities, 6 wired (B–G); no saved source names the 3 unused ones (the third sensor's), and whether the pigtail carries 9 leads or 6 is not on the ICT page (review C24)"
  replaces_cart: ["15326829", "15317363"]
  sources:
    - "eBay listing for the bought pedal: '72-98 C10 Square Body OBS LS Swap DBW', now sold as APS130 — 'Standard Ignition 9 Terminal Accelerator Pedal Position Sensor APS130' (O'Reilly title, web search 2026-09-27)"
    - "square-body LS-swap pedal: OE 15751307 / 15974034 / 15984422 / ACC-1049, 'original 9-pin DBW connector layout used on 2001–2007 GM LS platforms' (web search 2026-09-27: maXpeedingrods / Hawks / PSI listings)"
    - "pinout 1999-2005 GM truck APP: G 5 V ref APP1, F APP1 signal, E low ref APP1, D low ref APP2, C APP2 signal, B 5 V ref APP2; 'only 6 pins in use, and the 3rd APP sensor is not used' (web search 2026-09-27; LS1Tech / Diesel Place threads)"
    - "ICT Billet WPAPP30 'LS Gen 3 Truck DBW Pedal Position Sensor Wire Pigtail', 'LS Gen 3 Truck DBW 9-wire Pedal Systems' 2000-2005, $26 (snapshot web_snapshots/www.ictbillet.com__ls-gen-3-truck-dbw-pedal-position-sensor-pigtail.md)"
