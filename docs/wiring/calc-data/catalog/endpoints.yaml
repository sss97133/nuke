  device: "driver door pass-through, locks and speaker — Deutsch DT 8-way: DT04-08PA + W8P (body side), DT06-08SA + W8S (door side), size 16 solid contacts 0460-202-16141 / 0462-201-16141 (20–16 AWG); cavities 7–8 spare, plugged 0413-204-2005"
  family: dt
  kit: {}
  wires: ["38", "LOCK_GND_L", "LOCK_BUS_A", "LOCK_BUS_B", "26a", "26b"]
  sources: ["customconnectorkits DT04-08PA page (accepts size 16 pins; wedge W8P; mates DT06-08SA)", "customconnectorkits 0460-202-16141 page (size 16 contact, 20–16 AWG)"]
  open: ["door boot/conduit: measure the hinge pillar gap (bench)"]
