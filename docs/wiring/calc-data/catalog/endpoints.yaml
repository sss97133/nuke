  device: "rear ground bus where the rear harness branches: an insulated stud bus; returns to the cab bank through GND_RET_REAR, not through the body"
  family: ring_small
  kit: {}
  wires: ["CAM_GND", "MK_LR_GND", "MK_RR_GND", "TL_L_GND", "TL_R_GND", "BU_L_GND", "BU_R_GND", "LIC_GND", "CHMSL_GND", "CARGO_GND", "ESTOPP_GND", "GND_RET_REAR", "TGR_KEY_GND"]
  sources: ["owner 2026-09-27 (grounds in the loom)"]
AMP-STEP-CTRL:
  where: chassis
  device: "AMP Research PowerStep kit harness + controller (drives and reverses both step motors)"
  family: open
  kit: {}
  wires: ["3", "STEP_GND", "STEP_DOOR_L", "STEP_DOOR_R"]
  open: ["the saved guide is the 2011-14 Silverado kit (IM75146): the K5 kit's harness and trigger polarity read on arrival"]
  sources: ["amp_research_75146_install.pdf steps 8, 14-15"]
E-STOPP:
  where: chassis
  device: "E-Stopp ESK001 electric parking brake — actuator on the parking-brake cable + control box, dash button in the kit"
  family: open
  kit: {}
  pins: {"54": "G (red, +12 V)", "ESTOPP_IGN": "F (blue, safety to ignition)", "ESTOPP_GND": "H (black, ground)",
         "126": "button harness (kit plug)", "DAK_BRAKE": "E (green, switched ground: brake indicator)"}
  sources: ["reference_documents/component_drawings/extracted/estopp_esk001_wiring.png (E = GRN 'Ground Sync Trigger')",
            "estopp.com troubleshooting: 'The green wire is a low-current switched ground' (about 25 mA) — web_snapshots/estopp.com__troubleshooting.md"]
TCASE-4WD-SW:
  where: chassis
  device: "4WD indicator switch, fabricated: a sealed normally-open plunger switch on a bracket at the transfer-case shift lever, closed in 4-high and 4-low -> Dakota VHX 4x4 (-)"
  family: open
  kit: {}
  wires: ["55", "TCASE_SW_GND"]
  note: "owner 2026-09-27: the case is shifted by hand and the hubs are manual, so electric needs 'some fabbing which is possible'. The lamp says the case is in 4WD; locking the hubs stays a by-hand check."
  open: []
  sources: ["Dakota VHX manual p.6: 4x4 (-) = 4 wheel drive indicator input, ground-activated", "owner 2026-09-27"]

# ---------------- 2026-09-27 owner reply: batteries, isolator, DC-DC charger, gear sensor
ODYSSEY:
  where: engine
  device: "Odyssey AGM — the running battery (owner 2026-09-27); model set by the tray, not bought yet"
  family: open
  kit: {}
  wires: ["63", ODY_NEG, ISO_PWR, ISO_SW_PWR]
  note: "the + post carries #63 to the isolator plus two small fused taps that must stay live when the truck is isolated: the isolator's own control power (red, 10 A) and the dash switch feed (5 A)"
  open: ["Odyssey model / group size: set by the tray at the mock-up", "fused-tap holders at the + post: picked with the battery terminals"]
  sources: ["owner 2026-09-27: 'we picked the batteries ... an odessey for the running and also a yellow optima for other stuff like accessories'"]
AMP-BLOCK:
  where: rear
  device: "power reducing block beside the amplifier: 2 AWG in (+ #32, - AMP_GND) to 4 AWG out (AMP_PWR_TAIL, AMP_GND_TAIL) — two single-circuit blocks, + and -"
  family: open
  kit: {}
  wires: ["32", "AMP_GND", "AMP_PWR_TAIL", "AMP_GND_TAIL"]
  note: "why it exists: JL requires 4 AWG at the amp's power plug; the 18.4 ft loop needs 2 AWG for the 3 % drop (JL VX700/5i guide 'Power Connector', step A: 'install a fused distribution block near the amplifiers'). Unfused here: the MIDI 60 A at the YellowTop + protects both gauges (4 AWG bundled 72 A x 0.85 = 61 A)"
  open: ["mount spot beside the amp: formboard / bench"]
  sources: ["JL VX700/5i guide (web_snapshots/www.retailspecs.com__VXi_700_5_MAN.md): Power Connector, spec table", "calc-data/CABLE_SIZING.md: #32 and AMP_GND 2 AWG from the 3 % drop"]
ACC-BATT:
  where: engine
  device: "Optima YellowTop — the accessory battery (owner 2026-09-27); beside the Odyssey; model set by the tray"
  family: open
  wires: ["32", ACC_NEG, DCDC_OUT]
  note: "the isolator does not cut this battery: it feeds only the amplifier (#32, MIDI 60 A at the + post — the JL VX700/5i needs 'an external 60-amp ... fuse', Crutchfield snapshot) and is charged through the DC-DC charger, whose input is downstream of the isolator. #32 lands on the MIDI holder's M5 stud: 210LTP (2 AWG, #10)"
  kit: {210LTP: 1}   # #32 is 2 AWG (cable_decisions.json) on the MIDI holder's M5 stud: ProWire 210LTP (was 410LTP, 4 AWG)
  open: ["YellowTop model / tray; the default spot is the engine bay beside the Odyssey — the amp's power and ground runs change if it moves behind the seat", "MIDI 60 A part number not on file (MIDI-60A)"]
  sources: ["owner 2026-09-27", "web_snapshots/www.crutchfield.com__JL-Audio-VX700-5i.md ('4-gauge power and ground leads and a 60-amp fuse recommended'; 'An external 60-amp AFS, AGU, or MAXI fuse (not included) must be installed')"]
ISOLATOR:
  where: engine
  device: "Blue Sea Systems 7700 ML-RBS remote battery switch with manual control, 12 V, 500 A continuous, on the Odyssey positive (studs A/B, 3/8 in-16); lined up at Powerwerx, $322.09"
  family: miniseal
  kit: {}
  per_end: {part: D-609-04}
  pins: {ISO_PWR: "red (+12 V 24 hr)", ISO_GND: "black (ground)", ISO_CLOSE: "brown (+12 V to close)", ISO_OPEN: "orange (+12 V to open)", ISO_LED: "yellow (LED output)"}
  note: "#63 lands on stud A and ISO_OUT leaves stud B (both on the stud list). The five control leads are the switch's tinned wires, joined to the harness with blue MiniSeal splices (Blue Sea: 16 AWG minimum for the control circuit). Manual override knob with LOCK OFF for service."
  open: ["mount close to the batteries, not over a vented battery (Blue Sea p.2); spot set at the mock-up"]
  sources: ["reference_documents/component_drawings/BlueSea_7700_ML-RBS_Instructions_990180170-006.pdf p.1-2",
            "web_snapshots/www.bluesea.com__ML-RBS_Remote_Battery_Switch_with_Manual_Control_-_12V_DC_500A.md (specifications)",
            "web_snapshots/powerwerx.com__blue-sea-7700-ml-rbs-remote-battery-switch.md ($322.09)",
            "MoTeC PDM user manual p.7 (isolator on battery positive, rated for the starter, secondary contact to an ECU shutdown input)",
            "Cartek XR dropped: its instructions p.3 say 'designed for motorsport use only and should not be used on road/street vehicles'"]
ISO-SWITCH:
  where: cabin
  device: "Blue Sea 2145 SPDT (ON)-OFF-(ON) Contura switch, included with the 7700 — momentary: tap ON to close the isolator, OFF to open it; its LED shows closed"
  family: open
  kit: {}
  pins: {ISO_OPEN: "1 (OPEN)", ISO_SW_PWR: "2 + 8 (common + LED power, jumpered)", ISO_CLOSE: "3 (CLOSE)", ISO_LED: "7 (LED ground)"}
  note: "the M130 shutdown tap (ISO_KILL) is a stub splice on the yellow wire, SPL-ISO-YEL, not a second wire on tab 7 (a 22 AWG signal wire cannot crimp in a 16–14 AWG quick-connect)"
  sources: ["Blue Sea 7700 instructions p.2 (control switch pins 1, 2, 3, 7, 8)"]
SPL-ISO-YEL:
  where: cabin
  device: "stub splice on the isolator switch's yellow wire (ISO_LED, tab 7): the M130 shutdown tap ISO_KILL joins here; the yellow is not cut"
  family: miniseal
  kit: {}
  wires: ["ISO_KILL"]
  note: "tee, not a butt: the yellow runs through; ISO_KILL 22 AWG stubs onto it. Sleeve by total conductor area (16 AWG yellow + 22 AWG tap)"
  open: ["MiniSeal size for a 16 + 22 AWG stub: by total CMA from the Raychem D-609 datasheet (D-609-04 covers 20–16)"]
  sources: ["Blue Sea 7700 instructions p.2 (switch pin 7 to the yellow wire; minimum 16 AWG)", "ProWire 3137CT page (MiniSeal cavities 26-20 / 20-16 / 16-12 AWG)"]
DCDC:
  where: engine
  device: "Victron Orion-Tr Smart 12/12-30 non-isolated DC-DC charger (ORI121236140), charges the YellowTop from the running system; lined up at Powerwerx, $215.05"
  family: open
  kit: {}
  wires: [DCDC_IN, DCDC_OUT, DCDC_GND]
  note: "engine running detection starts and stops it on its own, so no enable wire is needed — but the remote on/off must be closed: keep the factory wire bridge between the L and H pins (or a switch across L-H). Victron manual §4.5/4.6: 'remove the wire bridge' to install, then 'Reconnect the remote on/off to activate the product'; §4.7 option a) a switch wired between the L-H pins"
  open: ["terminal type for 8 AWG at the Orion's screw terminals: from the Orion manual when carted",
         "DCDC_IN fuse: decided MIDI 60 A, the maker's external battery protection fuse (manual §4.2 Figure 6, 12 V row); 6 AWG carries it"]
  sources: ["web_snapshots/powerwerx.com__victron-ori121236140-oriontrsmart-30a-nonisolated.md",
            "web_snapshots/www.victronenergy.com__34439-Orion-Tr_Smart_DC-DC_Charger-pdf-en.md (§4.2 cable and fuse recommendations; §4.5-4.7 remote on/off)"]
GSS-3000:
  where: cabin
  device: "Dakota Digital GSS-3000 gear shift sender: decoder under the dash; its sensor sits on the transmission detent shaft and comes with a 10 ft 3-wire cable"
  family: open
  kit: {}
  wires: [DAK_GEAR, GSS_PWR, GSS_GND, GSS_SENS_R, GSS_SENS_G, GSS_SENS_B]
  note: "1-WIRE -> VHX GEAR lights the gear readout; the decoder learns each gear position (set mode)"
  open: ["the 10 ft sensor cable has to reach the decoder: route from the transmission pan to under the dash is measured at the mock-up"]
  sources: ["web_snapshots/www.dakotadigital.com__GSS-3000.md (MAN# 650715:G)"]
GSS-SENSOR:
  where: chassis
  device: "GSS-3000 sensor on the transmission detent shaft (mounting plate on the pan, rod to the shift arm)"
  family: open
  kit: {}
  wires: [GSS_SENS_R, GSS_SENS_G, GSS_SENS_B]
  sources: ["web_snapshots/www.dakotadigital.com__GSS-3000.md"]

