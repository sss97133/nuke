# ---------------- tailgate window kit, CANDIDATE (owner has no regulator; not bought): factory switches stay, relay to the motor
TG-RELAY:
  retired: "no relay: state row 54 (PDM replaces relays — no relay/bypass designs); the candidate kit runs on reverse-polarity switches like the doors (lead 2026-09-28)"
  where: rear
  device: "Nu-Relics #116 prewired reversing relay — lets the factory 3-pole dash and key switches drive the reverse-polarity ACI motor (CANDIDATE)"
  family: open
  kit: {}
  pins: {TGR_FEED: "+12 V (pinout OPEN)", TGR_GND: "ground (pinout OPEN)", TGR_UP: "UP input (pinout OPEN)", TGR_DN: "DOWN input (pinout OPEN)",
         TGR_MOT_A: "motor A (pinout OPEN)", TGR_MOT_B: "motor B (pinout OPEN)"}
  open: ["relay pinout and lead colours: not on the Nu-Relics page — read the prewired relay on arrival (candidate)",
         "fuse: Nu-Relics calls for a 30 A fuse or breaker; here the feed is PDM30 OUT1 — set its limit at or under the 14 AWG rating (22 A at 80 °C)"]
  sources: ["web_snapshots/www.nu-relics.com__17383-1.md (option #116; 'a special relay is needed to reverse the polarity at the motor'; fuses 30 A)"]
TG-MOTOR-ACI:
  where: rear
  device: "Nu-Relics 17383-1 tailgate regulator with new ACI motor: two poles, reverse polarity, not grounded through the case; 3 A no load / 5 A low / 11 A high / 20 A stall (CANDIDATE)"
  family: open
  kit: {}
  pins: {TGR_MOT_A: "pole A (lead colour OPEN)", TGR_MOT_B: "pole B (lead colour OPEN)"}
  open: ["motor plug: option #100 'No Switches (Will Include Motor Plugs and Terminals)' ships the plug and terminals — read on arrival (candidate)"]
  sources: ["web_snapshots/www.nu-relics.com__17383-1.md ('New ACI Motor AMP Draws' table; 'ACI Motors are Reverse Polarity')"]
TG-SW-MASTER:
  where: cabin
  device: "tailgate window master switch at the dash, Nu-Relics reverse-polarity switch — option #121 'Standard Chrome Switches - 1 single switches' on the 17383-1 page (CANDIDATE; replaces the factory 3-pole dash switch in this configuration)"
  family: open
  kit: {}
  pins: {TG_FEED: "feed (+12 V) — candidate alternative end of TG_FEED (the factory switch's place)", TGR_KEY_FEED: "feed (+12 V, spliced with TG_FEED)",
         TGR_M_GND: "ground", TGR_UP: "UP output", TGR_DN: "DOWN output"}
  splice_point: true
  open: ["Nu-Relics catalog part number of the #121 switch and its terminal letters: not on the 17383-1 page — read on arrival (candidate)"]
  sources: ["web_snapshots/www.nu-relics.com__17383-1.md (option #121; 'require reverse polarity switches')", "doors model: Nu-Relics 17383-2 master switch in series with the passenger switch (endpoints WIN-SW-L / WIN-SW-R)"]
TG-SW-KEY-REV:
  where: rear
  device: "tailgate keyed switch as the SECOND reversing switch in series (like the passenger door switch): master UP/DOWN in, motor A/B out, its own feed and ground (CANDIDATE)"
  family: open
  kit: {}
  pins: {TGR_UP: "master UP in (pin unknown: keyed reversing switch not picked)", TGR_DN: "master DOWN in (pin unknown: keyed reversing switch not picked)", TGR_KEY_FEED: "feed (pin unknown: keyed reversing switch not picked)", TGR_KEY_GND: "ground (pin unknown: keyed reversing switch not picked)",
         TGR_CUT_IN: "motor A out (pin unknown: keyed reversing switch not picked)", TGR_MOT_B: "motor B out (pin unknown: keyed reversing switch not picked)"}
  open: ["keyed reversing switch part: OPEN — the factory keyed switch (8900713, three terminals) is not a reversing switch, and no keyed reversing switch is on file; the owner may drop the key function (then TGR_UP/TGR_DN go straight to the motor side)",
         "cutout on a 2-pole reversing motor: the tailgate-closed cutout (TG-CUTOUT) opens motor pole A, so with the tailgate open the window stops in BOTH directions (the factory motor had separate UP/DOWN leads and a case ground) — owner/builder call whether to keep it"]
  sources: ["web_snapshots/www.nu-relics.com__17383-1.md", "1978 C-K wiring booklet ST-352-78 p.16 (key switch 8900713: OPEN 184 / FEED 60 / CLOSE 183)"]

