# K5 harness — ENDPOINTS (plugs, studs, ports) with their kits (curated input; → kits_v5.py)
#
# One entry = one physical termination point a user could click on the future map: the connector,
# stud or port, which wires land there (registry ids, incl. `implied`), the kit that builds it, and
# what is still open. Scope of this pass = Chapter 1 (engine running) + power spine + comms ports.
#
#   where:   cabin | firewall | engine | chassis | rear
#   family:  families.yaml id (steps + tools come from there)
#   kit:     parts consumed once per endpoint {code: qty}; per-wire-end parts come from the family
#   wires:   registry ids landing here; `pins: M130:A` = every registry wire whose `frm` is on that
#            connector; `pdm: A` = every PDM30 output/ground wire whose pin maps to connector A
#   range:   wire range the kit's terminals accept (AWG, small..large)
#   open:    what still has to be decided or checked — each with how it closes

# ============================================================== cabin: the two computers
M130-A:
  where: cabin
  device: MoTeC M130, connector A (34-way Superseal 1.0, Key 1, MoTeC #65044)
  family: ssc
  kit: {M800-KIT-N: 0.5, SSB-34BS-PA66: 1}
  cavities: 34
  wires: {pins: "M130:A"}
  open:
    - "boot: HELD on the M130 mount (state §4) — SSB rubber boot on this backshell, or billet + Raychem 202K152/153"
    - "5 V/0 V pairing: techspec A02↔B15/A09↔B16 vs Dave's sheet A2/B16 — Dave to rule. M1 hardware techspec pp.16-17: A02 SEN_5V0_A, A09 SEN_5V0_B, B15 SEN_0V_A, B16 SEN_0V_B; canon chapters/17 'SEN_0V letter-pairing rule' items 8-9: match letters; Dave's M130 sheet returns the A2 sensors on B16 and pedal track 2 (A9) on B15. The registry follows Dave's sheet until he rules; no wire moved (review A7, receipt 2026-09-28 registry corrections)"
  sources: ["motec_m130_datasheet.pdf p.4", "prowire M800-KIT-N page"]
M130-B:
  where: cabin
  device: MoTeC M130, connector B (26-way Superseal 1.0, Key 1, MoTeC #65045)
  family: ssc
  kit: {M800-KIT-N: 0.5, SSB-26BS-PA66: 1}
  cavities: 26
  wires: {pins: "M130:B"}
  open:
    - "boot: HELD on the M130 mount"
    - "5 V/0 V pairing: techspec A02↔B15/A09↔B16 vs Dave's sheet A2/B16 — Dave to rule. M1 hardware techspec pp.16-17: A02 SEN_5V0_A, A09 SEN_5V0_B, B15 SEN_0V_A, B16 SEN_0V_B; canon chapters/17 'SEN_0V letter-pairing rule' items 8-9: match letters; Dave's M130 sheet returns the A2 sensors on B16 and pedal track 2 (A9) on B15. The registry follows Dave's sheet until he rules; no wire moved (review A7, receipt 2026-09-28 registry corrections)"
  sources: ["motec_m130_datasheet.pdf p.5"]
PDM30-A:
  where: cabin
  device: MoTeC PDM30, connector A (34-way, #65044)
  family: ssc
  kit: {M800-KIT-N: 0.5, SSB-34BS-PA66: 1}
  cavities: 34
  wires: {pdm: A}
  open:
    - "20 A outputs feeding a wire heavier than 16 AWG (#34, #35, TG_FEED, BLOWER_HI on A; #51, #72 on B): 2 × 16 AWG M22759/32 pigtails, one per pin, equal length, into an in-line MiniSeal M81824/1-3 with the load wire out the other end (SPL-PDM30-OUTn endpoints; the pigtails are registry wires). MoTeC PDM manual p.48: 20# to 16# for 20 A outputs, 16# = 15 A at 80 °C; a D-609 stub splice can't take all three (2 × 16 + 12 AWG = 11,690 CM, past the 16–12 AWG cavity of the 3137CT)"
    - "one wire of 16 AWG or finer on a paired 20 A output (#93 22 AWG on A9+A17 here, #54 16 AWG on B5+B11 on B): one conductor can't fill both cavities (PDM manual p.44 pairs each 20 A output on two pins) — a second equal-length conductor, a pigtail pair, or an 8 A output if the load allows (builder's call; review A1 follow-on)"
    - "channels for INJ_PWR, COIL_PWR, the fuel pump and the second PDM split are unassigned (state 0h(5), row 54)"
  sources: ["motec_pdm30_datasheet.pdf", "scripts/generate_connector_build_sheets.py PDM_A_PIN"]
PDM30-B:
  where: cabin
  device: MoTeC PDM30, connector B (26-way, #65045)
  family: ssc
  kit: {M800-KIT-N: 0.5, SSB-26BS-PA66: 1}
  cavities: 26
  wires: {pdm: B}
  sources: ["motec_pdm30_datasheet.pdf", "scripts/generate_connector_build_sheets.py PDM_B_PIN"]
PDM30-STUD:
  where: cabin
  device: PDM30 battery stud (M6; "eyelet and M6 nut")
  family: lug
  kit: {}
  lugs: {PDM_BPOS: DL214}
  wires: [PDM_BPOS]
  sources: ["motec_pdm30_datasheet.pdf ('Mating: eyelet and M6 nut')", "build book DC primary table (DL214 = PDM30 M6)"]

PDM15-A:
  where: engine
  device: MoTeC PDM15 (engine PDM), connector A (34-way, #65044) — engine bay by the battery (working position)
  family: ssc
  kit: {M800-KIT-N: 0.5, SSB-34BS-PA66: 1}
  cavities: 34
  wires: {pdm: A, box: PDM15}
  open:
    - "20 A outputs feeding a wire heavier than 16 AWG (#21 fan OUT1, START_TRIG OUT4): 2 × 16 AWG M22759/32 pigtails, one per pin, equal length, into an in-line MiniSeal M81824/1-3 with the load wire out the other end (SPL-PDM15-OUTn endpoints; the pigtails are registry wires). MoTeC PDM manual p.48: 20# to 16# for 20 A outputs, 16# = 15 A at 80 °C; a D-609 stub splice can't take all three (2 × 16 + 12 AWG = 11,690 CM, past the 16–12 AWG cavity of the 3137CT)"
    - "one 16 AWG rail feed on a paired 20 A output (INJ_PWR A3+A12, COIL_PWR A5+A14): one conductor can't fill both cavities (PDM manual p.43) — two equal-length 16 AWG conductors into the rail splice, or a pigtail pair (builder's call)"
    - "#66 fuel pump 14 AWG on the single 8 A pin A4 (OUT10): the Superseal contact takes 24–16 AWG and MoTeC recommends 24# to 20# on 8 A outputs (PDM manual p.48). Either one 16 AWG pigtail into an in-line M81824/1-3 (16 is past the 8 A recommendation, inside the contact), or #66 at 16 AWG (0.40 V, 3.0 % at 5.1 A over 18.4 ft — the record's own figure). Builder's call"
    - "mount: away from exhaust heat — 110 °C max internal, 100 °C recommended (MoTeC PDM user manual, Mounting)"
  sources: ["motec_pdm_user_manual.pdf p.43 (PDM15 pinout)", "owner 2026-09-24 'multiple PDM'; split engine/body 2026-09-27"]
PDM15-B:
  where: engine
  device: MoTeC PDM15 (engine PDM), connector B (26-way, #65045)
  family: ssc
  kit: {M800-KIT-N: 0.5, SSB-26BS-PA66: 1}
  cavities: 26
  wires: {pdm: B, box: PDM15}
  sources: ["motec_pdm_user_manual.pdf p.43 (PDM15 pinout)"]
PDM15-STUD:
  where: engine
  device: PDM15 battery stud (M6; "eyelet and M6 nut")
  family: lug
  kit: {}
  lugs: {PDM15_BPOS: DL214}
  wires: [PDM15_BPOS]
  note: "PDM15_BPOS is 2 AWG (cable_decisions.json: a MEGA 100 needs 118 A of cable, 4 AWG has 100 A at 100 °C), so DL214 (2 AWG, 1/4 in = M6) fits the stud again"
  open: []
  sources: ["motec_pdm_user_manual.pdf p.43 (connector C: M6 stud, Battery +)", "motec_pdm_user_manual.pdf p.48 (wire table; battery pos 4# to 2#)"]

