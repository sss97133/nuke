# ============================================================== cabin: laptop ports
PORT-ETH:
  where: cabin
  device: M130 laptop port — panel RJ45 (Cat5, crossover at the loom side)
  family: ssc
  kit: {M-RJ45-CABLE: 1}
  wires: [ETH_TX+, ETH_TX-, ETH_RX+, ETH_RX-]
  note: "crossover at the loom side (M1 Tune p.10): B23 TX+ → socket pin 3, B24 TX- → 6, B25 RX+ → 1, B26 RX- → 2 (Dave's B23-B26); the panel cable's own conductor colours get read on arrival"
  sources: ["M1 Tune manual p.10", "prowire M-RJ45-CABLE page"]
CAN-BUS:
  where: cabin
  device: "M1 CAN bus: trunk M130 → PDM30 → 61-pin → PDM15 → LTCD, with the UTC stub"
  family: none
  kit: {CAN-TERM-100R: 2}
  wires: [CAN_HI, CAN_LO, UTC_CANH, UTC_CANL, UTC_0V]
  note: "22 AWG twisted, at least one twist per 50 mm; the bus reaches the engine PDM15 and the LTCD (> 2 m), so a 100R 0.25 W at each end — the M130 end and the LTCD end (MoTeC PDM manual p.49-50)"
  topology:
    order:
      - {node: M130, pins: "B17 CAN Hi / B18 CAN Lo", role: "trunk end: 100R here"}
      - {node: PDM30, pins: "B26 CAN High / B25 CAN Low", role: "on the trunk, stub 500 mm max"}
      - {node: "61-pin firewall", pins: "GG CAN Hi (CAN_FW_H) / j CAN Lo (CAN_FW_L)", role: "trunk passes through"}
      - {node: PDM15, pins: "B26 CAN High / B25 CAN Low", role: "on the trunk, stub 500 mm max"}
      - {node: LTCD, pins: "DTM 4-pin #68054: 3 CAN Hi (white) / 2 CAN Lo (green)", role: "trunk end: 100R here"}
    stubs:
      - {node: "UTC port (PORT-UTC)", pins: "XLR 5 CAN-HI / 4 CAN-LO / 1 0V", rule: "stub 500 mm max, within 500 mm of one end of the trunk"}
    terminators: "100R 0.25 W at each end of the trunk (p.49)"
    twist: "twisted pair, minimum one twist per 50 mm (2 in) (p.49-50)"
    stub_max_mm: 500
    utc_within_mm_of_end: 500
    bus_max_m: 16
    cable: "100R data cable preferred; twisted 22# Tefzel is usually OK (p.49)"
    sources: ["MoTeC PDM user manual PN 63029 p.49 'UTC Wiring for PC Connection' + 'CAN Bus Wiring Requirements'", "p.50 bus drawing + 'Short CAN Bus'", "MoTeC LTCD user manual p.37 'General CAN Bus Wiring Requirements' (same rules)", "MoTeC PDM user manual p.43 (PDM15 B25 CAN Low, B26 CAN High), p.44 (PDM30)"]
  open:
    - "CAN cavities GG and j are not adjacent on the 61-pin: choose an adjacent pair from the spares c, d, t, u or accept (the twisted pair splits across the insert; review A10). Cavity d is spare since the speed sender left the 61-pin (review A11)"
    - "UTC stub: splice the UTC pair onto the trunk within 500 mm of the M130 end, stub 500 mm max (p.49); the splice point is not placed yet"
    - "PDM30 and PDM15 stubs 500 mm max off the trunk (p.49): each PDM takes two wires per CAN pin (trunk in, trunk out) or a short stub — set at the formboard"
    - "LTCD lead length from the PDM15: not measured (it is the far trunk end, with its own 100R)"
  sources: ["MoTeC PDM user manual p.49-50 'CAN Bus Wiring Requirements' + 'Short CAN Bus'"]
PORT-UTC:
  where: cabin
  device: PDM30 config port — 5-pin female XLR for the MoTeC UTC #61059
  family: xlr_solder
  kit: {NC5FD-L-1: 1}
  wires: [UTC_CANH, UTC_CANL, UTC_0V]
  note: "the UTC #61059 adapter itself is bought with the M130/PDM30 via Dave"
  sources: ["MoTeC PDM user manual p.48"]

