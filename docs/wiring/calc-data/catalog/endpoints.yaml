# ============================================================== the whole truck (2026-09-27 evening)
# Owner: "work on the whole truck"; "wiring in the factory switches and modules and figure out how they work in a can bus
# motec computer". Factory switches stay factory: the ones with a separate common become PDM30 inputs (their common goes to
# PDM30 0V, A28 — chapters/17 §17.7.7, PDM manual p.47); the wiper and blower keep their own factory circuits (1977 manual
# p.803, p.87-88) with a PDM output as the fused feed. Body circuits cross the firewall through FIREWALL-BODY-*, never
