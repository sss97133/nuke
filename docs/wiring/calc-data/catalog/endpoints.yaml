  note: "4 rings for the coils: chassis and signal grounds kept separate (Dave), 4 x 18 AWG per ring = 12 AWG barrel. The M130 grounds A10/A11 (ECU_GND1/2, 16 AWG, equal length) land on the head too (chapters/17 §17.4.6)"
  open:
    - "ground point, stud size, lug count: name it (state row 56 banks) — Dave's sheet says only 'head ring terminal'; no stud, bank or count is recorded for the 16 coil grounds or the M130 grounds A10/A11 (review A9)"
