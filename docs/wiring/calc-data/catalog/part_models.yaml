  pins:
    file: M130-A.pins.json (built with the part)
    numbering: 'reference_documents/component_drawings/te_C-2-1437285-3_superseal_1.0_plug_housing_34_26_customer_drawing.pdf
      sheet 1 (34-way) and sheet 2 (26-way), the numbered view placed right of the side view: third-angle (the sheet''s projection
      symbol), so it is the wire side. Rows 1-9 / 10-17 / 18-25 / 26-34 (26-way: 1-7 / 8-13 / 14-19 / 20-26), cavity 1 top-left
      with the polarity-marked lock on top'
    names: docs/wiring/calc-data/m130_designations.txt (MoTeC datasheet 13130 pp.4-5; M1 ECU Hardware pp.16-17)
    orientation_unknown: 'Which way the plug''s polarity side faces is not printed by MoTeC: the model puts TE''s polarity-marked
      lock on the header''s latch side (the front of the unit), which puts A01 and B01 front-left looking up. Check A01 against
      the moulded numbers before a pin is trusted.'
  branding:
    what:
    - red frame around the maker mark
    - maker mark 'MoTeC' (Arial Bold Italic stand-in)
    - model 'M130'
    - red underline
    - '''ENGINE MANAGEMENT'''
    - '''SYSTEM'''
    basis: 'branding, redrawn from photo: text and shapes sized off the maker''s product photo; fonts are stand-ins; cosmetic,
      never used for fit; no maker artwork used'
    source: MoTeC product photo large_m130
  unknowns:
  - The Key 1 rib geometry inside the headers is not in any drawing on file; the latch side is modelled.
  - Which way the plug's polarity side faces (so where A01 sits) is not printed by MoTeC; the model's choice is marked.
  - The plug is drawn fully seated (its 13.7 mm nose inside the header); TE does not dimension the mated stack.
  - 'The ProWire backshells are sized off ProWire''s photos (no printed dimensions): basis photo, fit not guaranteed.'
  - The boot (straight / 70 / 90 degrees) is HELD, so the model stops at the backshell's exit collar.
  - Scaled values (orange on the drawing) are read off MoTeC's drawing at its printed scale, not printed numbers.
  - Pin colour is not visible in the photo.
  cross_checks:
  - 'Header widths: re-measured at 600 dpi on MoTeC p.3 (35.01 / 29.01) and on the PDM manual p.47 drawing of the same case
    (34.98 / 28.92); TE''s 34- and 26-way housings differ by two 3 mm pin columns (38.2 vs 32.2), and 35.0 - 29.0 = 6.0. The
    ECU-side headers are TE cap assemblies (3-1437285-x, TE sheet 1 table 1), whose drawings are not on file.'
  notes:
  - The 18 degree angle on MoTeC's p.3 is the connector housing's side draft (bottom view). The plugs exit straight down;
    research/2026-06-09_design-inputs-recon.md reads it as an '18 degree connector exit'.
  - MoTeC's label is a raised badge (product photo). It is drawn as a flush panel in a 0.4 mm recess so the printed 38.7 depth
    holds; its lettering is redrawn from the photo as cosmetic text, not MoTeC's artwork.
  script: docs/wiring/calc-data/cad/fab/M130-A.py
