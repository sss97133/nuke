TOP-FINISH:
  name: Finish the top's inside — butyl on the flats, a closed-cell thermal layer and removable headliner panels, the top harness in the rib channels behind them
  status: candidate
  source: >-
    owner 2026-09-29 ("how do we finish the roof doing insulate it or delete it raw"). State §1 row 42 ("K5 insulation = COMPLETE (roof,
    firewall, floor)") rests on "I've already insulated the vehicle" (receipt 2026-05-23). The photos lane (2026-09-29) found bare moulded
    fiberglass under the top (2021-06-12), bare painted steel under the half-cab roof (2024-10 to 2024-12) and Kilmat butyl only on the
    cargo-tub walls (2026-01-31 and 02-01), so the lock does not cover the top. Materials and prices: Dynamat Xtreme bulk pack 36 sq ft
    $239.95 (dynamat.com, 2026-09-29; maker claims 9-18 dB for a full install); Lizard Skin Ceramic Insulation 1 gal $89.95, 22-25 sq ft at
    .040-.060 in, "can reduce heat transfer by up to 30 degrees F" (raybuck.com, 2026-09-29); Click Bond cable-tie mount kit, 4 mounts,
    $97.75 (aircraftspruce.com 04-06000, 2026-09-29)
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    notes: >-
      Behind panels the top harness runs in the rib channels in DR-25 on bonded mounts, with service loops at every lamp and at the pillar;
      left raw, the same bundle is exposed and clipped at least every 18 in (ABYC E-11). The harness goes in before any insulation. OPEN: the
      top's inside area and rib spacing (T-15), its weight, the panel material. Alternatives: research §5.
    adds: []

# ============================================================== cooled front seats (2026-09-30)
# Owner 2026-09-29: "we can insert a AC pad on the seats not because then we have to worry about HVAC at least looking into how
# would we actually doair condition seats". Research, versions, prices and every source: research/2026-09-30_cooled-seats.md
# (pages snapshotted 2026-09-29 to reference_documents/web_snapshots/, gitignored). Neither is decided. The seats are the factory
# 1977 buckets, already reupholstered and back in the cab (vehicle_observations a4966700-e362-4881-9ca8-c1c78b4c3f1a, photo dated
# 2026-01-31 by the camera), so either option reopens finished seats. Neither can tap an existing output: each needs its own
# output behind an engine-running condition, so the seats can't drain the battery.

SEAT-TED:
  name: Cooled and heated front buckets, thermoelectric, one Sanctum heat/cool kit per seat (LeatherSeats.com)
  status: candidate
  source: >-
    owner 2026-09-29 ("air-conditioning we can insert a AC pad on the seats not because then we have to worry about HVAC"). Kit:
    LeatherSeats.com product page (web_snapshots/leatherseats.com__seat-heater-cooler-unit.md) and installation guide
    (leatherseats.com__sanctum-heater-cooler-installation-guide.md): per seat a TED and centrifugal blower for the cushion and
    for the backrest, distribution pads, exhaust ducting, control module, six-setting switch (3 cool, 3 heat), relay, 15 A
    inline fuse, intake bezel for closed backs; "a circuit with a minimum of 15 amps per unit"; the cover must pass air.
    Katzkin's DegreeZ is the same kind of kit but "can only be installed on a Katzkin perforated leather interior"
    (katzkin.com__degreez.md), so it is not a version here
  product: {maker: "LeatherSeats.com (Sanctum)", pn: null, price_usd: 400.00, price_date: 2026-09-29, each: true,
            specs: "no part number published; TED and blower sizes, current per setting, inrush and noise not published; 15 A circuit per seat"}
  demand:
    crossings: 0
    pdm30_outputs: 2
    pdm30_inputs: 0
    door_cavities: 0
    limits: ["one 20 A output per seat, limit 15 A (the kit's own 15 A fuse); holds for a measured draw up to 12 A (>= 1.25 x load, canon ch.17); two seats need 30 A, over one 20 A output's 25 A setting ceiling (MoTeC PDM manual p.24)"]
    notes: >-
      the PDM30's two spare 20 A outputs are OUT3/OUT4, which PW also takes: without PW the seats use them; with PW they go on a
      cab PDM15 (its one spare 20 A output, plus two 8 A outputs in parallel, manual p.6) or two 20 A loads move off the PDM30.
      A bay PDM can't feed them (one 61-pin, #20 contacts). The outputs switch on only with RUN (PDM30 DIG1), not START (DIG10),
      and M130 engine RPM over CAN above cranking speed (M1 General 0x640; PDM manual p.38 RPM example). The kit's relay and fuse
      are left out: the PDM output is both. The DTP seat plugs must be the E-seal (C015) version: 12 AWG /32 is 2.62 mm, and
      the standard #12 seal starts at 3.40 mm (E-seal 2.46-4.01 mm; Deutsch datasheet farnell 628276 printed p.5). OPEN: E-seal
      part numbers; the plaid inserts' backing must pass air; the passenger feed's gauge waits on the bench current (12 AWG
      holds 3 % drop to 8.3 A on the estimated run); the backrest's depth for the back TED; the PDM30 100 A and alternator
      150 A budgets with the seats' 30 A
    adds:
      - {id: SEAT_L_PT1, gauge: 16, spec: M22759/32, from: "PDM 20 A output, pin 1 (PDM30:OUT3 pin A5 without PW; else the cab PDM15's spare 20 A output)", to: "SPL-SEAT-L (M81824/1-3)", current_a: null, length_ft_est: 0.5, basis: "20 A outputs take 20-16 AWG per pin (MoTeC PDM manual p.6); 2 x 16 AWG pigtails per 20 A output, the build's pattern (state 0ac); 7.5 A each at the 15 A limit, 16# 15 A x 0.85 = 12.75 A (manual p.48)"}
      - {id: SEAT_L_PT2, gauge: 16, spec: M22759/32, from: "PDM 20 A output, pin 2 (PDM30:OUT3 pin A14 without PW)", to: "SPL-SEAT-L (M81824/1-3)", current_a: null, length_ft_est: 0.5, basis: "as SEAT_L_PT1"}
      - {id: SEAT_L_PWR, gauge: 12, spec: M22759/32, from: "SPL-SEAT-L", to: "SEAT-L-PASS-P pin 1 (DTP04-2P, floor side)", current_a: null, length_ft_est: 6, basis: "kick panel 0.5 m (unmeasured) + half the 940 mm door opening (cad/dimensions.yaml fr88.body.door.F-C) + 0.3 m inboard and up (unmeasured) + the 12 in service loop (canon ch.18 s4), + 15 % body pad (state s1); bundled 20 A x 0.85 = 17 A >= 15 A limit (canon ch.16 s2.3, ch.17); 3 % drop holds to 17.3 A on the 12 ft loop (2.02 ohm/kft, ProWire M22759/32 table)"}
      - {id: SEAT_L_GND, gauge: 12, spec: M22759/32, from: "SEAT-L-PASS-P pin 2", to: "GND-BANK-CAB", current_a: null, length_ft_est: 6, basis: "as SEAT_L_PWR; grounds run in the loom to the bank (state s1 row 56)"}
      - {id: SEAT_R_PT1, gauge: 16, spec: M22759/32, from: "PDM 20 A output, pin 1 (PDM30:OUT4 pin A7 without PW; else two cab PDM15 8 A outputs in parallel on 20 AWG, 2 x 6.8 A = 13.6 A limit)", to: "SPL-SEAT-R (M81824/1-3)", current_a: null, length_ft_est: 0.5, basis: "as SEAT_L_PT1"}
      - {id: SEAT_R_PT2, gauge: 16, spec: M22759/32, from: "PDM 20 A output, pin 2 (PDM30:OUT4 pin A16 without PW)", to: "SPL-SEAT-R (M81824/1-3)", current_a: null, length_ft_est: 0.5, basis: "as SEAT_L_PT1"}
      - {id: SEAT_R_PWR, gauge: 12, spec: M22759/32, from: "SPL-SEAT-R", to: "SEAT-R-PASS-P pin 1 (DTP04-2P, floor side)", current_a: null, length_ft_est: 12.5, basis: "as SEAT_L_PWR plus the 1746 mm crossing under the dash (cad/dimensions.yaml fr88.body.apillar.A-B); 3 % drop holds only to 8.3 A on the 25 ft loop; 10 AWG M22759/16 (1.26 ohm/kft, canon ch.16 s1.8) holds to 13.3 A but needs a 10-to-12 AWG transition at the DTP (size 12 contacts 14-12 AWG); the gauge is set after the bench measurement"}
      - {id: SEAT_R_GND, gauge: 12, spec: M22759/32, from: "SEAT-R-PASS-P pin 2", to: "GND-BANK-CAB", current_a: null, length_ft_est: 12.5, basis: "as SEAT_R_PWR"}
    mass_g_est: "about 330 g of 12 AWG (37 ft at 29.0 kg/km, ProWire M22759/32 table) + 8 g of 16 AWG pigtails; kit masses not published"

SEAT-VENT:
  name: Ventilated front buckets, fans only (cabin air through the plaid), a universal seat ventilation kit per seat
  status: candidate
  alternative_to: SEAT-TED
  source: >-
    owner 2026-09-29 (as SEAT-TED). Fan kits found: unbranded universal kit, eBay item 386015618313, one seat, "3-setting
    switch ... mesh included", $340.00 + $4.50 shipping (web_snapshots/www.ebay.com__386015618313.md); unbranded, eBay item
    285252981715, $165.00 (www.ebay.com__285252981715.md). Neither publishes a part number, fan size, current or noise. OEM
    ventilation blowers (VW 3G0 963 345, MSRP $46.22, parts.vw.com__3g0963345.md) are driven over LIN (forum evidence,
    www.vwidtalk.com__ventilated-front-seats-mod-retrofit.4712.md), and neither the M130 (M1 hardware techspec p.6) nor the
    PDM speaks LIN
  product: {maker: "unbranded (eBay item 386015618313)", pn: null, price_usd: 340.00, price_date: 2026-09-29, each: true,
            specs: "one seat, 3-setting switch, mesh pad; fan count, size, current and noise not published"}
  demand:
    crossings: 0
    pdm30_outputs: 1
    pdm30_inputs: 0
    door_cavities: 0
    limits: ["one 8 A output for both seats, limit 1.25 x the measured total, at most 6.8 A on the 20 AWG pin lead (8 A x 0.85, MoTeC PDM manual p.48)"]
    notes: >-
      the air is only as cool as the cab: there is no active cooling. The PDM30's only spare 8 A output is OUT21, which PL takes;
      otherwise a cab PDM15 8 A output, or a PDM32 in place of the PDM30 (two more 8 A outputs, manual p.1). Same engine-running
      condition as SEAT-TED. The kit's own switch sets the fan speed, because the PDM can't: "Motor speed control is currently not
      supported" (PDM manual p.28). The DT seat plugs must be the E-seal (C015) version: 18 AWG /32 is 1.52 mm, and the
      standard #16 seal starts at 2.24 mm (E-seal 1.35-3.05 mm; Deutsch datasheet farnell 628276 printed p.5). OPEN: E-seal part
      numbers; the plaid backing must pass air; per-seat current (18 AWG holds 3 % drop to 5.6 A driver, 2.7 A passenger)
    adds:
      - {id: VENT_PT, gauge: 20, spec: M22759/32, from: "PDM 8 A output (PDM30:OUT21 without PL; else a cab PDM15 8 A output)", to: "SPL-SEAT-VENT", current_a: null, length_ft_est: 0.5, basis: "8 A outputs take 24-20 AWG (MoTeC PDM manual p.6); 20# 8 A at 80 C (p.48) x 0.85 = 6.8 A; a pigtail is under the 24 in bundling threshold (canon ch.16 s2.2)"}
      - {id: VENT_L_PWR, gauge: 18, spec: M22759/32, from: "SPL-SEAT-VENT", to: "SEAT-L-PASS pin 1 (DT04-2P, floor side)", current_a: null, length_ft_est: 6, basis: "route and length as SEAT_L_PWR; 18 AWG for drop: 3 % holds to 5.6 A on the 12 ft loop (6.23 ohm/kft, ProWire M22759/32 table)"}
      - {id: VENT_L_GND, gauge: 18, spec: M22759/32, from: "SEAT-L-PASS pin 2", to: "GND-BANK-CAB", current_a: null, length_ft_est: 6, basis: "as VENT_L_PWR"}
      - {id: VENT_R_PWR, gauge: 18, spec: M22759/32, from: "SPL-SEAT-VENT", to: "SEAT-R-PASS pin 1 (DT04-2P, floor side)", current_a: null, length_ft_est: 12.5, basis: "route and length as SEAT_R_PWR; 3 % holds to 2.7 A on the 25 ft loop"}
      - {id: VENT_R_GND, gauge: 18, spec: M22759/32, from: "SEAT-R-PASS pin 2", to: "GND-BANK-CAB", current_a: null, length_ft_est: 12.5, basis: "as VENT_R_PWR"}
