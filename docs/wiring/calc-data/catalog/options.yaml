# lights ... dreamed of doing solar panel install should be crazy and the problem is probably we had to run fat ass wires to
# it ... we need to actually do like the lighting design ... how do we finish the roof doing insulate it or delete it raw ...
# do we put any cameras or anything in it". Research, options, prices and every source:
# research/2026-09-30_fiberglass-top-disconnect-solar-lighting.md. None of these is decided.
# The 1977 K5 has a steel half-cab roof over the front seats; the fiberglass top covers the rear only (1977 LTSM PDF p.155:
# the top is clamped "against the steel cab"). Only what sits on the top crosses TOP-DISC. Lengths: top side = the plug at the
# lower rear pillar to the part; body side = the part to the PDM30; together they split the registry's 18.4 ft zone estimate
# for #93/#74 (13 ft body + 5.5 ft top), +15 % pad already in (state §1 row 33, 'Length pad on cuts'). Every length is an estimate until tape item
# T-15 (wiring/geometry, PR #417) is taped.

TOP-DISC:
  name: Top disconnect — one round MIL-DTL-38999 Series III, shell 17 insert 26 (26 x #20), at the lower rear pillar
  status: candidate
  source: >-
    owner 2026-09-29 ("we need a really cool disconnect if we're gonna be running anything on the fiberglass top"); owner 2026-09-29 via
    the pieces lane: other bulkheads only round ones (receipts/2026-09-29_owner-calls-one-61pin-at-fusebox-hole.md). Spot: GM's own
    disconnect for the top's dome-lamp harness sits behind an access plate at the lower rear pillar (1987 Light Duty Truck Service
    Manual PDF p.1363, 10A5-12, Fig. 17: "Access plate (108) and dome lamp wiring harness"); the 1978 C-K booklet ST-352-78 foldout A-1
    feeds the Blazer dome lamp through a 2-way connector 8905978/8905979 ("BLAZER RPO-CB8"). Connector data: MILNEC TX (MIL-DTL-38999
    Series III equivalents) catalog Rev. 2235: p.B-9 (#20 = 7.5 A with 20 AWG, test rating; jacket seal 1.02-2.11 mm), p.B-19 (17-26 =
    26 x #20, service I), pp.B-23/B-24 (plug and wall-mount receptacle), p.B-49 (TXAB boot adapter, K2 = recommended straight boot),
    pp.B-51/B-52 (covers, stowage receptacle), p.A-14 ("a single 360° turn of the ratchet coupling ring ... without the need for
    tools"); local copy reference_documents/component_drawings/MILNEC_D38999_series_III_catalog.pdf
  product: {maker: "MIL-DTL-38999 Series III (MILNEC TX shown)", pn: "D38999/20WE26PN receptacle (body, pins) + D38999/26WE26SN plug (top, sockets); MILNEC TX00W17-26PN-K2-02 + TX06W17-26SN-K2; stowage receptacle TXCD-17W-02 on the top",
            price_usd: null, price_date: 2026-09-29,
            specs: "shell 17: plug OD 1.406 in (35.7 mm), 1.234 in (31.3 mm) long; receptacle flange 1.323 in (33.6 mm) square, holes 1.062 in (27.0 mm) apart, front-mount cutout 1.016 in (25.8 mm); IP67; contacts M39029/58-363 pins + M39029/56-351 sockets (the 61-pin's, catalog/parts.yaml), empty cavities MS27488-20-2; tools AFM8 + K43 + M81969/14-10 (catalog/tools.yaml)"}
  demand:
    crossings: 0          # not a firewall crossing: the top joint is inside the body shell
    pdm30_outputs: 0
    pdm30_inputs: 0
    top_cavities: {capacity: 26, used_by_every_top_candidate: 14, spare: 12, reserved: "4 of the spares for a top-mounted Starlink DC pair if the dish ever moves to the top (nav-comms 2026-09-29 puts it on the steel half-cab roof)"}
    notes: >-
      Pins on the body receptacle (capped when the top is off), sockets on the top's plug (the solar contacts are live in daylight); the
      plug parks in a stowage receptacle on the top. Unplug first, and never under PV load. Paralleled #20 pairs carry the PV poles and the
      lamp return, so the 61-pin's AFM8 + K43 tooling does every contact. Letters and the final insert wait for the mock-up (chapters/18 §6).
