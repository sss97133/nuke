    (www.sensata.com__preview-side-defender-ii.md, "a reliable legacy solution"): 24 GHz FMCW, 9-33 V, < 0.5 A, IP69K, J1939
    250/500 kbit/s, aux output sinks 1 A (a mirror LED), Deutsch DT06-08SA plug; "do not connect ... directly to the vehicle CAN bus",
    use its PreView display as a one-way gateway; mount 23-39 in high and 137-197 in back from the front edge; "intended for
    commercial use". Partly validated for this truck: the mount zone is drawn for trucks and buses, and no price is published
  product: {maker: Sensata (PRECO PreView), pn: "Side Defender II (SDII87) + PreView D2002 or G2000 display", price_usd: null, price_date: 2026-09-29,
            specs: "4.90 x 4.06 x 1.28 in, 1.0 lb each; J1939 not terminated; turn input on pin 8"}
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    taps: ["PDM30 OUT23 (RUN): sensor power", "PDM30 OUT27 / OUT28 (turn L/R): pin 8 turn input"]
    limits: ["OUT23 group: + up to 1.0 A (2 x < 0.5 A)"]
    door_cavities: 0
    notes: >-
      its J1939 bus is private between the sensors and the PreView display, never the M1 trunk. OPEN: price (distributor quote);
      whether a 106.5 in wheelbase Blazer has a body side 137-197 in back from the front edge at 23-39 in high clear of metal
    adds:
      - {id: SD2_L_PWR, gauge: 20, spec: M22759/32, from: "PDM30:OUT23", to: "SD2-L pin 1 battery +", current_a: 0.5, length_ft_est: 16, basis: "rear quarter to the cab, estimate below the 18.4 ft plate run"}
      - {id: SD2_L_GND, gauge: 20, spec: M22759/32, from: "SD2-L pin 2", to: "GND-SPLICE-REAR", current_a: 0.5, length_ft_est: 4, basis: "to the rear ground bus (estimate)"}
      - {id: SD2_L_CAN, gauge: 22, spec: "M22759/16 twisted pair", from: "SD2-L pins 3/4", to: "PreView display (J1939 250/500k)", current_a: 0, length_ft_est: 16, basis: "as SD2_L_PWR"}
      - {id: SD2_L_TURN, gauge: 20, spec: M22759/32, from: "splice on #80 (PDM30:OUT27)", to: "SD2-L pin 8 turn input", current_a: 0, length_ft_est: 16, basis: "as SD2_L_PWR"}
