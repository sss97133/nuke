# ============================================================== wheel speed sensors, tone rings, knuckle mounts (2026-09-30)
# Owner 2026-09-29: "we need to deal with TPS sensors and then the other side of the sensor which we have to figure out how to
# install that machine or whatever machining part of the axle the knuckle". Read as wheel speed sensors, the tone rings they read
# and the knuckle mounts. Research, prices and every source: research/2026-09-30_wheel-speed-sensors.md (web pages snapshotted
# 2026-09-29 to reference_documents/web_snapshots/, gitignored). Nothing on the truck needs wheel speeds: the iBooster runs
# standalone on its pedal sensor, the PCS needs only engine RPM, the Dakota reads the NP205 sender. They buy traction and launch
# control in 2WD and slip logging. None of these is decided. Their M130, 61-pin and PDM15 demand is in the keys above, so
# options_v5 shows it in the verdict next to the other candidates.


WSS-F2:
  name: Front wheel speed sensors, two ZF GS100502 on machined tone rings, into M130 UDIG5 / UDIG6 (traction and launch control in 2WD)
  status: candidate
  conflicts_with: [NAV-L10]     # both name M130 B11 (UDIG6); see demand.limits CONFLICT
  source: >-
    owner 2026-09-29 (above). MoTeC M1 Launch Control User Guide v1.0 p.3: "A minimum of two sensors (one each of Driven Wheel and
    Non-Driven Wheel Speed) is recommended"; the driven one is the NP205 sender #100 on M130 B08, which MoTeC's own GPR example
    pinout names "Wheel Speed Rear Drive Sensor" (web_snapshots/www.motec.com.au__GPR.md). UDIG as the wheel-speed resource: MoTeC
    help centre "Checklist Wheel Speed Setup" (motec.zendesk.com__14594472064015-Checklist-Wheel-Speed-Setup.md) and M1 hardware
    techspec p.9 ("Can be used for REF/SYNC, CAM position, wheel speed")
  product: {maker: ZF, pn: GS100502, price_usd: 33.80, price_date: 2026-09-29, each: true,
            specs: "Hall, open-collector sinking 20 mA max, 5-24 V at 6 mA max, 1.5 mm air gap, near zero to 15 kHz, M12x1 aluminium body 65.5 mm, 20 AWG x 1 m leads, -40 to 125 C, IP67 (ZF GS1005-GS1007 datasheet, 2016-07-06); DigiKey qty 1, 1,300 in stock"}
  demand:
    crossings: 0            # no body bulkhead
    pdm30_outputs: 0
    pdm30_inputs: 0
    pdm15_outputs: 1        # OUT14 (8 A) at 1 A, the sensor feed
    m130_pins: 2            # B10 (UDIG5), B11 (UDIG6)
    m130_udig: 2            # the last two spare universal digital inputs
    pin61_cavities: 2       # the two signals: 2 of the 3 spare cavities (d, t, u)
    limits: ["CONFLICT: M130 B11 (UDIG6) is also named by NAV-L10 (the MoTeC GPS-L10 alternate, PR #421, on B11 or B14 per its manual; B14 is ISO_KILL). The M130 has two spare UDIGs, B10 and B11, and WSS-F2 takes both, so WSS-F2 and NAV-L10 cannot both be built on this M130. NAV (CAN only) takes no M130 pin and does not conflict. Owner call",
             "PDM15 OUT14 (8 A) at 1 A, the smallest step (PDM manual p.1 'Outputs are programmable in 1 A steps'); load 2 x 6 mA (ZF p.1). OUT14 is uncontested: STEP-DCMD (PR #428, on the registry's PDM15) takes OUT8, OUT10 and OUT12 (demand.pdm15_outputs: 3) and wants OUT15 only as an optional second feed; nothing here plans on OUT15. If the bay box becomes a sealed PDM32 (state 0ah, pending), these outputs remap in that registry pass",
             "SEAL: DTM seals take 1.35-3.05 mm insulation (Deutsch DT Series Technical Manual, farnell 628276, feature table) and M22759/32-20 is 1.27 mm (catalog/parts.yaml WIRE-OD, ProWire), so the harness side of each corner DTM does not seal as listed (the state 0ai class of problem). Fixes: 20 AWG M22759/16 (1.5 mm, inside the published DTM range, and it fits the 20 AWG contacts and the 61-pin #20; needs the owner's OK, like the 22 AWG /16 change of 2026-09-26; check that the 1.35-3.05 mm range is one seal, since 0ai found the DT feature-table range spans two) or 18 AWG /32 (1.52 mm) on 16-18 AWG size-20 contacts 0460-010-20141 / 0462-005-20141, spliced to 20 AWG before the 61-pin (#20 contacts take 20-24 AWG). The ZF's own lead OD is not published: caliper it. Dave's call"]
    door_cavities: 0
    notes: >-
      M130 B10 (UDIG5) front left and B11 (UDIG6) front right: 52 -> 54 of 60 pins, and the last two UDIGs. 61-pin 58 -> 60 of 61;
      registry #100 may take cavity d back when body bulkhead C goes under the 0ah call, which would fill it. PDM15 OUT14 (8 A)
      feeds both sensors, and their 0 V goes to GND-BANK-ENG, so only the two signals
      cross (Dave's call against the MoTeC-pattern SEN_5V0_B / SEN_0V supply, which takes 2 more cavities). Mechanical: two
      low-carbon steel tone rings pressed on registers turned on the inboard barrels of the front hub-and-discs (1977 LTSM
      pp.305-306). Teeth are at least ZF's 5.0 mm high, 2.5 mm wide, 10 mm apart (12.5 mm pitch, count = floor(pi x tip dia /
      12.5), at least 24 per MoTeC, 48 preferred). Two bolt-on brackets go under two spindle nuts (25 ft-lb K10/K20, LTSM
      p.307) or the caliper support-bracket bolts. Each corner has a DTM04-3P / DTM06-3S at the frame, inside the rail channel.
      OPEN: hub barrel OD, tire size, corner temperature (125 C sensor; Bosch HA-M at 160 C is the fallback), machine-shop
      quote, and 61-pin cavity approval
    adds:
      - {id: WSS_FL_SIG, gauge: 20, spec: M22759/32, from: "WSS-FL DTM06-3S cavity 3 (ZF black, output)", to: "M130:B10 (UDIG5) through a spare 61-pin cavity", current_a: 0, length_ft_est: null, basis: "not derived: the front hub, the frame hose bracket and the 61-pin plate are not all placed in the twin yet"}
      - {id: WSS_FR_SIG, gauge: 20, spec: M22759/32, from: "WSS-FR DTM06-3S cavity 3 (ZF black, output)", to: "M130:B11 (UDIG6) through a spare 61-pin cavity", current_a: 0, length_ft_est: null, basis: "as WSS_FL_SIG"}
      - {id: WSS_F_PWR, gauge: 20, spec: M22759/32, from: "PDM15:OUT14 (8 A), 1 A limit", to: "SPL-WSS-F (front sensor feed splice)", current_a: 0.012, length_ft_est: null, basis: "2 x 6 mA max (ZF datasheet p.1); length as WSS_FL_SIG"}
      - {id: WSS_FL_PWR, gauge: 20, spec: M22759/32, from: "SPL-WSS-F", to: "WSS-FL DTM06-3S cavity 1 (ZF brown, supply)", current_a: 0.006, length_ft_est: null, basis: "as WSS_FL_SIG"}
      - {id: WSS_FR_PWR, gauge: 20, spec: M22759/32, from: "SPL-WSS-F", to: "WSS-FR DTM06-3S cavity 1 (ZF brown, supply)", current_a: 0.006, length_ft_est: null, basis: "as WSS_FL_SIG"}
      - {id: WSS_FL_GND, gauge: 20, spec: M22759/32, from: "WSS-FL DTM06-3S cavity 2 (ZF blue, ground)", to: "GND-BANK-ENG", current_a: 0.006, length_ft_est: null, basis: "as WSS_FL_SIG"}
      - {id: WSS_FR_GND, gauge: 20, spec: M22759/32, from: "WSS-FR DTM06-3S cavity 2 (ZF blue, ground)", to: "GND-BANK-ENG", current_a: 0.006, length_ft_est: null, basis: "as WSS_FL_SIG"}
    mass_g_est: "not estimated: lengths unknown (20 AWG /32 is 1.95 g/ft, header); the ZF sensor mass is not published"

WSS-4E:
  name: Four wheel speed sensors (ZF GS100502) into a MoTeC E888 expander in the cab, read by the M130 over CAN
  status: candidate
  alternative_to: WSS-F2
  source: >-
    M1 Launch Control User Guide p.3 ("with four wheel speed sensors the preferred option"). E888 #14007 page ("4 x digital inputs
    with frequency measurement", web_snapshots/www.motec.com.au__E888.md). E888/E816 manual (16 Dec 2005): p.15 (-10 to 70 C,
    9-22 V, 150 mA, no CAN terminator on board) and p.17 (DIG1-4 Schmitt trigger, 1 Hz-6 kHz, 2700 ohm pull-up). GPR page:
    "Support of MoTeC devices: ADR, E8XX, PDM, SLM, VCS" and "Wheel Speed sensors front/rear left/right, wired or CAN input"
  product: {maker: MoTeC, pn: "E888 #14007 + 4 x ZF GS100502", price_usd: null, price_date: 2026-09-29,
            specs: "E888 price not published (MoTeC dealer quote); ZF GS100502 33.80 each (DigiKey, 2026-09-29)"}
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    pdm15_outputs: 1        # OUT14 at 1 A, the front sensor feed (as WSS-F2)
    m130_pins: 0            # the E888 is read over CAN
    pin61_cavities: 2       # the two front signals, as WSS-F2
    taps: ["PDM30 OUT24 (the M130 feed, RUN): E888 12 V"]
    limits: ["OUT24 group: + 0.15 A for the E888 (manual p.15), sensors excluded"]
    door_cavities: 0
    notes: >-
      The E888's -10 to 70 C rating keeps it out of the engine bay, so it sits in the cab beside the M130 on a CAN stub of 500 mm
      or less (PDM manual p.49). The fronts cross the 61-pin exactly as in WSS-F2 (2 cavities, PDM15 feed, GND-BANK-ENG). The rears
      cross at the rear bulkhead the 0ah call allows: 4 contacts (2 signals, the E888 +8 V aux feed and its 0 V). The rear rings
      are a ring under the wheel-stud heads or one pressed on the C-lock shafts (LTSM pp.365-366), sensor tabs on the existing
      disc-conversion caliper brackets. Rear axle likely GM 12-bolt 8-7/8 (photo 5aefc0bd shows 11 cover bolts; count to confirm).
      OPEN: whether GPR lets an E888 digital input be a wheel-speed resource (M1 Tune 1.5 or a dealer), the E888 price, the +8 V
      aux supply rating, and a rear ring design from the shop
    adds:
