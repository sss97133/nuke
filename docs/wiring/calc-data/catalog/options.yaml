SEAT-VENT:
  name: Ventilated front buckets, fans only (cabin air through the plaid), a universal seat ventilation kit per seat
  status: candidate
  alternative_to: SEAT-TED
  source: >-
    owner 2026-09-29 (as SEAT-TED). Fan kits found: unbranded universal kit, eBay item 386015618313, one seat, "3-setting
    switch ... mesh included", $340.00 + $4.50 shipping (web_snapshots/www.ebay.com__386015618313.md); unbranded, eBay item
    285252981715, $165.00 (www.ebay.com__285252981715.md). Neither publishes a part number, fan size, current or noise. OEM
    ventilation blowers (VW 3G0 963 345, MSRP $46.22, parts.vw.com__3g0963345.md) are driven over LIN (forum evidence,
    www.vwidtalk.com__ventilated-front-seats-mod-retrofit.4712.md), and neither the M130 (M1 hardware techspec p.6) nor the
    PDM speaks LIN
  product: {maker: "unbranded (eBay item 386015618313)", pn: null, price_usd: 340.00, price_date: 2026-09-29, each: true,
            specs: "one seat, 3-setting switch, mesh pad; fan count, size, current and noise not published"}
  demand:
    crossings: 0
    pdm30_outputs: 1
    pdm30_inputs: 0
    door_cavities: 0
    limits: ["one 8 A output for both seats, limit 1.25 x the measured total, at most 6.8 A on the 20 AWG pin lead (8 A x 0.85, MoTeC PDM manual p.48)"]
    notes: >-
      the air is only as cool as the cab: there is no active cooling. The PDM30's only spare 8 A output is OUT21, which PL takes;
      otherwise a cab PDM15 8 A output, or a PDM32 in place of the PDM30 (two more 8 A outputs, manual p.1). Same engine-running
      condition as SEAT-TED. The kit's own switch sets the fan speed, because the PDM can't: "Motor speed control is currently not
      supported" (PDM manual p.28). The DT seat plugs must be the E-seal (C015) version: 18 AWG /32 is 1.52 mm, and the
      standard #16 seal starts at 2.24 mm (E-seal 1.35-3.05 mm; Deutsch datasheet farnell 628276 printed p.5). OPEN: E-seal part
      numbers; the plaid backing must pass air; per-seat current (18 AWG holds 3 % drop to 5.6 A driver, 2.7 A passenger)
