    2026-09-29): $159.00, AHD 720p or CVBS 480p selectable, 170°, IP67, mirrored or non-mirrored selectable, five housings including flush,
    5-pin plug + 20 ft extension; current and size not published. The decided RC mirror (RVS-7180355-IR page) has "Video Input 2 Channel",
    CVBS 1 Vp-p 75 ohm. Video path agreed with options-rd (2026-09-29): VS41 switcher input 1, the default view (their MIRD candidate),
    whose output feeds mirror CH2; CH1 stays the plate camera on reverse
  product: {maker: EchoMaster, pn: PHD5N1, price_usd: 159.00, price_date: 2026-09-29, specs: "CVBS 480p mode, 170°, IP67; current and size not published"}
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
