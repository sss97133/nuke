    car's own screen (Tesla service manual, service.tesla.com__GUID-E473ED74-9C48-4106-936F-C6A8806AAF5B.md)
  product: {maker: EchoMaster, pn: PHD5N1, price_usd: 159.00, price_date: 2026-09-29, each: true,
            specs: "AHD 720p or CVBS 480p selectable, 170 deg, IP67, five mounting housings, 5-pin EchoMaster plug + 20 ft extension, RCA; current and size not published"}
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    taps: ["PDM30 OUT23 (RC mirror feed, RUN): camera power"]
    door_cavities: 1
    notes: "set CVBS for the VS41 and the RVS mirror (both CVBS); the pocket, lens window and seal are the producer's (BMIR). OPEN: current draw and body size (not on the maker's page)"
    adds:
      - {id: MCAMB_L_PWR, gauge: 20, spec: M22759/32, from: "PDM30:OUT23 (splice with MIRROR_PWR)", to: "BMIR-L connector (camera +12 V)", current_a: null, length_ft_est: 9, basis: "as MCAM_L_PWR"}
      - {id: MCAMB_L_VID, gauge: null, spec: "kit coax (RCA)", from: "BMIR-L camera", to: "MIRD VS41 input 3", current_a: 0, length_ft_est: 11, basis: "as MCAM_L_VID"}
      - {id: MCAMB_R_PWR, gauge: 20, spec: M22759/32, from: "PDM30:OUT23 (splice with MIRROR_PWR)", to: "BMIR-R connector (camera +12 V)", current_a: null, length_ft_est: 9, basis: "as MCAM_L_PWR"}
      - {id: MCAMB_R_VID, gauge: null, spec: "kit coax (RCA)", from: "BMIR-R camera", to: "MIRD VS41 input 4", current_a: 0, length_ft_est: 11, basis: "as MCAM_L_VID"}
    mass_g_est: "35 g of 20 AWG; coax and cameras not published"

BSM:
  name: Blind-spot radar, license-plate bar for metal bumpers (Rydeen BSS2LPB), LED warnings on the A-pillars
  status: candidate
  source: >-
    owner 2026-09-29 ("even like sensors"). Rydeen BSS2LPB page (web_snapshots/rydeenmobile.com__bss2lpb.md): "Applicable for metal
    bumper vehicles (pickup trucks)", bar at the top or bottom of the plate, GPS speed gate, 9-18 V, working current < 100 mA, radars
    IP67 / cables NOT waterproof. Wiring from the family's BSS1 manual (rydeenmobile.com__BSS1-Instruction-Manual-1.md; the BSS2LPB manual is not fetched): ACC/IGN, ground,
    left/right turn, optional reverse
  product: {maker: Rydeen, pn: BSS2LPB, price_usd: 699.00, price_date: 2026-09-29,
            specs: "microwave radar bar with two sensors, 52 deg horizontal, truck 1-80 ft, two LED indicators, buzzer, GPS antenna, 9-18 V, < 100 mA"}
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    taps: ["PDM30 OUT23 (RUN): main unit power", "PDM30 OUT27 / OUT28 (turn L/R): turn inputs", "PDM30 OUT15 (reverse): cross-traffic input"]
    limits: ["OUT23 group: + 0.10 A"]
    door_cavities: 0
    notes: >-
      the radar bar sits at the plate with the RC camera, so its kit cable follows the camera's path into the body (a rear
      entry, the 0ah 'small rear bulkhead' question). Its own GPS gives speed; nothing goes on the MoTeC CAN. OPEN: plate on the
      bumper or the tailgate (mounts.yaml LICENSE-LAMP); a tailgate plate puts the cable across the tailgate hinge
    adds:
      - {id: BSM_PWR, gauge: 20, spec: M22759/32, from: "PDM30:OUT23 (splice with MIRROR_PWR)", to: "BSM main unit ACC/IGN", current_a: 0.10, length_ft_est: 3, basis: "main unit under the dash beside the PDM30 (spot open)"}
      - {id: BSM_GND, gauge: 20, spec: M22759/32, from: "BSM main unit ground", to: "GND-BANK-CAB", current_a: 0.10, length_ft_est: 3, basis: "as BSM_PWR"}
      - {id: BSM_TURN_L, gauge: 20, spec: M22759/32, from: "splice on #80 (PDM30:OUT27) at the PDM30", to: "BSM left turn input", current_a: 0, length_ft_est: 3, basis: "as BSM_PWR"}
      - {id: BSM_TURN_R, gauge: 20, spec: M22759/32, from: "splice on #82 (PDM30:OUT28) at the PDM30", to: "BSM right turn input", current_a: 0, length_ft_est: 3, basis: "as BSM_PWR"}
      - {id: BSM_REV, gauge: 20, spec: M22759/32, from: "splice on #97 (PDM30:OUT15, reverse group)", to: "BSM reverse input", current_a: 0, length_ft_est: 3, basis: "as BSM_PWR"}
      - {id: BSM_BAR, gauge: null, spec: "kit radar-bar cable (not waterproof: sleeve it, joints inside the cab)", from: "radar bar at the plate", to: "BSM main unit", current_a: 0, length_ft_est: 18, basis: "18.4 ft, the cut list v4.2 zone estimate on #97 (PDM30 to the plate camera)"}
    mass_g_est: "29 g of 20 AWG (5 x 3 ft); kit cable, bar and main unit not published"

BSM-SD2:
