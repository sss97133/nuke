    SmartSolar MPPT 75/10-100/20 datasheet (75/15: 15 A, 220 W nominal at 12 V, 75 V max PV, 15 A max PV Isc, terminals 6 mm2/AWG10,
    IP43/IP22, 100 x 113 x 50 mm, 0.6 kg) and manual Rev 10 02/2026 (§4.1 within 3 m of the battery, never above it; §4.2 battery fuse
