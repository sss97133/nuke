COM-ACC:
  name: Starlink and router run off the YellowTop accessory battery (camp power), fused at the battery, own sealed switch, no PDM
  status: candidate
  alternative_to: COM
  source: >-
    owner 2026-09-27: the YellowTop is "for other stuff like accessories" (endpoints.yaml ACC-BATT: it feeds only the amplifier;
    the PDMs run off the Odyssey side). Canon ch.17 §17.2 (fuse within 7 in of the source), §17.1 (1.25 x load, 0.85 x wire),
    §17.8.5 (direct-wired only past a PDM channel or for infrastructure); canon ch.16 §2.3 (ProWire chart: 16 AWG 12.5 A at
    35 C rise)
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    limits: ["fuse 10 A within 7 in of the YellowTop + (1.25 x 6.6 A = 8.25 A, next size 10 A); 16 AWG: 0.85 x 12.5 A = 10.6 A"]
    notes: >-
      Breaks the ch.17 §17.8.5 partition on purpose: no PDM is fed from the accessory battery, so camp loads on it cannot be
      PDM-switched. No low-voltage cutoff unless a device is added (none picked). With the YellowTop in the engine bay the feed
      must reach the cab without the firewall (state row 0ah): ride the amplifier's route (frame rail, floor CableClam at
      AMP-PASS, which is full at 2 of 2) or tap the AMP-BLOCK, whose MIDI 60 A was sized for the amplifier alone (check the
      amplifier's peak draw first). If the YellowTop moves behind the seat (asked 2026-09-29), the feed is short and inside.
      OPEN: YellowTop spot, fuse holder and switch parts, lengths.
    adds:
      - {id: COMACC_FEED, gauge: 16, spec: M22759/32, from: "YellowTop + (10 A fuse within 7 in)", to: "COMMS switch (sealed, >= 10 A)", current_a: 6.6, length_ft_est: null, basis: "depends on where the YellowTop lives"}
      - {id: COMACC_SW, gauge: 16, spec: M22759/32, from: "COMMS switch", to: "SPL-COMMS", current_a: 6.6, length_ft_est: null, basis: "switch spot not set"}
    mass_g_est: "lengths unknown"

COM-TOP:
  name: Starlink Mini on the removable top instead, from a 12 V socket inside the top at the rear pillar, fed through TOP-DISC
  status: candidate
  alternative_to: COM
  requires: [TOP-DISC]
  conflicts_with: [PW]     # same COMMS output as COM (a 20 A output: OUT3 is named by PW); stated here as well as inherited through alternative_to
  source: >-
    top-design's TOP-DISC (#420): 26 x #20, "4 of the spares for a top-mounted Starlink DC pair", #20 = 7.5 A with 20 AWG (MILNEC
    test rating), paralleled #20 pairs per pole, lengths split the 18.4 ft zone as 13 ft body + 5.5 ft top. top-design's check
    (message 2026-09-29): the pole's weak link is the 2 x 20 AWG tails, 0.85 x 14 A = 11.9 A (ProWire chart 20 AWG 7 A, canon
    ch.16 §2.3), and one M81824/1-3 (16-12 AWG) cannot step 12 AWG straight to 2 x 20 AWG (about 17 AWG), so each side steps
    through a 16 AWG stub. Starlink accessories guide: the Mobility Mount is rated for fiberglass; setup guide: a "structurally
    sound, horizontal surface" on vehicles. The USB-C and Ethernet cables are one piece and cannot cross a connector
  product: {maker: Starlink, pn: "same as COM, plus a second 12 V socket inside the top", price_usd: null, price_date: 2026-09-29, specs: "as COM"}
  wire_patterns: ["^SLT_"]
  demand:
    crossings: 0
    pdm30_outputs: 1      # the same COMMS output as COM; it is PDM-protected, not fused
    pdm30_inputs: 0
    top_cavities: 4       # 2 x #20 paralleled per pole; top-design has reserved exactly these 4 (TOP-DISC 18 of 26 with it)
    limits: ["CONFLICT: as COM: it takes the same 20 A COMMS output, OUT3/OUT4 are the only spare 20 A outputs and PW names both (options_v5 ledger on main); with PW it needs a second body PDM or the PDM15 in the cab. Owner call", "PDM output, no fuse: 7 A for Starlink alone (1.25 x 5.0 A) or 9 A with RTR on the same output; never above 11 A, the top pole's 2 x 20 AWG tails at 0.85 x 14 A = 11.9 A", "5.0 A per pole = 2.5 A per #20 contact (7.5 A test rating)", "loop drop at 5.0 A: 0.35 V (2.5 %), with RTR's 1.6 A also on the paired pigtails (canon ch.16 §1.8 resistances; 3 % ceiling ch.16 §2.4)", "the COMMS output is a 20 A output, as in COM (an 8 A output is the same deliberate exception)"]
    notes: >-
      Unplug TOP-DISC before the top comes off (top-design). Over the disconnect the router cannot take Starlink by Ethernet; it
      joins the Mini's Wi-Fi instead. Each side of the joint steps 12 or 14 AWG -> 16 AWG stub (M81824/1-3) -> 2 x 20 AWG
      (M81824/1-2); bench-check both splice fits. The top's flat area and rib structure under the mount are tape item T-15.
    adds:
      - {id: SLT_PT1, gauge: 16, spec: M22759/32, from: "PDM30 COMMS output, first pin (a 20 A output)", to: "SPL-COMMS", current_a: 3.3, length_ft_est: 0.5, basis: "COM's pigtails are not built in this version, so these are its own; paired 16 AWG, MoTeC's range for 20 A outputs (PDM manual printed p.48)"}
      - {id: SLT_PT2, gauge: 16, spec: M22759/32, from: "PDM30 COMMS output, second pin", to: "SPL-COMMS", current_a: 3.3, length_ft_est: 0.5, basis: "as SLT_PT1"}
      - {id: SLT_FEED, gauge: 12, spec: M22759/32, from: "SPL-COMMS", to: "SPL-SLT-P-B0 (M81824/1-3)", current_a: 5.0, length_ft_est: 13, basis: "top-design's 13 ft body share of the 18.4 ft zone; 12 AWG for the drop"}
      - {id: SLT_P_BS, gauge: 16, spec: M22759/32, from: "SPL-SLT-P-B0", to: "SPL-SLT-P-B (M81824/1-2)", current_a: 5.0, length_ft_est: 0.5, basis: "stub into the receptacle backshell: 12 -> 16 on /1-3, 16 -> 2 x 20 on /1-2 (top-design)"}
      - {id: SLT_P_B1, gauge: 20, spec: M22759/32, from: "SPL-SLT-P-B", to: "TOP-DISC receptacle (Starlink + cavity 1)", current_a: 2.5, length_ft_est: 0.5, basis: "paralleled pair, equal length (canon ch.16 §3.3)"}
      - {id: SLT_P_B2, gauge: 20, spec: M22759/32, from: "SPL-SLT-P-B", to: "TOP-DISC receptacle (Starlink + cavity 2)", current_a: 2.5, length_ft_est: 0.5, basis: "as SLT_P_B1"}
      - {id: SLT_P_T1, gauge: 20, spec: M22759/32, from: "TOP-DISC plug (Starlink + cavity 1)", to: "SPL-SLT-P-T (M81824/1-2)", current_a: 2.5, length_ft_est: 0.5, basis: "paralleled pair"}
