      - {id: SEAT_R_PT2, gauge: 16, spec: M22759/32, from: "PDM 20 A output, pin 2 (PDM30:OUT4 pin A16 without PW)", to: "SPL-SEAT-R (M81824/1-3)", current_a: null, length_ft_est: 0.5, basis: "as SEAT_L_PT1"}
