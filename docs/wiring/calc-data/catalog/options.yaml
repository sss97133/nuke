COM:
  name: Starlink Mini on the steel half-cab roof, powered by Starlink's Mini Car Adapter from its own sealed socket on a COMMS output
  status: candidate
  conflicts_with: [PW]     # the COMMS output must be a 20 A output; OUT3/OUT4 are the only spare ones and PW names both; see demand.limits CONFLICT
  source: >-
    owner 2026-09-29 ("communication Wi-Fi connection small starling connector Starlink"). Starlink Mini specification sheet
    (web_snapshots/starlink.com__specification_sheet_mini.md; PDF text read 2026-09-29): 298.5 x 259 x 38.5 mm, 1.10 kg, 110 deg,
    IP67 Type 4 with the DC cable and plug installed, -30 to +50 C, 60 mph+ wind, average 25-40 W, input 12-48 V 60 W, USB PD
    100 W 20 V/5 A minimum, Wi-Fi 5, one latching Ethernet LAN port. Help articles: "only guarantees performance with the
    included Starlink power supply and cable" (0b2d5227-...), Mini "Average: 20-40W, Idle: 15W" (18836c7e-...), no PoE
    (6ee2d80c-...), USB-C cable 5 m, USB-C end indoors only (7c9fb509-...). Accessories guide: Mini Car Adapter for 12-24 V
    outlets, Mini Mobility Mount (sealed, permanent, metal or fiberglass, 9 deg), Mini Starlink Cable 15 m. Setup guide: a
    "structurally sound, horizontal surface" and "Tethering should be used in all cases" on vehicles. Roam page: "In-motion use
    is supported with Roam service plans in select areas". Canon ch.17 §17.1 (limit 1.25 x load, 0.85 x wire); MoTeC PDM manual
    printed p.24 (10 A cap on 8 A outputs; four stay-alive outputs), printed p.48 (18# 11 A at 80 C), PDF p.4 (low-battery logic)
  product: {maker: Starlink, pn: "Starlink Mini kit + Mini Car Adapter (with the Mini USB-C Cable) + Mini Mobility Mount", price_usd: null, price_date: 2026-09-29,
            specs: "dish 1.10 kg; in-motion use needs a Roam plan ($55 / $80 / $175 a month on 2026-09-29); kit and accessory prices not fetched"}
  wire_patterns: ["^COMMS_", "^SL_"]
  demand:
    crossings: 0
    pdm30_outputs: 1      # a 20 A output (MoTeC's wire table puts 20-16 AWG on 20 A outputs): OUT3 if PW is not fitted (see CONFLICT); until then COM-DASH
    pdm30_inputs: 0       # on with RUN; the camp latch is a CANKEY button if top-design's CANKEY is built, else a PDM off-delay
    top_cavities: 0
    taps: ["PDM30 DIG1 (ignition RUN) in the output's logic", "CANKEY button for the camp latch, if CANKEY is built"]
    limits: ["CONFLICT: the COMMS output must be a 20 A output, and OUT3/OUT4 are the only spare 20 A outputs (options_v5 ledger on main: 20 A 6/8 used, spare OUT3/OUT4, both named by PW's designed wires; 8 A 21/22 used, spare OUT21 named by PL and TOP-LIGHT). COM on OUT3 means PW is not fitted. Building COM and PW together needs another body-side 20 A output: a second body PDM (the owner's multiple-PDM direction, state §1 'Owner scope calls', 2026-09-24) or the PDM15 moved to the cab (mounts.yaml PDM15, state row 0ag(b)). Owner call", "COMMS output 7 A for Starlink alone (1.25 x 5.0 A, the Mini's 60 W rating at 12 V) or 9 A with RTR (1.25 x 6.6 A = 8.25 A), on a 20 A output: its two pins take 2 x 16 AWG pigtails (PDM manual printed p.48: 20-16 AWG for 20 A outputs) into SPL-COMMS; the 18 AWG branches allow 0.85 x 11 A = 9.35 A (printed p.48, 80 C)", "on an 8 A output MoTeC's 24-20 AWG leads allow at most 0.85 x 8 A = 6.8 A, under even the 7 A Starlink-alone setting: an 8 A output would be a deliberate exception, an 18 AWG lead on the SSC-N contact (16-24 AWG) as the registry already does for #71 on OUT29, with a Superseal seal check (top-design, 2026-09-29)", "drop on the Starlink path 0.23 V (1.6 %) at 5.0 A: paired 16 AWG pigtails, 4 ft feed and 3 ft ground of 18 AWG (6.23 ohm/1000 ft, canon ch.16 §1.8)"]
    notes: >-
      Off below a battery-voltage threshold (PDM logic) and kept alive key-off in one of the PDM's four stay-alive outputs, only
      if the owner wants camp use (threshold and delay: owner/Dave). The Car Adapter's minimum input and loss are not
      published; measure the draw at the socket. Mount on the steel half-cab roof on the Mobility Mount, tethered, clear of the
      dome lamp and the clearance lamps; roof size is tape item T-15. The USB-C cable's barrel end is IP67 at the dish and its
      USB-C end stays inside, so the roof entry is a sealed gland the USB-C end passes (builder). Starlink rates the Mini to
      50 C; NASA POWER's 2001-2020 July maximum for Las Vegas is 47.6 C (research/2026-09-30_fiberglass-top-disconnect-solar-lighting.md). The Mini's Wi-Fi inside the cab is untested
      (check with a phone at the mock-up).
    adds:
      - {id: COMMS_PT1, gauge: 16, spec: M22759/32, from: "PDM30 COMMS output, first pin (OUT3 if PW is not fitted)", to: "SPL-COMMS (in-line splice beside the PDM30)", current_a: 3.3, length_ft_est: 0.5, basis: "one of the 20 A output's paired pigtails, as the registry's SPL-PDM30-OUT8; equal length"}
      - {id: COMMS_PT2, gauge: 16, spec: M22759/32, from: "PDM30 COMMS output, second pin", to: "SPL-COMMS", current_a: 3.3, length_ft_est: 0.5, basis: "as COMMS_PT1"}
      - {id: SL_SOCK_P, gauge: 18, spec: M22759/32, from: "SPL-COMMS", to: "STARLINK-SOCKET + (Blue Sea 1011, as OUTLET-12V)", current_a: 5.0, length_ft_est: 4, basis: "socket under the dash by the pillar the USB-C cable goes up (estimate)"}
      - {id: SL_SOCK_N, gauge: 18, spec: M22759/32, from: "STARLINK-SOCKET -", to: "GND-BANK-CAB", current_a: 5.0, length_ft_est: 3, basis: "to the cab bank beside the PDM30 (estimate)"}
      - {id: SL_USBC, gauge: null, spec: "Starlink Mini USB-C Cable, 5 m (maker's, from the Car Adapter kit)", from: "Mini Car Adapter in STARLINK-SOCKET", to: "Starlink Mini barrel input", current_a: 0, length_ft_est: 16.4, basis: "the maker's cable length; roof -> headliner -> pillar -> under the dash; coil the rest"}
    mass_g_est: "about 29 g of wire (canon ch.16 §1.8); dish 1.10 kg (spec sheet); adapter and mount not published (their packages are 0.43 kg and 0.6 kg)"

