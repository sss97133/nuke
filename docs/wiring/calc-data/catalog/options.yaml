NAV:
  name: GPS and pitch/roll on the M1 CAN trunk (CSS Electronics CANmod.gps), under the dash; its antenna on the steel half-cab roof
  status: candidate
  source: >-
    owner 2026-09-29 ("GPS ... I like knowing that angle position on the vehicle"). CANmod.gps shop page (web_snapshots/
    www.csselectronics.com__gps-to-can-bus-gnss-imu.md: 300 EUR ex VAT, u-blox NEO-M8U, antenna SMA 3 m magnetic, IP40) and docs
    01.04.01 (canlogger.csselectronics.com__specification.md: 5.0-26 V, 0.6 W, CAN 5k-1M, -25 to +70 C, 48 x 70 x 24 mm, 75 g;
    __connector.md: DB9 pin 9 supply, 3 GND, 7 CAN H, 2 CAN L; __termination.md: 120 ohm on by default; __attitude.md: roll,
    pitch, heading 1 Hz; __dyn_model.md: reference point = rear-axle centre, lever arms in cm). The M130 has one CAN bus and no
    RS232 (M130 datasheet p.2; M1 hardware tech spec p.6)
  product: {maker: CSS Electronics, pn: CANmod.gps, price_usd: null, price_date: 2026-09-29,
            specs: "300 EUR ex VAT; GNSS + 3-axis accel + 3-axis gyro with dead reckoning; roll/pitch/heading, position, speed, altitude at 1 Hz, raw IMU at 100 Hz; 0.6 W; IP40"}
  wire_patterns: ["^NAV_"]
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    top_cavities: 0
    taps: ["PDM30 OUT29 (ignition RUN group: #71 Dakota VHX, GSS_PWR; top-design's CANKEY also taps it): module supply", "CAN trunk CAN_HI / CAN_LO: one stub, 500 mm max (MoTeC PDM manual printed p.49)"]
    limits: ["OUT29 + 0.05 A (0.6 W at 12 V). OUT29 also feeds #71, GSS_PWR and CANKEY: its setting is recomputed at 1.25 x the group total once the VHX, GSS-3000 and keypad currents are known (all unpublished; noted with top-design 2026-09-29)"]
    notes: >-
      Mount flat, x-axis forward, on its own rigid bracket (not the M130's rubber-isolated plate) under the dash within 500 mm
      of the M130-PDM30 trunk; set dynamic model Automotive, sensor fusion on, IMU alignment and the rear-axle lever arms (CSS
      dyn_model, imu_mount_alignment). Termination switch OFF (it is a stub). Move its CAN IDs off the defaults (attitude
      defaults to 01) into a free block once the M1 bus ID map exists; turn the raw IMU stream off unless a display uses it.
      The driver sees pitch and roll through DISP (a MoTeC dash with a custom comms template, or the wireless bridge); without
      DISP use ATT-CLINO. Whether M1 GPR can log its frames is unknown (Dave / MoTeC). Not shared with a motor or solenoid
      output (CSS installation, supply quality). OPEN: the lever arms and antenna reach (tape), the M1 bus bit rate and IDs.
    adds:
      - {id: NAV_PWR, gauge: 20, spec: M22759/32, from: "PDM30:OUT29 (splice with GSS_PWR)", to: "NAV DB9 pin 9 (Supply 5-24 V)", current_a: 0.05, length_ft_est: 3, basis: "module beside the PDM30 under the dash (mounts.yaml PDM30, open); 0.6 W at 12 V"}
      - {id: NAV_GND, gauge: 20, spec: M22759/32, from: "NAV DB9 pin 3 (GND)", to: "GND-BANK-CAB", current_a: 0.05, length_ft_est: 3, basis: "the cab bank beside the PDM30; CSS: one ground reference for all CAN nodes"}
      - {id: NAV_CANH, gauge: 22, spec: "M22759/16 twisted pair", from: "CAN trunk CAN_HI (stub splice)", to: "NAV DB9 pin 7 (CAN 1 H)", current_a: 0, length_ft_est: 1.6, basis: "500 mm stub maximum (MoTeC PDM manual printed p.49), twisted like the trunk"}
      - {id: NAV_CANL, gauge: 22, spec: "M22759/16 twisted pair", from: "CAN trunk CAN_LO (stub splice)", to: "NAV DB9 pin 2 (CAN 1 L)", current_a: 0, length_ft_est: 1.6, basis: "as NAV_CANH"}
      - {id: NAV_ANT, gauge: null, spec: "maker's GNSS antenna lead, SMA plug (u-blox antenna supplied)", from: "NAV SMA", to: "GNSS antenna, magnetic base on the steel half-cab roof", current_a: 0, length_ft_est: 9.8, basis: "the supplied lead is 3 m; whether it reaches the roof from under the dash is a tape item"}
    mass_g_est: "about 19 g of wire (canon ch.16 §1.8 /16 weights, an upper bound for /32); module 75 g (CSS spec page); antenna not published"

NAV-L10:
  name: GPS into the M130 itself (MoTeC GPS-L10 on UDIG6, B11), logged by the ECU; no attitude
  status: candidate
  alternative_to: NAV
  conflicts_with: [WSS-F2]     # both name M130 B11 (UDIG6); wheel-speed's WSS-F2 takes B10 + B11, the last two spare UDIGs (pieces audit 2026-09-29)
  source: >-
    MoTeC GPS-L10 user manual (web_snapshots/www.motec.com.au__GPS-L10%20User%20Manual.md): #41304 (2.8 m) / #41308 (1.5 m);
    M130 "B11, B14 - Udig 6 or 7 - Revision Q or higher only"; "M1 ECU's require a minimum of level 2 Logging"; 4.0-6.0 V, 38 mA;
    RS232 38400 baud NMEA RMC + GGA; 10 Hz; built-in antenna, magnetic base, outside on a horizontal surface; DTM 4-pin, mating
    #68054 (1 Bat-, 2 TX, 3 not connected, 4 5 V). B11 is unused in the registry pinout; B14 is ISO_KILL (state §1 row 57).
    The M130 ships with Logging Level 1 only (M130 datasheet p.2)
  product: {maker: MoTeC, pn: "GPS-L10 #41304 (2.8 m lead) or #41308 (1.5 m lead)", price_usd: null, price_date: 2026-09-29,
            specs: "10 Hz, 66 channels, 48 x 41 x 14 mm, 106 g, -30 to +80 C; price through a MoTeC dealer"}
  wire_patterns: ["^GPSL10_"]
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    m130_pins: 1          # B11 (UDIG6); informational, options_v5 does not read it
    taps: ["M130 sensor 5 V (A02 SEN_5V0_A or A09 SEN_5V0_B): GPS supply", "M130 0 V: GPS pin 1"]
    notes: >-
      Buy a rev Q or later M130 and the Level 2 logging licence (a paid upgrade: owner). The 5 V comes off an M130 sensor rail:
      A09 carries pedal track 2 alone and A02 the engine sensors, so a fault on the roof-run lead pulls that rail down (Dave's
      call, with where pin 1 lands: the manual says "Battery Negative on the logging device", the M1 tech spec p.14 says sensor
      0 V pins carry no current paths). For pitch and roll on this path add the MoTeC 3 Force #57213 (raw accel/gyro/compass on
      CAN 0x610-0x612, 5-24 V, 20-40 mA, for MoTeC dashes: web_snapshots/www.motec.com.au__3%20Force%20Combined%20Sensor.md)
      and a MoTeC dash, or ATT-CLINO.
    adds:
      - {id: GPSL10_TX, gauge: 22, spec: M22759/16, from: "GPS-L10 DTM #68054 pin 2 (TX)", to: "M130:B11 (UDIG6)", current_a: 0, length_ft_est: 3, basis: "M130 under the dash to the GPS lead's DTM joint at the pillar base (estimate)"}
      - {id: GPSL10_5V, gauge: 22, spec: M22759/16, from: "M130 5 V (splice on A02 or A09: Dave)", to: "GPS-L10 DTM pin 4 (5 V)", current_a: 0.038, length_ft_est: 3, basis: "as GPSL10_TX; 38 mA typical (manual)"}
      - {id: GPSL10_0V, gauge: 22, spec: M22759/16, from: "GPS-L10 DTM pin 1 (Bat-)", to: "M130 0 V or ECU ground (Dave)", current_a: 0.038, length_ft_est: 3, basis: "as GPSL10_TX"}
    mass_g_est: "about 14 g of wire (canon ch.16 §1.8); GPS-L10 106 g (manual)"

NAV-DAK:
  name: GPS speed, compass heading and altitude on the Dakota VHX cluster (Dakota Digital GPS-50-2 BIM); no attitude, not on the MoTeC bus
  status: candidate
  alternative_to: NAV
  source: >-
    Dakota Digital GPS-50-2 page (web_snapshots/www.dakotadigital.com__prd837.md): $250.00, 600041 external antenna (110 in
    cable) $30.00, 10 Hz, integrated antenna, speed + compass + altimeter + clock on RTX/HDX/VHX/VFD3 with a black plastic
    control box, 4-3/4 x 2-3/4 x 1 in. Expansion-module list (www.dakotadigital.com__cat646.md): no inclinometer module. VHX
    manual MAN 650314:P p.13 (AUX I/O is for BIM modules only), p.26 (BIM readings on the message display). Its wiring manual
    (dakotadigital.com/pdf/GPS-50-2.pdf) answered HTTP 500 on 2026-09-29, so its power needs are unknown
  product: {maker: Dakota Digital, pn: "GPS-50-2 (+ 600041 external antenna, optional)", price_usd: 250.00, price_date: 2026-09-29,
            specs: "GPS speed/compass/altitude/clock to the VHX; 4k/8k/16k PPM speed output; power not published on the page"}
  wire_patterns: ["^DAKGPS_"]
  demand:
    crossings: 0
    pdm30_outputs: 0
    pdm30_inputs: 0
    taps: ["VHX control box AUX I/O (BIM bus)", "power: unknown until the GPS-50-2 manual is read (likely the VHX's own feeds on OUT29 / DAK_CONST)"]
    notes: >-
      The cheapest GPS on the dash, but no pitch/roll (pair with ATT-CLINO) and nothing reaches the M130 or a logger. Its speed
      output is not used: the speed source is decided (state §3 row 0v: NP205 speedo drive + Dakota SEN-01-5).
    adds: []
    mass_g_est: "not published"

