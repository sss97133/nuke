SEAT-TED:
  name: Cooled and heated front buckets, thermoelectric, one Sanctum heat/cool kit per seat (LeatherSeats.com)
  status: candidate
  source: >-
    owner 2026-09-29 ("air-conditioning we can insert a AC pad on the seats not because then we have to worry about HVAC"). Kit:
    LeatherSeats.com product page (web_snapshots/leatherseats.com__seat-heater-cooler-unit.md) and installation guide
    (leatherseats.com__sanctum-heater-cooler-installation-guide.md): per seat a TED and centrifugal blower for the cushion and
    for the backrest, distribution pads, exhaust ducting, control module, six-setting switch (3 cool, 3 heat), relay, 15 A
    inline fuse, intake bezel for closed backs; "a circuit with a minimum of 15 amps per unit"; the cover must pass air.
    Katzkin's DegreeZ is the same kind of kit but "can only be installed on a Katzkin perforated leather interior"
    (katzkin.com__degreez.md), so it is not a version here
  product: {maker: "LeatherSeats.com (Sanctum)", pn: null, price_usd: 400.00, price_date: 2026-09-29, each: true,
            specs: "no part number published; TED and blower sizes, current per setting, inrush and noise not published; 15 A circuit per seat"}
  demand:
    crossings: 0
    pdm30_outputs: 2
    pdm30_inputs: 0
    door_cavities: 0
    limits: ["one 20 A output per seat, limit 15 A (the kit's own 15 A fuse); holds for a measured draw up to 12 A (>= 1.25 x load, canon ch.17); two seats need 30 A, over one 20 A output's 25 A setting ceiling (MoTeC PDM manual p.24)"]
    notes: >-
      the PDM30's two spare 20 A outputs are OUT3/OUT4, which PW also takes: without PW the seats use them; with PW they go on a
      cab PDM15 (its one spare 20 A output, plus two 8 A outputs in parallel, manual p.6) or two 20 A loads move off the PDM30.
      A bay PDM can't feed them (one 61-pin, #20 contacts). The outputs switch on only with RUN (PDM30 DIG1), not START (DIG10),
      and M130 engine RPM over CAN above cranking speed (M1 General 0x640; PDM manual p.38 RPM example). The kit's relay and fuse
      are left out: the PDM output is both. The DTP seat plugs must be the E-seal (C015) version: 12 AWG /32 is 2.62 mm, and
      the standard #12 seal starts at 3.40 mm (E-seal 2.46-4.01 mm; Deutsch datasheet farnell 628276 printed p.5). OPEN: E-seal
      part numbers; the plaid inserts' backing must pass air; the passenger feed's gauge waits on the bench current (12 AWG
      holds 3 % drop to 8.3 A on the estimated run); the backrest's depth for the back TED; the PDM30 100 A and alternator
      150 A budgets with the seats' 30 A
    adds:
      - {id: SEAT_L_PT1, gauge: 16, spec: M22759/32, from: "PDM 20 A output, pin 1 (PDM30:OUT3 pin A5 without PW; else the cab PDM15's spare 20 A output)", to: "SPL-SEAT-L (M81824/1-3)", current_a: null, length_ft_est: 0.5, basis: "20 A outputs take 20-16 AWG per pin (MoTeC PDM manual p.6); 2 x 16 AWG pigtails per 20 A output, the build's pattern (state 0ac); 7.5 A each at the 15 A limit, 16# 15 A x 0.85 = 12.75 A (manual p.48)"}
