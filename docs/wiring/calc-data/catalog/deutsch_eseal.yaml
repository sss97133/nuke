# K5 harness — DEUTSCH E-SEAL (C015) part numbers for every DT / DTP housing in the catalog
#
# Research input, read 2026-09-29. Nothing here is consumed by reconcile_v5.py yet: parts.yaml, endpoints.yaml and the
# registry are unchanged. It answers one question per housing: what is the "E-seal" version, what wire does its seal take.
#
# What an E-seal is: Deutsch DT family catalog p.23 (reference_documents/component_drawings/DEUTSCH_DT_DTM_DTP_Catalog.pdf,
#   PDF page 7): "The C015 modification offers a reduced diameter insert cavity allowing for a proper seal with smaller wire
#   insulation. The C015 modification is also referred to as an 'E' seal." The same page lists the welded-flange
#   modifications (BL04, BL08, CL03, L012, LE14 ...). The catalog page prints no part numbers and no seal range;
#   every PN and range below is from a TE product page or a distributor page (its url is on the entry).
#
# Naming, as found (not assumed):
#   plain housings: standard PN + "-C015"  (DT06-2S -> DT06-2S-C015; DTP04-4P -> DTP04-4P-C015).
#   flange receptacles: the "-L012" (welded flange) housings have NO "-L012-C015" PN. TE lists the E-seal welded flange under
#   its own modification code CL03 (DT04-12PA-CL03, DT04-12PB-CL03, DT04-12PC-CL03), for the 12-way only. TE has no CL03 for
#   the 6-way DT or the 4-way DTP receptacle (404 on te.com), so those two flange housings have no E-seal PN we could find.
#   CL03 is a different flange code from L012; whether its footprint is the same is not stated on the TE page. Compare the
#   TE drawings before swapping it into a firewall cutout.
#
# Our wire (state row 0ai; M22759/32 finished OD): 20 AWG 1.27 mm, 18 AWG 1.52, 16 AWG 1.73, 14 AWG 2.16, 12 AWG 2.62.
# Each entry says which of those the seal takes (seal_range_mm is TE's "Compatible Insulation Diameter Range").
# The contact is a second gate: DT size 16 contacts take 20-16 AWG, DTP size 12 contacts 14-12 AWG (families.yaml), so
# "usable_awg" is the seal range AND the contact range.
#
# The finding that matters: 20 AWG M22759/32 (1.27 mm) is under the E-seal minimum (1.35 mm; 1.4 on the CL03 flange
# parts) by 0.08-0.13 mm, and under the standard DT seal minimum (2.23 mm) by nearly 1 mm. No DT E-seal PN takes 20 AWG at
# this OD. 18 and 16 AWG are the only gauges that pass both the E-seal and the size 16 contact. DTP: the E-seal (2.5-4.0 mm)
# takes 12 AWG only; 14 AWG (2.16 mm) is under it, and the standard DTP seal (3.4-4.9 mm) takes neither.
#
# DTM: no E-seal PN exists that we could find (te.com 404 for DTM06-4S-C015 and DTM04-4P-C015). The standard DTM housings
# already list 1.3-3.0 mm (DTM06-4S) and 1.35-3.05 mm (DTM04-4P), which is the DT E-seal range, so the size 20 side needs no
# "E" version. 20 AWG (1.27 mm) is 0.03 mm under the DTM06-4S minimum and 0.08 mm under the DTM04-4P minimum.
#
# Unknown stays unknown: a null is a PN or a number not found, with the checks made in `not_found`.
# Prices are the qty-1 price on the vendor page on price_date (USD), not a quote. price_usd is the lowest qty-1 price among
# the vendors listed in in_stock_at; when nothing has stock it is the list price and in_stock_at is empty.
#
# How the pages were read (be careful with these): te.com and digikey.com were read through the WebFetch tool, which returns
# a model's summary of the page, not raw HTML. Two TE ranges (DT04-12PA-CL03, DT04-12PB-CL03) were re-read with a verbatim
# quote and matched. DigiKey stock was re-read on the product page (not the search page) for every part except
# DT04-12PA-CL03 and DT04-12PB-CL03, whose product links did not open; their stock is what the keyword search page showed,
# read twice. customconnectorkits.com and buydeutsch.com are Shopify stores read through their product .js endpoints
# (available: true/false, price). prowireusa.com was checked only by its own SKU path; a 404 there does not prove ProWire
# lacks the part (it lists some parts under a p-####-name.html path).
# Requests: 10 s between requests to one host; ProWire 20 s; no accounts; nothing downloaded.

read_on: 2026-09-29
price_date: 2026-09-29

catalog:
  file: reference_documents/component_drawings/DEUTSCH_DT_DTM_DTP_Catalog.pdf   # local, not committed
  page: "23 (PDF page 7) — DT Family, Special Modifications: C015 Modification"

wire:                      # M22759/32 finished OD, mm (state row 0ai)
  20: 1.27
  18: 1.52
  16: 1.73
  14: 2.16
  12: 2.62

families:
  DT:
    contact_size: 16
    contact_awg: [20, 16]                        # families.yaml dt
    standard_seal_range_mm: [2.23, 3.68]         # te.com DT06-2S
    standard_seal_takes_awg: [12]                # 2.62 mm is the only one of ours inside; a 12 AWG wire does not crimp in a size 16 contact
    eseal_seal_range_mm: [1.35, 3.05]            # te.com C015 pages (DT06-2S-C015, DT04-2P-C015, DT04-08PA-C015, DT06-08SA-C015, DT06-12SA-C015, DT06-12SB-C015, DT06-6S-C015, DT04-6P-C015, DT04-12PB-CL03)
    eseal_flange_cl03_range_mm: [1.4, 3.8]       # te.com DT04-12PA-CL03 and DT04-12PC-CL03 (DT04-12PB-CL03 reads 1.35-3.05)
  DTP:
    contact_size: 12
    contact_awg: [14, 12]                        # families.yaml dtp
    standard_seal_range_mm: [3.4, 4.9]           # te.com DTP06-4S
    standard_seal_takes_awg: []
    eseal_seal_range_mm: [2.5, 4.0]              # te.com DTP04-2P-C015, DTP06-2S-C015, DTP04-4P-C015, DTP06-4S-C015
  DTM:
    contact_size: 20
    eseal: none found
    standard_seal_range_mm: {DTM06-4S: [1.3, 3.0], DTM04-4P: [1.35, 3.05]}   # te.com

