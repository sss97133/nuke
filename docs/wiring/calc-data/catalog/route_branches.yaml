# K5 harness ROUTE BRANCHES (curated input -> load_map_rows.py -> load_harness_branches -> route_harness_segments)
#
# The route graph's branches between standing points, and the junctions where bundles split, in the twin frame
# (+x driver, -y front, +z up, metres; K5_harness_workspace_v2.blend). Drawn by the system's route study of 2026-10-15
# (docs/wiring/research/2026-10-15_route-branches.md). min_clearance_mm is the nearest twin mesh (negative = inside a
# crude bounding box); confidence is low where the twin's engine sits about 15 cm into the cab. The June branches L08,
# L09, L21, L25, L26 and L27 stay as they are in the model; K5B_R04 joins the amplifier and subwoofer junction to them.
# Second study (2026-10-15, research/2026-10-15_route-branches-2.md): 116 branches and 16 junctions join every point pair
# the live segments need (196 pairs, 390 segments); 72 low and 44 medium confidence.
method: twin route study 2026-10-15 (hand-routed trunk and branch, headless Blender BVH clearance)
source: docs/wiring/research/2026-10-15_route-branches.md; docs/wiring/research/2026-10-15_route-branches-2.md
