comparisons:
- question: Electric Life 4990-10-356 '2 Door OE Style GM Switch Kit' against the Nu-Relics door switches in the registry (WIN-SW-L, WIN-SW-R)
  electric_life_4990_10_356:
    price_usd: 195
    price_scraped_at: '2026-09-29'
    url: https://www.affordablestreetrods.com/2-door-oe-style-gm-switch-kit.html
    what_the_page_says:
    - Two door GM Style chrome switch kit with three switches.
    - Control both front doors from the drivers door.
    - Comes complete with switches, wiring harness and instructions.
    - Plug and Play Harness makes for a quick and easy installation
    - Switches can be mounted directly over the crank hole, no additional holes necessary.
    - GM style switches give your ride that original factory look.
    fitment_claim: two-door GM (no years or models named)
    not_on_the_page:
    - switch polarity type
    - wire gauge
    - connector types
    - current rating
    - lock switches
  registry_nu_relics:
    what: 'WIN-SW-L: window master (both windows) + lock rocker; WIN-SW-R: passenger window switch in series with the master; Nu-Relics 17383-2
      chrome reverse-polarity switches'
    source: docs/wiring/calc-data/catalog/endpoints.yaml WIN-SW-L, WIN-SW-R
    motors: 'Nu-Relics ACI motors: ''Our ACI motors are reverse polarity motors and require reverse polarity switches'' (reference_documents/web_snapshots/www.nu-relics.com__17383-2.md);
      amp draws 3 no load, 5 low load, 11 high load, 20 stall'
    kit_price_usd: 508
    kit_price_source: 'www.nu-relics.com__17383-2.md, fetched 2026-09-28 (''Our Price: $508.00'', regulators and ACI motors; the switch kit is
      an option added at a discount)'
  findings:
  - 'The Electric Life kit covers the windows only (three switches: driver master for both windows plus a passenger switch). The registry''s driver
    panel also carries the lock rocker, so the locks would still need their own switches.'
  - Mounting over the crank hole keeps the door panels uncut. The registry's Nu-Relics chrome switches mount in the door panel.
  - Its polarity type is not stated. The ACI motors need reverse-polarity switches, so the kit fits only if Electric Life's instructions say reverse
    polarity.
  - 'Its ''plug and play'' harness would be replaced here: in this build the window power comes from PDM30 OUT3 and OUT4 (20 A pigtail splices)
    through the DTP 4-way door pass-throughs, so only the switches carry over.'
  - 'Price on 2026-09-29: $195 for the three switches and harness. The Nu-Relics switch option price is not in the saved page.'
  verdict: 'candidate, not a drop-in: read Electric Life''s instructions for polarity, gauge and connectors before it replaces WIN-SW-L / WIN-SW-R'
