# K5 harness — PARTS catalog (curated input; reconcile_v5.py → kits_v5.py)
#
# One entry per orderable code, keyed EXACTLY as the vendor cart shows it (orders/*.json), so the
# BOM derived from the registry diffs line-for-line against the carts. Wire (M22759/…, M27500-…) is
# decoded from the MIL code in kits_v5.py and not repeated here.
#
# kind: kit | contact | terminal | seal | plug | housing | backshell | boot | adapter | lug | splice |
#       sleeve | shrink | marker | adhesive | fuse | holder | stud | connector | cable | module | tool
# pool: parts not tied to one wire end (shrink stock, markers, fuses) → claimed by a pool, sized at
#       the formboard (canon ch.18 §6–7), not per endpoint.
# status for parts outside every cart: to_buy | via_dave (bought with the M130) | open (a pick or a
#       photo decides the PN).

