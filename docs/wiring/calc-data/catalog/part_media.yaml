# K5 harness — PART MEDIA: a photo, drawing and 3D model link for every piece (curated; PIECES lane, 2026-09-29)
#
# One entry per parts.yaml code (entry: part) and per registry endpoint (entry: device). URLs only: no image, PDF or CAD
# file is committed (public repo; the makers' and vendors' terms apply to their files).
#
#   what        plain name of the physical piece
#   maker       who makes it (the vendor in brackets when the photo is a vendor's)
#   maker_pn    the maker's part number, exact ("unknown" when the registry does not name one)
#   photo       {url, page, fetched}: a direct image of that part number, the page it came from, the date it was fetched
#   drawing     {url, page}: maker drawing or datasheet
#   cad         {url, format, license_note}: 3D model that downloads without an account
#   datasheet / instructions   extra maker PDFs where both a drawing and a datasheet exist
#   mates_with  codes it plugs into or onto (part codes, or endpoint ids for a device)
#   piece       for an endpoint whose physical piece is a catalogued part: that part's code (same media)
#   confidence  exact_pn: the image is of this part number (its file name, label or the maker's page for it)
#               same_family_photo: a sibling, a candidate replacement, or an unlabelled family image — the note says which
#               unknown: no photo that can be defended
#   note        one line on the source or on what the photo is not
#
# Hosts that answer scripted requests with 403 but open in a browser: te.com (images, DocumentDelivery drawings and
# models), odysseybattery.com. Every other photo URL here answered 200/206 to a plain request on 2026-09-29, or was read
# off a page fetched that day. See PART_MEDIA_REPORT.md for counts and gaps.

