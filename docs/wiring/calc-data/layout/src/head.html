<title>K5 Harness Layout</title>
<style>
/* One engineering workspace in Nuke's design book (Arial, Courier New for data, square corners, colour is data only):
   project tree left, one view at a time in the centre, structured properties right, linked tables along the bottom.
   The Manual view is the vintage GM service-manual page: figure, callouts, tables. Select anything and it lights up
   in every pane, the same way everywhere. */
:root{
  --bg:#e9ecef; --panel:#ffffff; --panel-2:#f5f6f8; --sheet:#fbfbfc; --ink:#13171c; --muted:#56606b; --faint:#8a939d;
  --rule:#dde1e6; --rule-2:#c3c9d0; --hover:rgba(19,23,28,.045); --row-rel:rgba(11,98,214,.07);
  --accent:#0b62d6; --accent-ink:#ffffff; --accent-tint:rgba(11,98,214,.12); --accent-2:rgba(11,98,214,.30);
  --warn:#a85600; --warn-tint:rgba(168,86,0,.10); --bad:#bf3228; --ok:#1c7545;
  --loom:#22282e; --loom-dim:#c1c7cd; --part-dim:#e1e5e9; --part-dim-edge:#b2b9c0; --part-edge:rgba(19,23,28,.55);
  --s-fixed_by_engine:#56606b; --s-decided:#1c7545; --s-proposed:#6a4bb8; --s-open:#a56d0c; --s-flag:#bf3228;
  --axis:#7d8791; --drawing-filter:none; --photo-bg:#ffffff;
  --f-ui:Arial,Helvetica,sans-serif;
  --f-cond:Arial,Helvetica,sans-serif;
  --f-mono:"Courier New",Courier,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e12; --panel:#13181e; --panel-2:#171d24; --sheet:#0f1318; --ink:#e3e8ed; --muted:#9ba5b0; --faint:#6d7884;
  --rule:#242c35; --rule-2:#37414c; --hover:rgba(227,232,237,.05); --row-rel:rgba(99,160,255,.10);
  --accent:#63a0ff; --accent-ink:#0a0f15; --accent-tint:rgba(99,160,255,.16); --accent-2:rgba(99,160,255,.36);
  --warn:#f0a34a; --warn-tint:rgba(240,163,74,.12); --bad:#ff6a5f; --ok:#4cc382;
  --loom:#dfe5ea; --loom-dim:#39424b; --part-dim:#1f262e; --part-dim-edge:#46505a; --part-edge:rgba(227,232,237,.6);
  --s-fixed_by_engine:#a9b3be; --s-decided:#4cc382; --s-proposed:#a98cf2; --s-open:#e5a73a; --s-flag:#ff6a5f;
  --axis:#7b8792; --drawing-filter:invert(1) hue-rotate(180deg) brightness(.9); --photo-bg:#f3f4f5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e12; --panel:#13181e; --panel-2:#171d24; --sheet:#0f1318; --ink:#e3e8ed; --muted:#9ba5b0; --faint:#6d7884;
  --rule:#242c35; --rule-2:#37414c; --hover:rgba(227,232,237,.05); --row-rel:rgba(99,160,255,.10);
  --accent:#63a0ff; --accent-ink:#0a0f15; --accent-tint:rgba(99,160,255,.16); --accent-2:rgba(99,160,255,.36);
  --warn:#f0a34a; --warn-tint:rgba(240,163,74,.12); --bad:#ff6a5f; --ok:#4cc382;
  --loom:#dfe5ea; --loom-dim:#39424b; --part-dim:#1f262e; --part-dim-edge:#46505a; --part-edge:rgba(227,232,237,.6);
  --s-fixed_by_engine:#a9b3be; --s-decided:#4cc382; --s-proposed:#a98cf2; --s-open:#e5a73a; --s-flag:#ff6a5f;
  --axis:#7b8792; --drawing-filter:invert(1) hue-rotate(180deg) brightness(.9); --photo-bg:#f3f4f5;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);height:100%}
body{color:var(--ink);font:13px/1.45 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .warn{color:var(--warn)} .bad{color:var(--bad)} .ok{color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lab{font:700 9.5px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-align:left}
.linkish:hover{text-decoration:underline}
.linkish.mono{font-family:var(--f-mono);font-size:12px}
.btn{border:2px solid var(--rule-2);background:var(--panel);padding:3px 10px;cursor:pointer;font:500 12.5px var(--f-cond);letter-spacing:.02em;min-height:26px}
.btn:hover{background:var(--hover)} .btn[disabled]{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:2px solid var(--rule-2)}
.seg button{border:0;border-right:1px solid var(--rule);background:var(--panel);padding:3px 9px;cursor:pointer;font:500 12px var(--f-cond);letter-spacing:.02em;color:var(--muted);min-height:26px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:hover:not([aria-pressed="true"]){background:var(--hover);color:var(--ink)}
.tg{border:2px solid var(--rule-2);background:var(--panel);color:var(--muted);padding:2px 8px;min-height:24px;cursor:pointer;font:500 12px var(--f-cond);letter-spacing:.02em}
.tg[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tg[disabled]{opacity:.45;cursor:default}
.sw{display:inline-block;width:11px;height:11px;border:1px solid var(--part-edge);vertical-align:-1px;flex:none}
.wc{display:inline-block;width:18px;height:9px;border:1px solid var(--part-edge);vertical-align:0;flex:none;border-radius:1px}
.sq{width:8px;height:8px;display:inline-block;background:var(--c);flex:none}
.st-fixed_by_engine{--c:var(--s-fixed_by_engine)} .st-decided{--c:var(--s-decided)} .st-proposed{--c:var(--s-proposed)}
.st-open{--c:var(--s-open)} .st-flag{--c:var(--s-flag)}

/* ---- app frame: header, summary strip, workspace */
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%}
.hd{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding-inline:16px;padding-block:7px;background:var(--panel);border-bottom:1px solid var(--rule)}
.hd h1{font:600 14px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;margin:0;white-space:nowrap}
.hd .sub{color:var(--muted);font-size:12px;min-width:0}
.hd .r{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted)}
.vdata{border:0;background:none;cursor:pointer;color:var(--muted);font:12px var(--f-ui);padding:2px 0}
.vdata b{font:700 12.5px var(--f-mono);color:var(--ink)}
.vdata:hover b{text-decoration:underline}
.vdpanel{position:absolute;right:16px;top:44px;z-index:12;width:min(460px,calc(100vw - 32px));background:var(--panel);border:2px solid var(--ink);padding:10px 12px 12px;max-height:70vh;overflow:auto}
.vdpanel h4{margin:8px 0 4px;font:700 9.5px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding-inline:16px;padding-block:6px;background:var(--panel-2);border-bottom:1px solid var(--rule)}
.strip .row{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.strip .row > .lab{flex:none;width:68px}
.decs{display:flex;flex-wrap:wrap;gap:6px;padding-block:1px;min-width:0}
.dec{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--rule-2);border-left:4px solid var(--warn);background:var(--panel);padding:3px 9px 3px 7px;cursor:pointer;white-space:nowrap;font-size:12.5px;min-height:28px}
.dec b{font:700 12px var(--f-mono);color:var(--warn)}
.dec .need{font:700 9px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule-2);padding:2px 4px}
.dec:hover{background:var(--hover)} .dec[aria-pressed="true"]{border-color:var(--accent);border-left-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cov{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;align-items:center}
.cov::before{content:"Coverage";font:600 10.5px/1 var(--f-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);width:68px}
.cov button{border:0;background:none;padding:2px 0;cursor:pointer;color:var(--muted);white-space:nowrap}
.cov button b{font:600 12.5px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.cov button:hover{color:var(--ink)} .cov button:hover b{text-decoration:underline}
.cov button.w b{color:var(--warn)}

.ws{display:grid;grid-template-columns:268px minmax(0,1fr) 400px;grid-template-rows:minmax(0,1.55fr) minmax(0,1fr);
  grid-template-areas:"tree centre props" "dock dock props";gap:2px;background:var(--rule-2);min-height:0}
.pane{background:var(--panel);min-width:0;min-height:0;display:flex;flex-direction:column}
.tree{grid-area:tree} .centre{grid-area:centre} .props{grid-area:props} .dock{grid-area:dock}
.ph{display:flex;align-items:center;gap:8px;padding-inline:12px;padding-block:0;min-height:34px;border-bottom:1px solid var(--rule);background:var(--panel-2);flex:none}
.ph .lab{margin-right:auto}

/* ---- project tree */
.tree .tq{padding:6px 10px;border-bottom:1px solid var(--rule);flex:none}
.inp{width:100%;border:1px solid var(--rule-2);background:var(--panel);padding:4px 8px;min-height:28px;font-size:12.5px}
.tlist{flex:1;min-height:0;overflow:auto;padding-block:4px;font-size:12.5px}
.tn{display:flex;align-items:center;gap:4px;min-height:23px;padding-right:8px;cursor:pointer;white-space:nowrap;position:relative}
.tn:hover{background:var(--hover)}
.tn .tw{width:16px;flex:none;text-align:center;color:var(--faint);font-size:10px}
.tn .tl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tn .tc{margin-left:auto;padding-left:8px;color:var(--faint);font:11px var(--f-mono)}
.tn .ti{font:500 11.5px var(--f-mono);color:var(--muted);flex:none}
.tn.rel{background:var(--row-rel)}
.tn.sel{background:var(--accent-tint);box-shadow:inset 2px 0 0 var(--accent)}
.tn.sel .tl{color:var(--ink);font-weight:500}
.tn.k-sys .tl{font-weight:600}
.tn.spare .tl{color:var(--faint)}
.tmore{padding:4px 12px;color:var(--muted);font-size:12px}

/* ---- centre: view tabs, view tools, stage */
.vtabs{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--rule);background:var(--panel-2);flex:none;min-height:34px;padding-left:4px;overflow-x:auto}
.vtabs button{border:0;background:none;padding:0 14px;cursor:pointer;font:600 12.5px var(--f-cond);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.vtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
.vtabs .ctx{margin-left:auto;display:flex;align-items:center;padding-inline:12px;font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.vtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-inline:10px;padding-block:5px;border-bottom:1px solid var(--rule);flex:none;font-size:12px}
.vtools .grp{display:flex;align-items:center;gap:5px}
.vtools .sp{flex:1}
.vtools input[type=range]{width:90px;accent-color:var(--ink)}
.vtools output{font:11.5px var(--f-mono);color:var(--muted);min-width:34px}
.stage{position:relative;flex:1;min-height:0;background:var(--sheet);overflow:hidden}
.view{position:absolute;inset:0}
.sbar{display:flex;gap:14px;align-items:center;padding-inline:10px;min-height:24px;border-top:1px solid var(--rule);font:11px var(--f-mono);color:var(--muted);flex:none;white-space:nowrap;overflow:hidden}
.sbar .cap{margin-left:auto;font-family:var(--f-ui);overflow:hidden;text-overflow:ellipsis}

/* vehicle 2D */
.vp{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world img{position:absolute;left:0;top:0;width:100%;height:100%;filter:var(--drawing-filter);pointer-events:none;user-select:none}
.world svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.tick line{stroke:var(--axis);stroke-width:calc(1px / var(--k))} .tick text{fill:var(--axis);font:calc(10px / var(--k)) var(--f-mono)}
.axis line{stroke:var(--axis);stroke-width:calc(1px / var(--k));stroke-dasharray:calc(6px / var(--k)) calc(4px / var(--k))}
.axis text{fill:var(--axis);font:600 calc(10px / var(--k)) var(--f-cond);letter-spacing:.06em}
.part .b{stroke:var(--part-edge);stroke-width:calc(1px / var(--k));cursor:pointer}
.part.dim .b{fill:var(--part-dim)!important;stroke:var(--part-dim-edge)}
.part.rel .b{fill:var(--part-dim)!important;stroke:var(--accent);stroke-width:calc(1.5px / var(--k))}
.part.pri .b{fill:var(--accent-2)!important;stroke:var(--accent);stroke-width:calc(2px / var(--k))}
.part.hov .b{stroke:var(--ink);stroke-width:calc(2px / var(--k))}
.ctx .b{fill:none;stroke:var(--faint);stroke-width:calc(1px / var(--k));stroke-dasharray:calc(5px / var(--k)) calc(3px / var(--k))}
.ctx text{fill:var(--muted);font:500 calc(10px / var(--k)) var(--f-cond);letter-spacing:.05em}
.ctx.pri .b{stroke:var(--accent);stroke-width:calc(2px / var(--k))}
.rt{cursor:pointer}
.rt .core{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rt.dim .core{stroke:var(--loom-dim)!important}
.rt.rel .core{stroke:var(--accent)!important;opacity:.62}
.rt.pri .core{stroke:var(--accent)!important}
.rt .edge{fill:none;stroke:var(--sheet);stroke-linecap:round;stroke-linejoin:round}
.rt .flagln{fill:none;stroke:var(--warn);stroke-width:calc(1.4px / var(--k));stroke-dasharray:calc(2px / var(--k)) calc(3px / var(--k))}
.nd .b{stroke:var(--loom);stroke-width:calc(1px / var(--k))}
.nd.dim .b{stroke:var(--loom-dim)}
.nd.rel .b,.nd.pri .b{stroke:var(--accent);stroke-width:calc(1.6px / var(--k))}
#ov.has-sel .gapln:not(.rel){opacity:.3}
.gapln{stroke:var(--warn);stroke-width:calc(1.2px / var(--k));stroke-dasharray:calc(3px / var(--k)) calc(2px / var(--k))}
.halo{fill:none;stroke:var(--accent);stroke-width:calc(2.5px / var(--k))}
.mg{fill:none;stroke:var(--accent);stroke-width:calc(1px / var(--k));stroke-dasharray:calc(4px / var(--k)) calc(3px / var(--k))}
.xh{stroke:var(--accent);stroke-width:calc(1.4px / var(--k))}
.lbl{fill:var(--ink);font:500 calc(10.5px / var(--k)) var(--f-mono);paint-order:stroke;stroke:var(--sheet);stroke-width:calc(3px / var(--k))}
.lbl.pri{fill:var(--accent);font-weight:600}
.zbar{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:3}
.zbar .btn{min-width:30px;padding-inline:8px;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 20px);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);padding:4px 8px;font-size:11px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--c)}
.legend i.bx{width:11px;height:9px;border:1px solid var(--c);background:var(--f,transparent)}
.legend i.ds{border-top:1.5px dashed var(--c)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);padding:5px 8px;font-size:12px;max-width:300px;z-index:5;display:grid;gap:2px}
.tip .mono{font-size:11px;opacity:.85}
.v3d{position:absolute;inset:0;background:var(--sheet)}
.v3d canvas{display:block;width:100%!important;height:100%!important;outline:none}
.man{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px 12px 32px}
.mpage{background:#ffffff;color:#111111;width:min(816px,100%);margin:0 auto 16px;padding:32px 44px 36px;border:2px solid #111111;font:12px/1.42 Arial,Helvetica,sans-serif;color-scheme:light}
.mpage a,.mpage .go{color:#111111}
.mrun{display:flex;justify-content:space-between;font:700 11px/1 Arial,Helvetica,sans-serif;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:5px;margin-bottom:18px}
.mpage h1{font:700 30px/1.1 Arial,Helvetica,sans-serif;text-align:center;margin:10px 0 2px}
.mpage h2{font:700 21px/1.15 Arial,Helvetica,sans-serif;text-align:center;margin:0 0 4px;text-transform:uppercase}
.mpage h3{font:700 14px/1.2 Arial,Helvetica,sans-serif;text-align:center;margin:18px 0 10px;text-transform:uppercase;letter-spacing:.02em}
.mpage h4{font:700 11px/1.2 Arial,Helvetica,sans-serif;margin:10px 0 4px;text-transform:uppercase}
.msub{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:14px}
.mtoc{width:min(390px,100%);margin:0 auto 6px;font-size:11.5px}
.mtoc div{display:flex;gap:6px;align-items:baseline}
.mtoc .dots{flex:1;border-bottom:1px dotted #111;transform:translateY(-3px)}
.mcols{column-count:2;column-gap:26px;text-align:justify;hyphens:auto}
.mcols p{margin:0 0 8px;break-inside:avoid-column}
.mnote b{font-weight:700}
.mfig{margin:8px 0 4px;border:1px solid #111}
.mfig svg{display:block;width:100%;height:auto}
.mcap{text-align:center;font-size:11px;margin:4px 0 12px}
.mt{width:100%;border-collapse:collapse;font:10.5px/1.25 Arial,Helvetica,sans-serif;margin:4px 0 6px;color:#111111}
.mt th,.mt td{color:#111111}
.mt th{border:1px solid #111;padding:3px 4px;text-align:center;font-weight:700;text-transform:uppercase;background:#ffffff}
.mt td{border:1px solid #111;padding:2px 4px;vertical-align:top}
.mt td.c{text-align:center} .mt td.m,.mt span.m{font-family:"Courier New",Courier,monospace;font-size:11px}
.mt tr[data-go]{cursor:pointer}
.mt tr[data-go]:hover td{background:#eef3fb}
.mt tr.on td{background:#d5e3f8}
.mtab{border:3px double #111;padding:6px 8px 8px;margin:6px 0 10px}
.mtab .t{font:700 12px Arial,Helvetica,sans-serif;text-align:center;text-transform:uppercase;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 26px}
.mconn{break-inside:avoid;min-width:0}
.mconn .face{display:flex;justify-content:center;margin:4px 0 2px}
.mconn .face svg{max-width:100%;height:auto}
.mconn .nm{text-align:center;font:700 11px Arial,Helvetica,sans-serif;text-transform:uppercase;margin:2px 0 4px}
.mconn .nm[data-go]{cursor:pointer}
.mconn.on .nm{background:#d5e3f8}
.mlater{font-size:10.5px;margin:2px 0}
.mlater b{font-weight:700}
.co{cursor:pointer}
.co circle{fill:#ffffff;stroke:#111111}
.co text{font:700 11px Arial,Helvetica,sans-serif;fill:#111111;text-anchor:middle;dominant-baseline:central}
.co.on circle{fill:#0b62d6;stroke:#0b62d6} .co.on text{fill:#ffffff}
.co.rel circle{stroke:#0b62d6;stroke-width:2.2}
.mt tr.rel td{background:#f0f5fd}
.mpart.rel{stroke:#0b62d6}
.co:hover circle{stroke-width:2.2}
.mpart{fill:#ffffff;stroke:#111111}
.mpart.on{fill:#d5e3f8;stroke:#0b62d6}
.mloom{fill:none;stroke:#111111;stroke-linecap:round;stroke-linejoin:round}
.mloom.on{stroke:#0b62d6;opacity:.85}
.mlead{stroke:#111111;fill:none}
.mdiag{overflow:auto;border:1px solid #111;max-height:1400px;background:#fff}.mdiag::-webkit-scrollbar{width:10px;height:10px;background:#eee}.mdiag::-webkit-scrollbar-thumb{background:#888;border:2px solid #eee}
.mwire{fill:none;stroke:#111111;stroke-width:1;cursor:pointer}
.mwire.imp{stroke-dasharray:5 3}
.mwire.on{stroke:#0b62d6;stroke-width:2.4}
.mwire.rel{stroke:#0b62d6;stroke-width:1.6;opacity:.7}
.mbox.on rect{stroke:#0b62d6;stroke-width:2.4}
.mbox.rel rect{stroke:#0b62d6}
@media (max-width:700px){.mpage{padding:20px 16px 24px}.mcols{column-count:1}.mgrid{grid-template-columns:1fr}.mpage h1{font-size:24px}}
.libwrap{position:absolute;inset:0;display:grid;grid-template-columns:230px minmax(0,1.2fr) minmax(0,1fr);min-height:0}
