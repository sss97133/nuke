
<div class="app">
<header class="hd">
  <button type="button" class="btn treebtn" id="treebtn" aria-controls="tree" aria-expanded="false">Project</button>
  <h1>K5 Harness</h1>
  <span class="sub">1977 K5 Blazer · LS3 · MoTeC M130 · PDM30 in the cab · PDM15 in the bay · one 61-pin D38999 through the firewall</span>
  <span class="r"><button type="button" class="vdata" id="vdbtn" aria-expanded="false" hidden></button><button type="button" class="btn" id="srcbtn">Sources</button></span>
  <div class="vdpanel" id="vdpanel" hidden></div>
</header>

<section class="strip" aria-label="Summary">
  <div class="row"><span class="lab">Needs you</span><div class="decs" id="decs"></div></div>
  <div class="cov" id="cov" aria-label="Coverage"></div>
</section>

<main class="ws">
  <nav class="tree pane" id="tree" aria-label="Project tree">
    <div class="ph"><span class="lab">Project</span>
      <div class="seg" id="treemode"><button type="button" data-m="sys" aria-pressed="true">Systems</button><button type="button" data-m="bun" aria-pressed="false">Bundles</button></div>
    </div>
    <div class="tq"><input class="inp" id="tq" type="search" placeholder="Find a system, device, connector or pin" aria-label="Filter the project tree"></div>
    <div class="tlist" id="tlist" role="tree"></div>
  </nav>

  <section class="centre pane" aria-label="Views">
    <div class="vtabs" role="tablist" id="vtabs">
      <button type="button" role="tab" data-v="man" aria-selected="true">Manual</button>
      <button type="button" role="tab" data-v="vehicle" aria-selected="false">Vehicle</button>
      <button type="button" role="tab" data-v="conn" aria-selected="false">Connector</button>
      <button type="button" role="tab" data-v="sch" aria-selected="false">Schematic</button>
      <button type="button" role="tab" data-v="lib" aria-selected="false">Library</button>
      <span class="ctx" id="vctx"></span>
    </div>
    <div class="vtools" id="vtools"></div>
    <div class="stage" id="stage">
      <div class="view" id="v-man"><div class="man" id="man"></div></div>
      <div class="view" id="v-vehicle" hidden>
        <div class="vp" id="vp"><div class="world" id="world"><img id="lyr-body" alt=""><img id="lyr-mech" alt=""><svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
        <div class="v3d" id="v3d" hidden><div class="vmsg" id="v3d-msg"></div></div>
        <div class="vren" id="vren" hidden></div>
        <div class="zbar" id="zbar"><button type="button" class="btn" data-z="out" aria-label="Zoom out">−</button><button type="button" class="btn" data-z="in" aria-label="Zoom in">+</button><button type="button" class="btn" data-z="fit">Fit</button><button type="button" class="btn" data-z="sel">Selection</button></div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="view" id="v-conn" hidden></div>
      <div class="view" id="v-sch" hidden><div class="sch" id="sch"><svg id="schsvg" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
      <div class="view" id="v-lib" hidden>
        <div class="libwrap"><div class="liblist" id="liblist" aria-label="Parts modelled in 3D"></div><div class="lib"><div class="l3" id="l3"><div class="vmsg" id="l3-msg"></div><div class="l3bar"><span class="st" id="l3-st"></span></div></div><div class="linfo" id="linfo"></div></div></div>
      </div>
    </div>
    <div class="sbar"><span id="cursor">&nbsp;</span><span id="scale"></span><span class="cap" id="vcap"></span></div>
  </section>

  <aside class="props pane" id="props" aria-label="Properties">
    <div class="ph"><span class="lab">Properties</span><button type="button" class="tg" id="provbtn" aria-pressed="false" title="Show where every value comes from">Sources</button></div>
    <div class="phead" id="phead"></div>
    <div class="pbody" id="pbody"></div>
    <div class="pfoot" id="pfoot"></div>
  </aside>

  <section class="dock pane" aria-label="Tables">
    <div class="dtabs" role="tablist" id="dtabs">
      <button type="button" role="tab" data-t="wires" aria-selected="true">Wire list<span class="n" id="n-wires"></span></button>
      <button type="button" role="tab" data-t="pins" aria-selected="false">Pin list<span class="n" id="n-pins"></span></button>
      <button type="button" role="tab" data-t="conns" aria-selected="false">Connectors<span class="n" id="n-conns"></span></button>
      <button type="button" role="tab" data-t="bom" aria-selected="false">BOM<span class="n" id="n-bom"></span></button>
      <button type="button" role="tab" data-t="open" aria-selected="false">Open items<span class="n" id="n-open"></span></button>
      <button type="button" role="tab" data-t="notes" aria-selected="false">Notes<span class="n" id="n-notes"></span></button>
    </div>
    <div class="dtools" id="dtools">
      <input class="inp" id="gq" type="search" placeholder="Filter this table" aria-label="Filter this table">
      <button type="button" class="tg" id="gsel" aria-pressed="false" title="Show only rows linked to the selection">Linked to selection</button>
      <span class="kchips" id="gchips"></span>
      <span class="cnt" id="gcnt"></span>
    </div>
    <div class="gwrap" id="gwrap"><table class="grid" id="grid"></table></div>
  </section>
</main>
</div>
<div class="dlg" id="dlg" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="dlg-h"><div id="dlg-body"></div><div class="btnrow"><button type="button" class="btn" id="dlg-x">Close</button></div></div></div>

<script type="application/json" id="data">__DATA__</script>
<script>
__APPJS__
</script>
