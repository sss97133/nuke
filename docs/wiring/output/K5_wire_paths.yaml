# K5 wire-routing paths.
# For each wire from K5_cut_list.txt, list the landmarks it traverses.
# The compute script sums those landmarks + service loop + bend allowance.
#
# Path = ordered list of landmark IDs the wire follows.
# Repeating a landmark is intentional (e.g., L04 used 3× for cyl 7 = 3 cyl pitches).
#
# flags:
#   shielded       — adds 6" bypass for EMI/heat avoidance routing
#   door_crossing  — adds 6" for door boot flex
#
# Source: K5_measurement_worksheet.md routing notes (2026-04-04 generation).

