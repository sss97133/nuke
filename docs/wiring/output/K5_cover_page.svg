<text x="60" y="724" font-size="11" fill="#000">Companion ground/power wires not enumerated in cut list for analog sensors, coils, injectors.</text>
<text x="60" y="740" font-size="11" fill="#000">These pages show only the signal wires as written; ground returns are pigtail-bundled (e.g. WPCTS30 covers</text>
<text x="60" y="756" font-size="11" fill="#000">both CTS pins) and 5V ref / +12V power wires need separate enumeration in a future cut list revision.</text>
<text x="60" y="772" font-size="11" fill="#000"></text>
<text x="60" y="788" font-size="11" fill="#000">Lighting, switch, audio, and accessory connector PNs not in K5_connector_shopping_list.txt — these render</text>
<text x="60" y="804" font-size="11" fill="#000">as "(connector PN unknown)" on their respective pages. Filling these requires vendor doc lookup.</text>
<text x="60" y="820" font-size="11" fill="#000"></text>
<text x="60" y="836" font-size="11" fill="#000">Wire lengths are zone-distance estimates (cut list +15%/+20% pad). True measured lengths require physical</text>
<text x="60" y="852" font-size="11" fill="#000">tape work on the vehicle and population of K5_landmarks.yaml (currently all values null).</text>
